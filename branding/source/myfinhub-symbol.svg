<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs>
<linearGradient id="wallet" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#32a1ff"/><stop offset="0.16" stop-color="#1b70ff"/><stop offset="0.50" stop-color="#0a4ef0"/><stop offset="0.80" stop-color="#0738c2"/><stop offset="1" stop-color="#03258a"/></linearGradient>
<linearGradient id="walletShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".46"/><stop offset=".10" stop-color="#ffffff" stop-opacity=".16"/><stop offset=".58" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#001758" stop-opacity=".36"/></linearGradient>
<linearGradient id="cardTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ff8f3"/><stop offset=".35" stop-color="#15dce0"/><stop offset=".75" stop-color="#08b8be"/><stop offset="1" stop-color="#078a99"/></linearGradient>
<linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#48d7ff"/><stop offset=".38" stop-color="#1496ff"/><stop offset=".74" stop-color="#1267ef"/><stop offset="1" stop-color="#1646bc"/></linearGradient>
<linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#42f4f1"/><stop offset=".50" stop-color="#12d8e0"/><stop offset="1" stop-color="#00a6b7"/></linearGradient>
<linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f8f8f8"/><stop offset="1" stop-color="#d9dde4"/></linearGradient>
<linearGradient id="wordBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2379ff"/><stop offset=".5" stop-color="#0d51e7"/><stop offset="1" stop-color="#082c9e"/></linearGradient>
<linearGradient id="wordCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2af0f0"/><stop offset=".5" stop-color="#10ced8"/><stop offset="1" stop-color="#078f9e"/></linearGradient>
<radialGradient id="lightTile" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="#ffffff"/><stop offset=".67" stop-color="#f7f8fa"/><stop offset="1" stop-color="#e9edf2"/></radialGradient>
<radialGradient id="darkTile" cx="48%" cy="28%" r="78%"><stop offset="0" stop-color="#293448"/><stop offset=".55" stop-color="#1c2636"/><stop offset="1" stop-color="#111923"/></radialGradient>
<filter id="ds" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
<filter id="ss" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".42"/></filter>
<filter id="ws" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#00133d" flood-opacity=".42"/></filter>
<filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".26"/></filter>
</defs><g id="symbol">
<!-- rear loop -->
<path d="M704 300 C750 278 822 292 849 335 L849 526 L790 526 L790 370 C779 347 754 340 726 350 Z" fill="url(#wallet)" stroke="#0937b3" stroke-width="8" filter="url(#ss)"/>
<!-- back teal card -->
<g filter="url(#ss)"><rect x="342" y="166" width="398" height="242" rx="34" transform="rotate(-15 342 166)" fill="url(#cardTeal)" stroke="#078b98" stroke-width="7"/><path d="M321 209 L665 117" stroke="#e4ffff" stroke-width="7" stroke-linecap="round" opacity=".8"/></g>
<!-- front blue card -->
<g filter="url(#ss)"><rect x="337" y="222" width="392" height="220" rx="31" transform="rotate(-10 337 222)" fill="url(#cardBlue)" stroke="#0853b7" stroke-width="7"/><path d="M326 268 L615 218 Q645 213 647 240 Q650 277 586 337 L319 383 Z" fill="#26e9eb" opacity=".92" transform="rotate(-10 337 222)"/><path d="M338 237 L690 175" stroke="#d3f6ff" stroke-width="7" stroke-linecap="round" opacity=".7" transform="rotate(-10 337 222)"/></g>
<!-- white liner -->
<rect x="247" y="321" width="539" height="414" rx="73" fill="url(#white)" stroke="#cbd0d8" stroke-width="8" filter="url(#ss)"/>
<!-- wallet body -->
<g filter="url(#ds)"><rect x="214" y="310" width="557" height="416" rx="74" fill="url(#wallet)" stroke="#05298d" stroke-width="8"/><rect x="222" y="318" width="541" height="400" rx="68" fill="url(#walletShade)"/><path d="M239 340 C275 315 335 315 390 315 H704" fill="none" stroke="#c9ebff" stroke-width="13" stroke-linecap="round" opacity=".48"/><path d="M235 690 C300 712 635 713 739 681" fill="none" stroke="#001d78" stroke-width="13" stroke-linecap="round" opacity=".28"/></g>
<!-- cyan stem -->
<g filter="url(#ss)"><rect x="468" y="462" width="51" height="188" rx="7" fill="url(#cyan)"/><path d="M468 606 L519 554 L519 650 L468 650 Z" fill="#00adba" opacity=".42"/></g>
<!-- white M/F -->
<g filter="url(#ss)"><path d="M325 456 H374 L431 537 L491 456 H578 L571 500 H516 L430 606 L374 530 V642 H325 Z" fill="url(#white)" stroke="#d4d8de" stroke-width="4" stroke-linejoin="round"/><path d="M517 521 H574 L567 562 H517 Z" fill="url(#white)" stroke="#d4d8de" stroke-width="4" stroke-linejoin="round"/></g>
<!-- strap -->
<g filter="url(#ss)"><path d="M700 464 H831 Q861 464 861 494 V591 Q861 622 830 622 H708 Q657 622 637 589 Q619 556 635 520 Q652 482 700 464 Z" fill="url(#wallet)" stroke="#05278b" stroke-width="8"/><path d="M704 480 H822 Q843 480 843 501 V584 Q843 605 822 605 H710 Q674 605 657 583 Q641 561 653 532 Q666 500 704 480 Z" fill="none" stroke="#001853" stroke-width="3" stroke-dasharray="8 6"/><circle cx="740" cy="543" r="44" fill="url(#white)" stroke="#c8ccd2" stroke-width="5"/><circle cx="740" cy="543" r="35" fill="#fbfbfb"/></g>
</g></svg>