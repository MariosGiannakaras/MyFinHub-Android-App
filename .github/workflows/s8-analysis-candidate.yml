name: S8 Analysis Candidate

on:
  push:
    branches:
      - automation/s8-analysis-20260915
    paths:
      - '.github/workflows/s8-analysis-candidate.yml'

permissions:
  contents: write

jobs:
  validate-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact S8 product candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s8-analysis
          fetch-depth: 1

      - name: Assert candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c72a0270503c79e87962c3e2207e0bd6b87a9f4b"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Apply bounded comparison hardening
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/s8-analysis-20260915
          git show origin/automation/s8-analysis-20260915:scripts/apply_s8_analysis_hardening.py > /tmp/apply_s8_analysis_hardening.py
          python3 /tmp/apply_s8_analysis_hardening.py
          python3 scripts/render_project_tracking.py --check
          git diff --check

      - name: Focused S8 validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug compileDebugKotlin --stacktrace
          git diff --check

      - name: Render fresh Analysis candidates
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish Analysis candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s8-analysis-candidates-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/insights/InsightsScreenshotTestKt/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Commit validated S8 hardening source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/app/myfinhub/android/app/CanonicalInsightsProjection.kt \
            app/src/test/java/app/myfinhub/android/app/CanonicalInsightsProjectionTest.kt
          git diff --cached --check
          git commit -m 'fix(android): harden S8 equivalent month comparisons'
          git push origin HEAD:android/redesign-s8-analysis
