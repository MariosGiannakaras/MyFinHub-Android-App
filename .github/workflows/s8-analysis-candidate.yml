name: S8 Analysis Candidate

on:
  push:
    branches:
      - automation/s8-analysis-20260914
    paths:
      - '.github/workflows/s8-analysis-candidate.yml'

permissions:
  contents: write

jobs:
  apply-validate-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact S8 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s8-analysis
          fetch-depth: 1

      - name: Assert S7 merge base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "25229ed46877b34c4ce112340bfe24062becfd64"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Apply coherent S8 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/s8-analysis-20260914
          git show origin/automation/s8-analysis-20260914:scripts/apply_s8_analysis.py > /tmp/apply_s8_analysis.py
          python3 /tmp/apply_s8_analysis.py
          python3 scripts/render_project_tracking.py --check
          python3 -m unittest discover -s scripts -p test_project_tracking.py
          git diff --check

      - name: Focused S8 validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug compileDebugKotlin --stacktrace
          git diff --check

      - name: Render fresh S8 candidates
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish S8 candidate renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s8-analysis-candidates-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/insights/InsightsScreenshotTestKt/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Commit coherent S8 source without accepting renders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/app/myfinhub/android/app/AppRoute.kt \
            app/src/main/java/app/myfinhub/android/app/CanonicalInsightsProjection.kt \
            app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt \
            app/src/main/java/app/myfinhub/android/feature/activity/ActivityUiState.kt \
            app/src/main/java/app/myfinhub/android/feature/insights/InsightsUiState.kt \
            app/src/main/java/app/myfinhub/android/feature/insights/InsightsScreen.kt \
            app/src/test/java/app/myfinhub/android/app/CanonicalInsightsProjectionTest.kt \
            app/src/test/java/app/myfinhub/android/feature/activity/S8AnalyticsScopeTest.kt \
            app/src/androidTest/java/app/myfinhub/android/feature/insights/S8InsightsSurfaceTest.kt \
            app/src/screenshotTest/kotlin/app/myfinhub/android/feature/insights/InsightsScreenshotTest.kt \
            tracking/android-project-state.json STATUS.md TODO.md docs/CURRENT_HANDOFF.md
          git diff --cached --check
          git commit -m 'feat(android): implement coherent S8 Analysis candidate'
          git push origin HEAD:android/redesign-s8-analysis
