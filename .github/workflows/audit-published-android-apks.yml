name: Audit published Android APKs

on:
  pull_request:
    paths:
      - .github/workflows/audit-published-android-apks.yml
      - scripts/audit_play_protect_apk.py
      - scripts/test_audit_play_protect_apk.py
      - scripts/verify_receipt_apk.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Run standalone audit tests
        run: python3 -m unittest discover -s scripts -p 'test_audit_play_protect_apk.py'
      - name: Configure Java for Android SDK inspection
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android inspection tools
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager is not on PATH on ubuntu-24.04; use the project's pinned SDK locator.
          bash scripts/install-android-sdk.sh
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
      - name: Obtain published signed APKs and safe release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for variant in "rc16 10015" "rc17 10016" "rc18 10017" "rc20 10019" "rc21 10020" "rc22 10021" "rc23 10022" "rc24 10023" "rc25 10024"; do
            read -r label number <<< "$variant"
            mkdir -p "apk-audit/$label"
            gh release download "v1.0.0-$label" --repo "$GITHUB_REPOSITORY" \
              --dir "apk-audit/$label" \
              --pattern "MyFinHub-1.0.0-$label-$number.apk" \
              --pattern "release-metadata.json"
          done
      - name: Inspect only published artifacts; do not install anything
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_play_protect_apk.py \
            --rc16-apk apk-audit/rc16/MyFinHub-1.0.0-rc16-10015.apk \
            --rc16-metadata apk-audit/rc16/release-metadata.json \
            --rc17-apk apk-audit/rc17/MyFinHub-1.0.0-rc17-10016.apk \
            --rc17-metadata apk-audit/rc17/release-metadata.json \
            --rc18-apk apk-audit/rc18/MyFinHub-1.0.0-rc18-10017.apk \
            --rc18-metadata apk-audit/rc18/release-metadata.json \
            --rc20-apk apk-audit/rc20/MyFinHub-1.0.0-rc20-10019.apk \
            --rc20-metadata apk-audit/rc20/release-metadata.json \
            --rc21-apk apk-audit/rc21/MyFinHub-1.0.0-rc21-10020.apk \
            --rc21-metadata apk-audit/rc21/release-metadata.json \
            --rc22-apk apk-audit/rc22/MyFinHub-1.0.0-rc22-10021.apk \
            --rc22-metadata apk-audit/rc22/release-metadata.json \
            --rc23-apk apk-audit/rc23/MyFinHub-1.0.0-rc23-10022.apk \
            --rc23-metadata apk-audit/rc23/release-metadata.json \
            --rc24-apk apk-audit/rc24/MyFinHub-1.0.0-rc24-10023.apk \
            --rc24-metadata apk-audit/rc24/release-metadata.json \
            --rc25-apk apk-audit/rc25/MyFinHub-1.0.0-rc25-10024.apk \
            --rc25-metadata apk-audit/rc25/release-metadata.json \
            --aapt "$ANDROID_HOME/build-tools/37.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" \
            --report "$RUNNER_TEMP/published-apk-audit.md"
          rc23=apk-audit/rc23/MyFinHub-1.0.0-rc23-10022.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$rc23"
          {
            printf '\n## rc23 published receipt assets and provider\n\n'
            printf 'Actual receipt FileProvider is nonexported with explicit URI grants; rc22/rc23 permissions match. 16 KiB APK ZIP alignment passed.\n\n'
            printf '\x60\x60\x60text\n'
            python3 scripts/verify_receipt_apk.py "$rc23"
            printf '\x60\x60\x60\n'
          } | tee -a "$RUNNER_TEMP/published-apk-audit.md"
          rc24=apk-audit/rc24/MyFinHub-1.0.0-rc24-10023.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$rc24"
          {
            printf '\n## rc24 published receipt assets and provider\n\n'
            printf 'Actual receipt FileProvider is nonexported with explicit URI grants; rc23/rc24 permissions match and executable DEX delta verified. 16 KiB APK ZIP alignment passed.\n\n'
            printf '\x60\x60\x60text\n'
            python3 scripts/verify_receipt_apk.py "$rc24"
            printf '\x60\x60\x60\n'
          } | tee -a "$RUNNER_TEMP/published-apk-audit.md"
          rc25=apk-audit/rc25/MyFinHub-1.0.0-rc25-10024.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$rc25"
          {
            printf '\n## rc25 published receipt assets and provider\n\n'
            printf 'Actual receipt FileProvider is nonexported with explicit URI grants; rc24/rc25 permission delta is CAMERA only and executable DEX delta verified. 16 KiB APK ZIP alignment passed.\n\n'
            printf '\x60\x60\x60text\n'
            python3 scripts/verify_receipt_apk.py "$rc25"
            printf '\x60\x60\x60\n'
          } | tee -a "$RUNNER_TEMP/published-apk-audit.md"
          cat "$RUNNER_TEMP/published-apk-audit.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload text report only, never APKs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-apk-audit-report
          path: ${{ runner.temp }}/published-apk-audit.md
          retention-days: 14
