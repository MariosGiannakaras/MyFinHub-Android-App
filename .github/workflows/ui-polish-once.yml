name: Apply one-time UI copy polish

on:
  push:
    branches:
      - feature/full-app-2026-ui-redesign
    paths:
      - .github/workflows/ui-polish-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/full-app-2026-ui-redesign

      - name: Remove internal implementation copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/app/myfinhub/android/feature/money/Money2026Screens.kt')
          text = path.read_text()
          old = 'subtitle = "Το card stack παραμένει το native interaction contract",'
          new = 'subtitle = "Οι κάρτες σου, με ασφαλή πρόσβαση στα στοιχεία τους",'
          if old not in text:
              raise SystemExit('Expected Money card subtitle not found')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/ui-polish-once.yml

      - name: Commit polish and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/myfinhub/android/feature/money/Money2026Screens.kt
          git commit -m 'ui: polish card section copy'
          git push origin HEAD:feature/full-app-2026-ui-redesign
