name: Temporary Owner Feedback Patch

on:
  push:
    branches:
      - android/owner-rc6-feedback-corrections
    paths:
      - .github/workflows/temporary-owner-feedback-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/owner-rc6-feedback-corrections
          fetch-depth: 0
      - name: Apply deterministic product patch
        run: python3 scripts/temporary_owner_feedback_patch.py
      - name: Regenerate canonical tracking
        run: python3 scripts/render_project_tracking.py
      - name: Commit product changes and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/temporary_owner_feedback_patch.py .github/workflows/temporary-owner-feedback-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Correct rc6 owner feedback across accounts cards and insights"
          git push origin HEAD:android/owner-rc6-feedback-corrections
