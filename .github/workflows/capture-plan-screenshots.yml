name: Capture Plan Screenshots

on:
  push:
    branches:
      - feature/frontend-product-parity
    paths:
      - '.github/workflows/capture-plan-screenshots.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/frontend-product-parity

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Render current Plan references
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Promote validated Plan screenshots
        shell: bash
        run: |
          set -euo pipefail
          src='app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/PlanScreenshotTestKt'
          mkdir -p screenshots/plan
          cp "$src"/PlanOverviewCompactLightScreenshot_plan_overview_compact_light_fac64c24_0.png screenshots/plan/plan-overview.png
          cp "$src"/PlanOverviewCompactLargeFontScreenshot_plan_overview_compact_large_font_7b40152f_0.png screenshots/plan/plan-overview-large-font.png
          cp "$src"/PlanItemEditorCompactLightScreenshot_plan_item_editor_compact_light_88195e46_0.png screenshots/plan/plan-item-edit.png
          cp "$src"/PlanBudgetsCompactLightScreenshot_plan_budgets_compact_light_d3cd1ddd_0.png screenshots/plan/plan-budgets.png
          cp "$src"/PlanForecastCompactLightScreenshot_plan_forecast_compact_light_3a07043b_0.png screenshots/plan/plan-forecast.png
          rm -f screenshots/plan/.gitkeep

      - name: Commit rendered references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan screenshots/plan
          if git diff --cached --quiet; then
            echo 'No screenshot changes to commit.'
            exit 0
          fi
          git commit -m 'test(plan): store validated visual references'
          git push origin HEAD:feature/frontend-product-parity
