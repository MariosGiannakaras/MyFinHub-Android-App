name: S7 Coherent Candidate

on:
  push:
    branches:
      - automation/s7-plan-debts-20260914
    paths:
      - '.github/workflows/s7-coherent-candidate.yml'

permissions:
  contents: write

jobs:
  semantic-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact S7 product head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s7-plan-debts
          fetch-depth: 1

      - name: Assert visual-refinement head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "aa7a504789b8ad5c33e77c1064b1d621d9622b03"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Apply coherent semantic hardening
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/s7-plan-debts-20260914
          git show origin/automation/s7-plan-debts-20260914:scripts/apply_s7_semantic_hardening.py > /tmp/apply_s7_semantic_hardening.py
          git show origin/automation/s7-plan-debts-20260914:scripts/apply_s7_screenshot_signature_fix.py > /tmp/apply_s7_screenshot_signature_fix.py
          python3 /tmp/apply_s7_semantic_hardening.py
          python3 /tmp/apply_s7_screenshot_signature_fix.py
          python3 scripts/render_project_tracking.py --check
          git diff --check

      - name: Targeted S7 validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug compileDebugKotlin --stacktrace
          git diff --check

      - name: Render final S7 candidates
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish final candidate renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s7-final-candidates-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/S7PlanScreenshotTestKt/*.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/S7DebtScreenshotTestKt/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Commit semantic hardening source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/app/myfinhub/android/app/CanonicalPlanProjection.kt \
            app/src/main/java/app/myfinhub/android/app/FinanceProductViewModel.kt \
            app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt \
            app/src/main/java/app/myfinhub/android/app/MyFinHubRoot.kt \
            app/src/main/java/app/myfinhub/android/feature/plan/CanonicalPlanS7Screens.kt \
            app/src/androidTest/java/app/myfinhub/android/feature/plan/S7PlanSurfaceTest.kt \
            app/src/screenshotTest/kotlin/app/myfinhub/android/feature/plan/S7PlanScreenshotTest.kt \
            app/src/test/java/app/myfinhub/android/app/S7CanonicalPlanProjectionContractTest.kt \
            app/src/test/java/app/myfinhub/android/app/S7PlanQuickEntryPrefillTest.kt
          git diff --cached --check
          git commit -m 'fix(android): harden S7 recording and budget persistence'
          git push origin HEAD:android/redesign-s7-plan-debts
