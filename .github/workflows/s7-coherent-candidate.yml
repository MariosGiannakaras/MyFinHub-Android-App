name: S7 Coherent Candidate

on:
  push:
    branches:
      - automation/s7-plan-debts-20260914
    paths:
      - '.github/workflows/s7-coherent-candidate.yml'

permissions:
  contents: write

jobs:
  refine-validate-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout current S7 product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s7-plan-debts
          fetch-depth: 1

      - name: Assert reviewed candidate head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b8ae349c068db70445694f2a840a448c88687af6"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Apply bounded S7 large-font refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/myfinhub/android/feature/plan/CanonicalPlanS7Screens.kt')
          text = path.read_text()

          old = '''@Composable
          private fun ForecastS7LinkCard(state: PlanUiState, onClick: () -> Unit) {
              MyFinHubActionCard(
                  onClick = onClick,
                  modifier = Modifier.fillMaxWidth().testTag("s7_forecast_link"),
              ) {
                  MyFinHubSectionHeading(
                      title = "Πρόβλεψη 30 ημερών",
                      subtitle = planForecastScopeLabel(state),
                      icon = MyFinHubIcons.Plan,
                      tone = FinanceTone.Neutral,
                  )
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Text("Προβλεπόμενο διαθέσιμο", style = MaterialTheme.typography.bodyMedium)
                      MyFinHubAmountText(
                          formatPlanS7Euro(state.forecastEndBalance),
                          if (state.forecastEndBalance >= 0.0) FinanceTone.Income else FinanceTone.Expense,
                          style = MaterialTheme.typography.titleLarge,
                      )
                  }
                  Text(
                      "Άνοιγμα, έσοδα, υποχρεώσεις και επίδραση μεταφορών σε ξεχωριστή ανάλυση.",
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
              }
          }'''
          new = '''@Composable
          private fun ForecastS7LinkCard(state: PlanUiState, onClick: () -> Unit) {
              val largeFont = LocalDensity.current.fontScale >= 1.3f
              val tone = if (state.forecastEndBalance >= 0.0) FinanceTone.Income else FinanceTone.Expense
              MyFinHubActionCard(
                  onClick = onClick,
                  modifier = Modifier.fillMaxWidth().testTag("s7_forecast_link"),
              ) {
                  MyFinHubSectionHeading(
                      title = "Πρόβλεψη 30 ημερών",
                      subtitle = planForecastScopeLabel(state),
                      icon = MyFinHubIcons.Plan,
                      tone = FinanceTone.Neutral,
                  )
                  if (largeFont) {
                      Column(verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.xs)) {
                          Text("Προβλεπόμενο διαθέσιμο", style = MaterialTheme.typography.bodyMedium)
                          MyFinHubAmountText(
                              formatPlanS7Euro(state.forecastEndBalance),
                              tone,
                              modifier = Modifier.align(Alignment.End),
                              style = MaterialTheme.typography.titleLarge,
                          )
                      }
                  } else {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          Text("Προβλεπόμενο διαθέσιμο", style = MaterialTheme.typography.bodyMedium)
                          MyFinHubAmountText(
                              formatPlanS7Euro(state.forecastEndBalance),
                              tone,
                              style = MaterialTheme.typography.titleLarge,
                          )
                      }
                  }
                  Text(
                      "Άνοιγμα, έσοδα, υποχρεώσεις και επίδραση μεταφορών σε ξεχωριστή ανάλυση.",
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
              }
          }'''
          if text.count(old) != 1:
              raise SystemExit('ForecastS7LinkCard exact block mismatch')
          text = text.replace(old, new, 1)

          old = '''            Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Text("${progress.percent}% του ορίου", style = MaterialTheme.typography.bodyMedium)
                      MyFinHubAmountText(
                          formatPlanS7Euro(abs(progress.remaining)),
                          if (progress.remaining >= 0.0) FinanceTone.Savings else FinanceTone.Expense,
                      )
                  }'''
          new = '''            val largeFont = LocalDensity.current.fontScale >= 1.3f
                  val remainingTone = if (progress.remaining >= 0.0) FinanceTone.Savings else FinanceTone.Expense
                  if (largeFont) {
                      Column(verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.xs)) {
                          Text("${progress.percent}% του ορίου", style = MaterialTheme.typography.bodyMedium)
                          MyFinHubAmountText(
                              formatPlanS7Euro(abs(progress.remaining)),
                              remainingTone,
                              modifier = Modifier.align(Alignment.End),
                          )
                      }
                  } else {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          Text("${progress.percent}% του ορίου", style = MaterialTheme.typography.bodyMedium)
                          MyFinHubAmountText(
                              formatPlanS7Euro(abs(progress.remaining)),
                              remainingTone,
                          )
                      }
                  }'''
          if text.count(old) != 1:
              raise SystemExit('BudgetS7LinkCard amount row mismatch')
          text = text.replace(old, new, 1)

          old = '''@Composable
          private fun ForecastS7Metric(
              label: String,
              amount: Double,
              tone: FinanceTone,
              showPositive: Boolean = false,
          ) {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Text(label, style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  val text = when {
                      amount < -0.005 -> "−${formatPlanS7Euro(abs(amount))}"
                      amount > 0.005 && showPositive -> "+${formatPlanS7Euro(amount)}"
                      else -> formatPlanS7Euro(abs(amount))
                  }
                  MyFinHubAmountText(text, tone)
              }
          }'''
          new = '''@Composable
          private fun ForecastS7Metric(
              label: String,
              amount: Double,
              tone: FinanceTone,
              showPositive: Boolean = false,
          ) {
              val amountText = when {
                  amount < -0.005 -> "−${formatPlanS7Euro(abs(amount))}"
                  amount > 0.005 && showPositive -> "+${formatPlanS7Euro(amount)}"
                  else -> formatPlanS7Euro(abs(amount))
              }
              val largeFont = LocalDensity.current.fontScale >= 1.3f
              if (largeFont) {
                  Column(
                      modifier = Modifier.fillMaxWidth(),
                      verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.micro),
                  ) {
                      Text(label, style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                      MyFinHubAmountText(amountText, tone, modifier = Modifier.align(Alignment.End))
                  }
              } else {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Text(
                          label,
                          modifier = Modifier.weight(1f),
                          style = MaterialTheme.typography.bodyMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                      MyFinHubAmountText(amountText, tone)
                  }
              }
          }'''
          if text.count(old) != 1:
              raise SystemExit('ForecastS7Metric exact block mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Targeted S7 validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug compileDebugKotlin --stacktrace

      - name: Render refined S7 candidates
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish refined renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s7-refined-renders-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/S7PlanScreenshotTestKt/*.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/S7DebtScreenshotTestKt/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Commit reviewed refinement source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/myfinhub/android/feature/plan/CanonicalPlanS7Screens.kt
          git diff --cached --check
          git commit -m 'fix(android): make S7 financial rows large-font safe'
          git push origin HEAD:android/redesign-s7-plan-debts
