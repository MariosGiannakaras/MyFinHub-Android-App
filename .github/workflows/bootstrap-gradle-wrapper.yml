name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - feature/android-bootstrap

permissions:
  contents: write

jobs:
  bootstrap-wrapper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Install Android API 37
        shell: bash
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Generate wrapper when missing
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi

      - name: Validate bootstrap build
        shell: bash
        run: ./gradlew test lint assembleDebug --stacktrace

      - name: Commit generated wrapper
        shell: bash
        run: |
          if git status --porcelain -- gradlew gradlew.bat gradle/wrapper | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "build: add Gradle 9.7.0 wrapper"
            git push origin HEAD:feature/android-bootstrap
          else
            echo "Gradle wrapper already committed."
          fi
