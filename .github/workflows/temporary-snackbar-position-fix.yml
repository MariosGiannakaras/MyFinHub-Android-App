name: Temporary snackbar position fix

on:
  push:
    branches:
      - feature/full-app-2026-ui-redesign
    paths:
      - .github/workflows/temporary-snackbar-position-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/full-app-2026-ui-redesign
          fetch-depth: 0

      - name: Apply asserted snackbar positioning fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/app/myfinhub/android/app/MyFinHubRoot.kt')
          text = root.read_text()
          old = '''    val snackbarHostState = remember { SnackbarHostState() }\n    var detailNotice by remember { mutableStateOf<UserNotice?>(null) }\n'''
          new = '''    val snackbarHostState = remember { SnackbarHostState() }\n    var detailNotice by remember { mutableStateOf<UserNotice?>(null) }\n    val snackbarBottomPadding = if (\n        authState is AuthShellUiState.Ready && financeState is FinanceProductState.Ready\n    ) 88.dp else 12.dp\n'''
          assert text.count(old) == 1, 'Unexpected snackbar state anchor count in MyFinHubRoot.kt'
          text = text.replace(old, new, 1)

          old_padding = '''                    .align(Alignment.BottomCenter)\n                    .padding(horizontal = 16.dp, vertical = 12.dp),\n'''
          new_padding = '''                    .align(Alignment.BottomCenter)\n                    .padding(horizontal = 16.dp)\n                    .padding(bottom = snackbarBottomPadding),\n'''
          assert text.count(old_padding) == 1, 'Unexpected SnackbarHost padding anchor count'
          root.write_text(text.replace(old_padding, new_padding, 1))

          fixture = Path('app/src/screenshotTest/kotlin/app/myfinhub/android/app/UserNoticeScreenshotTest.kt')
          text = fixture.read_text()
          fixture_old = '''                        .align(Alignment.BottomCenter)\n                        .padding(horizontal = 16.dp, vertical = 12.dp),\n'''
          fixture_new = '''                        .align(Alignment.BottomCenter)\n                        .padding(horizontal = 16.dp)\n                        .padding(bottom = 88.dp),\n'''
          assert text.count(fixture_old) == 1, 'Unexpected snackbar fixture padding anchor count'
          fixture.write_text(text.replace(fixture_old, fixture_new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-snackbar-position-fix.yml
          git add app/src/main/java/app/myfinhub/android/app/MyFinHubRoot.kt \
                  app/src/screenshotTest/kotlin/app/myfinhub/android/app/UserNoticeScreenshotTest.kt
          git commit -m "fix: keep error snackbar above phone navigation"
          git push origin HEAD:feature/full-app-2026-ui-redesign
