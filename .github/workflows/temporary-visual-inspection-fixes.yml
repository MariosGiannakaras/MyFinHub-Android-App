name: Temporary Visual Inspection Fixes

on:
  push:
    branches:
      - android/full-product-reaudit-redesign
    paths:
      - scripts/temporary_visual_inspection_fixes.py
      - .github/workflows/temporary-visual-inspection-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/full-product-reaudit-redesign
          fetch-depth: 0
      - name: Apply inspected Home and Activity fixes
        run: python3 scripts/temporary_visual_inspection_fixes.py
      - name: Commit production changes and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/temporary_visual_inspection_fixes.py
          rm .github/workflows/temporary-visual-inspection-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix inspected Home and Activity large-font layout"
          git push origin HEAD:android/full-product-reaudit-redesign
