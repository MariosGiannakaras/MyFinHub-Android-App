          7408d6ec98bed7ec2f7bd22bb9b992438f53000c33346b851f93738acf3c7507  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/NoticeHistoryScreenshotTestKt/NoticeHistoryLargeFontScreenshot_notice_history_large_font_059c3c44_0.png
          23edeb02cd500d8350ddda5a865634bfc5b42cbf06976821101861662a8ffe5e  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/NoticeHistoryScreenshotTestKt/NoticeHistoryDarkScreenshot_notice_history_dark_f698f23a_0.png
          9742c8213468a88ab4f8ba936b832a45fe9b3953c73f3f686b6c92004ea2fdc1  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/NoticeHistoryScreenshotTestKt/NoticeHistoryLightScreenshot_notice_history_light_5302e63e_0.png
          3613fddaf02911467a2a958405b72666aa7dd84809c0ceada39aae9ef3bfae6a  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/ProductionSettingsScreenshotTestKt/ProductionSettingsCompactLargeFontScreenshot_production_settings_compact_large_font_aa5bc333_0.png
          efcdbf7aeef212ea600be9d7d0c82522d9f7e963314e6fec4083174262b84e48  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/ProductionSettingsScreenshotTestKt/ProductionSettingsCompactLightScreenshot_production_settings_compact_light_e836902a_0.png
          6871948c77ace8827ea8fd30c3a8bfc51d641d371963d9ad006ae3249ae1ee19  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/ProductionSettingsScreenshotTestKt/ProductionSettingsCompactDarkScreenshot_production_settings_compact_dark_0d316ba0_0.png
          EOF

          awk '{print $2}' /tmp/expected-sha256 | sort > /tmp/expected-paths
          git status --porcelain=v1 --untracked-files=all | cut -c4- | grep '^app/src/screenshotTestDebug/reference/' | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

          outside="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | grep -v '^app/src/screenshotTestDebug/reference/' || true)"
          if [[ -n "$outside" ]]; then
            echo "Unexpected renderer changes outside screenshot references:" >&2
            printf '%s\n' "$outside" >&2
            exit 1
          fi

          sha256sum -c /tmp/expected-sha256

      - name: Commit inspected references and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_uiux_baseline_acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app/src/screenshotTestDebug/reference .github/workflows/_uiux_baseline_acceptance.yml
          git diff --cached --quiet && { echo 'Nothing to commit.' >&2; exit 1; }
          git commit -m 'test: accept inspected canonical UI baselines'
          git push origin HEAD:android/ui-ux-canonical-correction-pass
