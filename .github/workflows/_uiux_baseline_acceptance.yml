name: UIUX Baseline Acceptance One Shot

on:
  push:
    branches:
      - android/ui-ux-canonical-correction-pass
    paths:
      - '.github/workflows/_uiux_baseline_acceptance.yml'

permissions:
  contents: write

jobs:
  accept-inspected-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/ui-ux-canonical-correction-pass
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Regenerate and verify inspected candidate pixels
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew updateDebugScreenshotTest --stacktrace

          cat > /tmp/expected-sha256 <<'EOF'
