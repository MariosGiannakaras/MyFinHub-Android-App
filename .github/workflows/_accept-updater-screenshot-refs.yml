name: Accept inspected updater screenshot refs

on:
  push:
    branches:
      - android/private-self-update
    paths:
      - '.github/workflows/_accept-updater-screenshot-refs.yml'

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/private-self-update
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Render exact candidate references
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Verify personally inspected updater screenshots
        shell: bash
        run: |
          set -euo pipefail
          ref_dir='app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/ProductionSettingsScreenshotTestKt'
          cd "$ref_dir"
          cat > /tmp/expected-updater-screenshots.sha256 <<'EOF'
          4c1d4a7e187c98d2b90d1428507e8d79c24a1e9f0897239b05b04f009623a6cf  ProductionSettingsCompactDarkScreenshot_production_settings_compact_dark_0d316ba0_0.png
          6de7e4657d9d69878b70991da58179e7aaa1edb7ba65d715212d9949a7e63485  ProductionSettingsCompactLargeFontScreenshot_production_settings_compact_large_font_aa5bc333_0.png
          db2f516ed4cc2625dfed26e791f11fea1aa602b9ec9d6696400223a02e5c477e  ProductionSettingsCompactLightScreenshot_production_settings_compact_light_e836902a_0.png
          445c3a99c450c41b8c29e50459f864241b18d4a537fda9c3a80ba54cdc96c83f  ProductionSettingsUpdateAvailableLargeFontScreenshot_production_settings_update_available_large_font_b6e08a43_0.png
          EOF
          sha256sum -c /tmp/expected-updater-screenshots.sha256

      - name: Commit only accepted updater references and remove helper
        shell: bash
        run: |
          set -euo pipefail
          ref_dir='app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/ProductionSettingsScreenshotTestKt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$ref_dir/ProductionSettingsCompactDarkScreenshot_production_settings_compact_dark_0d316ba0_0.png" \
            "$ref_dir/ProductionSettingsCompactLargeFontScreenshot_production_settings_compact_large_font_aa5bc333_0.png" \
            "$ref_dir/ProductionSettingsCompactLightScreenshot_production_settings_compact_light_e836902a_0.png" \
            "$ref_dir/ProductionSettingsUpdateAvailableLargeFontScreenshot_production_settings_update_available_large_font_b6e08a43_0.png"
          git rm .github/workflows/_accept-updater-screenshot-refs.yml
          git commit -m 'test: accept inspected updater screenshot references'
          git push origin HEAD:android/private-self-update
