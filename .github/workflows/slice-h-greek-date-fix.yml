name: Slice H Greek date fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: slice-h-greek-date-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.head_ref == 'android/rc7-owner-full-validation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Apply locale-aware DatePickerState patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF" develop
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"

          python3 - <<'PY'
          from pathlib import Path

          prod = Path('app/src/main/java/app/myfinhub/android/feature/quickentry/ProductionQuickEntryScreen.kt')
          full = Path('app/src/main/java/app/myfinhub/android/feature/quickentry/QuickEntryScreen.kt')

          prod_text = prod.read_text()
          full_text = full.read_text()

          prod_old = '''        val pickerState = rememberDatePickerState(\n            initialSelectedDateMillis = value.toDatePickerMillis(),\n        )'''
          prod_new = '''        val pickerState = remember(value) {\n            DatePickerState(\n                locale = Locale.forLanguageTag("el-GR"),\n                initialSelectedDateMillis = value.toDatePickerMillis(),\n            )\n        }'''
          if prod_text.count(prod_old) != 1:
              raise SystemExit(f'Production date-state guard expected 1 match, found {prod_text.count(prod_old)}')
          prod_text = prod_text.replace(prod_old, prod_new, 1)
          if 'import androidx.compose.material3.DatePickerState\n' not in prod_text:
              prod_text = prod_text.replace(
                  'import androidx.compose.material3.DatePickerDialog\n',
                  'import androidx.compose.material3.DatePickerDialog\nimport androidx.compose.material3.DatePickerState\n',
                  1,
              )
          prod_text = prod_text.replace('import androidx.compose.material3.rememberDatePickerState\n', '', 1)

          full_old = '''        val pickerState = rememberDatePickerState(\n            initialSelectedDateMillis = value.toDatePickerMillis(),\n        )'''
          full_new = '''        val pickerState = remember(value) {\n            DatePickerState(\n                locale = Locale.forLanguageTag("el-GR"),\n                initialSelectedDateMillis = value.toDatePickerMillis(),\n            )\n        }'''
          if full_text.count(full_old) != 1:
              raise SystemExit(f'Full-editor date-state guard expected 1 match, found {full_text.count(full_old)}')
          full_text = full_text.replace(full_old, full_new, 1)
          if 'import androidx.compose.material3.DatePickerState\n' not in full_text:
              full_text = full_text.replace(
                  'import androidx.compose.material3.DatePickerDialog\n',
                  'import androidx.compose.material3.DatePickerDialog\nimport androidx.compose.material3.DatePickerState\n',
                  1,
              )
          full_text = full_text.replace('import androidx.compose.material3.rememberDatePickerState\n', '', 1)
          if 'import java.util.Locale\n' not in full_text:
              marker = 'import java.time.ZoneOffset\n'
              if marker not in full_text:
                  raise SystemExit('Locale import insertion guard missing')
              full_text = full_text.replace(marker, marker + 'import java.util.Locale\n', 1)

          prod.write_text(prod_text)
          full.write_text(full_text)
          PY

          git rm .github/workflows/slice-h-greek-date-fix.yml
          git add app/src/main/java/app/myfinhub/android/feature/quickentry/ProductionQuickEntryScreen.kt \
                  app/src/main/java/app/myfinhub/android/feature/quickentry/QuickEntryScreen.kt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Android: localize Quick Entry date picker semantics'
          git push origin HEAD:"$GITHUB_HEAD_REF"
