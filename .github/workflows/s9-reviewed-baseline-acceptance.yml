          sha256sum -c /tmp/s9-reviewed.sha256

          awk '{print $2}' /tmp/s9-reviewed.sha256 | sort > /tmp/expected-screens.txt
          {
            git diff --name-only -- app/src/screenshotTestDebug/reference
            git ls-files --others --exclude-standard app/src/screenshotTestDebug/reference
          } | sort -u > /tmp/actual-screens.txt
          diff -u /tmp/expected-screens.txt /tmp/actual-screens.txt

          ./gradlew validateDebugScreenshotTest --stacktrace
          python3 scripts/render_project_tracking.py --check
          git diff --check

      - name: Remove one-shot workflow and commit accepted evidence
        shell: bash
        run: |
          rm .github/workflows/s9-reviewed-baseline-acceptance.yml

          git add STATUS.md TODO.md docs/CURRENT_HANDOFF.md
          git add app/src/screenshotTestDebug/reference
          git add .github/workflows/s9-reviewed-baseline-acceptance.yml

          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -lt 50 ]; then
            echo "Expected 46 reviewed screenshots + 3 generated tracking files + helper removal."
            printf '%s\n' "${staged[@]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(android): accept reviewed S9 renders and sync tracking"
          git push origin HEAD:android/redesign-s9-settings-auth
