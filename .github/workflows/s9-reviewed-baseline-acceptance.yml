name: One-shot S9 reviewed render acceptance

on:
  push:
    branches:
      - android/redesign-s9-settings-auth

permissions:
  contents: write

jobs:
  accept-reviewed-renders:
    if: contains(github.event.head_commit.message, '[s9-reviewed-acceptance]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s9-settings-auth
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Regenerate canonical tracking
        shell: bash
        run: |
          python3 scripts/render_project_tracking.py
          python3 scripts/render_project_tracking.py --check

      - name: Render reviewed references
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Require exact reviewed render bytes and scope
        shell: bash
        run: |
          cat > /tmp/s9-reviewed.sha256 <<'EOF'
