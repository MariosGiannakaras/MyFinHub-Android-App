name: Refresh Home Slice B references

on:
  push:
    branches:
      - android/rc7-owner-home-ui-correction
    paths:
      - '.github/workflows/refresh-home-slice-b.yml'

permissions:
  contents: write

jobs:
  refresh-home-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Home branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/rc7-owner-home-ui-correction
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Render current Home references
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Commit only inspected Home references and retire helper
        shell: bash
        run: |
          rm .github/workflows/refresh-home-slice-b.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/home/ProductionHomeScreenshotTestKt/*.png
          git add -u .github/workflows/refresh-home-slice-b.yml
          if git diff --cached --quiet; then
            echo 'Expected Home reference changes were not produced.' >&2
            exit 1
          fi
          git commit -m 'test: accept inspected Home Slice B references'
          git push origin HEAD:android/rc7-owner-home-ui-correction
