name: One-shot S10 card reviewed render acceptance

on:
  push:
    branches:
      - android/redesign-s10-integration-acceptance

permissions:
  contents: write

jobs:
  accept-reviewed-renders:
    if: contains(github.event.head_commit.message, '[s10-card-reviewed-acceptance]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s10-integration-acceptance
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Render reviewed references
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Require exact reviewed render bytes and scope
        shell: bash
        run: |
          cat > /tmp/s10-card-reviewed.sha256 <<'EOF'
          d251489ae6117d6998584b8752e39392651f568ab8cad28c617f6b15748a8f11  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCardDetailScreenshotTestKt/CanonicalCardDetailLargeFontScreenshot_canonical_card_detail_large_font_665deb00_0.png
          b3c0568db1469b369244d84427cca6f6438236e44c81a764790a65b77bbdc66f  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCardDetailScreenshotTestKt/CanonicalCardDetailLightScreenshot_canonical_card_detail_light_315a739a_0.png
          bb3556938629c162ad8ed654d2ce277074f208b482f94d329909a3955a932629  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCardDetailScreenshotTestKt/CanonicalCardSecureHiddenLightScreenshot_canonical_card_secure_hidden_light_17b7e242_0.png
          2f4a474e387dc9de5220b8b9f863e63cf4c0861bb9b6a547a83f333235f222cc  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCardDetailScreenshotTestKt/CanonicalCardSecureHiddenDarkScreenshot_canonical_card_secure_hidden_dark_623b5899_0.png
          56cad858550cac6bc2f452bc82c688a85460d1cae1ba4e0359904ec488bd17af  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCardDetailScreenshotTestKt/CanonicalCardDetailDarkScreenshot_canonical_card_detail_dark_7c0c9ebf_0.png
          bf7c50f42178f74074e5360cd326f17272752d7a1239e0b42572f1a6410c827f  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCardDetailScreenshotTestKt/CanonicalCardSecureHiddenLargeFontScreenshot_canonical_card_secure_hidden_large_font_c9a993ca_0.png
          01a67ccda273b9ee0fed6e53e93b2775a0cc010b1ed8044ab355dc70244bef8e  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCorrectionScreensScreenshotTestKt/CanonicalCardCreateLightScreenshot_canonical_card_create_light_44a64eba_0.png
          755138d8cce0e8fec192b022e6eb477ed39598d698575ca3ca76324d253bf986  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCorrectionScreensScreenshotTestKt/CanonicalCardCreateLargeFontScreenshot_canonical_card_create_large_font_40b70f4e_0.png
          fa8d3c1dc88e5042c3bf1231c44d10d2eed603e5ab72318e6384ddeeec8cfe73  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCorrectionScreensScreenshotTestKt/CanonicalCardCreateDarkScreenshot_canonical_card_create_dark_c24b0f7f_0.png
          88904a8c20ec3dd0263193c5343f6e4e2a3f38f165dbf1bd0a69f1009e8b9bb4  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CreditCardStackScreenshotTestKt/CreditCardStackCompactLargeFontScreenshot_card_stack_compact_150_percent_font_c9b36481_0.png
          83cb7c82e31e18e84f9edc1d7a578b657c781c56112ca7c1afdffdaeeaf5831d  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CreditCardStackScreenshotTestKt/CreditCardStackCompactLightScreenshot_card_stack_compact_light_04e49ab8_0.png
          fe914dbc3a8b0cc7a5709c0fed0159b90fbe17523dad579409f075051a6fb962  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/WalletAccountsScreenshotTestKt/WalletCardsLargeFontScreenshot_wallet_cards_large_font_78193a3b_0.png
          509a32422e1e5955c438d791de6ab78ccdaeddc118be0e4d0d32dbe9c5a14a5f  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/WalletAccountsScreenshotTestKt/WalletCardsLightScreenshot_wallet_cards_light_7ba61c12_0.png
          a5a549356899ce02764d429f19a9431cba3dbc5b5fa160de77afa26f1c2ca483  app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/WalletAccountsScreenshotTestKt/WalletCardsDarkScreenshot_wallet_cards_dark_73ffd8d2_0.png
          EOF
          sha256sum -c /tmp/s10-card-reviewed.sha256

          awk '{print $2}' /tmp/s10-card-reviewed.sha256 | sort > /tmp/expected-screens.txt
          {
            git diff --name-only -- app/src/screenshotTestDebug/reference
            git ls-files --others --exclude-standard app/src/screenshotTestDebug/reference
          } | sort -u > /tmp/actual-screens.txt
          diff -u /tmp/expected-screens.txt /tmp/actual-screens.txt

          ./gradlew validateDebugScreenshotTest --stacktrace
          python3 scripts/render_project_tracking.py --check
          git diff --check

      - name: Remove one-shot workflow and commit accepted evidence
        shell: bash
        run: |
          rm .github/workflows/s10-card-reviewed-baseline-acceptance.yml

          git add app/src/screenshotTestDebug/reference
          git add .github/workflows/s10-card-reviewed-baseline-acceptance.yml

          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -ne 15 ]; then
            echo "Expected exactly 14 reviewed screenshots + helper removal."
            printf '%s\n' "${staged[@]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(android): accept reviewed S10 card renders"
          git push origin HEAD:android/redesign-s10-integration-acceptance
