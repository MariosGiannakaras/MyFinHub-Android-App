name: S4 completion tracking sync

on:
  push:
    branches:
      - automation/s4-tracking-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout S4 target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s4-quick-entry
          fetch-depth: 1

      - name: Complete canonical S4 tracking
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('tracking/android-project-state.json')
          state = json.loads(path.read_text(encoding='utf-8'))

          state['updated_at'] = '2026-09-13'
          work = state['active_workstream']
          work['status'] = 'android_redesign_s4_ready_to_merge'
          work['summary'] = (
              'S1–S3 are complete and merged. PR #116 now has an evidence-backed S4 Quick Entry implementation: '
              'one production editor for all twelve canonical kinds, searchable identity-safe pickers, compatible draft '
              'transitions, sticky duplicate-safe Save, unified dirty Back, exact-cent split allocation and natural '
              'operation-specific amount headings. Final implementation head 3217a48022132ec9aac82cfd039c6c09b78c031f '
              'passed Android CI run 34751696379, Project Tracking run 34751696393 and Android UI Quality run '
              '34751696408; screenshot regression and all 53 S24-target tests passed. No backend or web/desktop changes.'
          )
          work['next'] = [
              'Merge validated PR #116 into develop with its exact completion-tracking head.',
              'Create the S5 Home and accounts branch from the resulting develop head and begin S5.1 without reopening completed S4 work.'
          ]

          current = state['current_redesign_pass']
          current['checkpoint'] = 's4_complete_pending_merge'
          current['next_action'] = (
              'Merge PR #116 after the completion-tracking check passes, then create the S5 Home/accounts branch from '
              'the new develop head and start S5.1.'
          )

          s4 = next(task for task in state['redesign_tasks'] if task['id'] == 'S4')
          evidence = {
              'S4.1': [
                  'PR #116 replaces the runtime fast/complete fork with one production Quick Entry editor for all canonical transaction kinds and shared searchable account, category, subcategory and credit-card picker sheets with stable identity context.',
                  'Final implementation head 3217a48022132ec9aac82cfd039c6c09b78c031f passed Android CI run 34751696379, including unit tests, instrumentation compilation, lint/debug assembly, optimized release/AAB assembly and distribution policy checks.'
              ],
              'S4.2': [
                  'The unified editor renders operation-specific fields for all twelve canonical kinds, including transfer routes, card purchase/payment identity, lending/repayment person fields, reconciliation actual balance and split accounting parts.',
                  'Split entry requires a declared total and categorized positive parts whose currency-cent allocation matches exactly; final instrumentation coverage also verifies natural semantic amount headings for every canonical kind.'
              ],
              'S4.3': [
                  'Kind changes preserve only compatible draft fields and reset incompatible account/card/person/reconciliation/split state; toolbar/system Back share the same explicit dirty-draft discard contract.',
                  'Save is disabled while a mutation is in flight, online completion waits for persisted acknowledgement, and durable offline enqueue owns pending-sync completion. Android UI Quality run 34751696408 passed all 53 S24-target tests on final implementation head 3217a48022132ec9aac82cfd039c6c09b78c031f.'
              ],
              'S4.4': [
                  'The affected Quick Entry light/dark/large-font candidates from Android UI Quality artifact 10315399104 (sha256 d821a705e5c8e8553514f0d275ad6ea38ea934149f29567ca65dc9c3b3d37fbe) were personally inspected before baseline acceptance; no clipping or hierarchy blocker was found.',
                  'After the natural amount-heading correction, exactly seven ProductionQuickEntry references were refreshed by the bounded recovery step. The temporary recovery was then removed.',
                  'Final Android UI Quality run 34751696408 passed screenshot regression without regeneration and S24-target instrumentation 53/53 on head 3217a48022132ec9aac82cfd039c6c09b78c031f. Final artifact 10316605934 has sha256 3c8cad1a576930d9dbe4a003ca3ec42a111a0afaaa9dc7f29d3e8af0a81b45c1.'
              ]
          }
          for sub in s4['subtasks']:
              sub['status'] = 'completed'
              sub['evidence'] = evidence[sub['id']]

          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/render_project_tracking.py
          python3 scripts/render_project_tracking.py --check
          git diff --check -- tracking/android-project-state.json STATUS.md TODO.md docs/CURRENT_HANDOFF.md

      - name: Commit target tracking update
        shell: bash
        run: |
          git add tracking/android-project-state.json STATUS.md TODO.md docs/CURRENT_HANDOFF.md
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: complete S4 tracking after final validation"
          git push origin HEAD:android/redesign-s4-quick-entry
