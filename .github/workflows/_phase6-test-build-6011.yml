name: Phase 6 stable test build 6011

on:
  push:
    branches:
      - android/uiux-phase6-test-6011
    paths:
      - .github/workflows/_phase6-test-build-6011.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VALIDATED_SOURCE_SHA: '3186aa1fe2ba0d9a036a7b094f5b15a45467a88a'
      PHASE6_VERSION_CODE: '6011'
      PHASE6_VERSION_NAME: '0.1.0-phase6.11'
      PHASE6_UPDATE_CHANNEL: 'phase6-test'
      PHASE6_STORAGE_PATH: 'phase6-test/6011/MyFinHub-Phase6-6011.apk'
      EXPECTED_SIGNER_SHA256: 'a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc'
      HELPER_PATH: '.github/workflows/_phase6-test-build-6011.yml'
    steps:
      - name: Checkout exact build branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2

      - name: Prove product source equals validated PR head
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$VALIDATED_SOURCE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$VALIDATED_SOURCE_SHA" HEAD)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$HELPER_PATH" ]]; then
            printf 'Unexpected difference from validated source:\n' >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Prepare pinned stable non-production signer
        shell: bash
        env:
          AOSP_BUILD_COMMIT: 045a3d6a3e359633a14853a5a5e1e4f2a11cbdae
          AOSP_TESTKEY_PK8_BLOB: 586c1bd5cf96f9358f36b37ea98fef93f4d0a8e3
          AOSP_TESTKEY_CERT_BLOB: e242d83e2bf72169ab0abd5280d4d455caef71eb
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/aosp-testkey.pk8"
          cert="$RUNNER_TEMP/aosp-testkey.x509.pem"
          base="https://raw.githubusercontent.com/aosp-mirror/platform_build/${AOSP_BUILD_COMMIT}/target/product/security"
          curl --fail --silent --show-error --location "$base/testkey.pk8" --output "$key"
          curl --fail --silent --show-error --location "$base/testkey.x509.pem" --output "$cert"
          python3 - "$key" "$AOSP_TESTKEY_PK8_BLOB" "$cert" "$AOSP_TESTKEY_CERT_BLOB" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          def git_blob_sha(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()

          for path_raw, expected in ((sys.argv[1], sys.argv[2]), (sys.argv[3], sys.argv[4])):
              actual = git_blob_sha(Path(path_raw))
              if actual != expected:
                  raise SystemExit(f"Pinned AOSP test-key blob mismatch: {actual}")
          PY
          cert_sha256="$(openssl x509 -in "$cert" -outform DER | sha256sum | awk '{print $1}')"
          test "$cert_sha256" = "$EXPECTED_SIGNER_SHA256"

      - name: Verify tests with Phase 6 update channel
        shell: bash
        run: ./gradlew test -PANDROID_UPDATE_CHANNEL="$PHASE6_UPDATE_CHANNEL" --stacktrace

      - name: Apply test-only strictly higher version
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PHASE6_VERSION_CODE" "$PHASE6_VERSION_NAME" <<'PY'
          import sys
          from pathlib import Path

          path = Path('app/build.gradle.kts')
          text = path.read_text()
          old_code = '        versionCode = 1'
          old_name = '        versionName = "0.1.0"'
          if text.count(old_code) != 1 or text.count(old_name) != 1:
              raise SystemExit('Unexpected Android version declaration; refusing test-only patch')
          text = text.replace(old_code, f'        versionCode = {sys.argv[1]}', 1)
          text = text.replace(old_name, f'        versionName = "{sys.argv[2]}"', 1)
          path.write_text(text)
          PY

      - name: Build channel-aware debug APK
        shell: bash
        run: ./gradlew assembleDebug -PANDROID_UPDATE_CHANNEL="$PHASE6_UPDATE_CHANNEL" --stacktrace

      - name: Re-sign and verify candidate
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          aapt="$build_tools/aapt"
          test -x "$apksigner" && test -x "$zipalign" && test -x "$aapt"

          input='app/build/outputs/apk/debug/app-debug.apk'
          aligned="$RUNNER_TEMP/MyFinHub-Phase6-6011-aligned.apk"
          output='MyFinHub-Phase6-6011.apk'
          key="$RUNNER_TEMP/aosp-testkey.pk8"
          cert="$RUNNER_TEMP/aosp-testkey.x509.pem"

          "$zipalign" -f -p 4 "$input" "$aligned"
          "$apksigner" sign --key "$key" --cert "$cert" --out "$output" "$aligned"
          "$apksigner" verify --verbose --print-certs "$output" | tee "$RUNNER_TEMP/apksigner.txt"

          cert_sha256="$(openssl x509 -in "$cert" -outform DER | sha256sum | awk '{print $1}')"
          test "$cert_sha256" = "$EXPECTED_SIGNER_SHA256"
          grep -F "certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" "$RUNNER_TEMP/apksigner.txt"

          badging="$($aapt dump badging "$output" | head -n 1)"
          printf '%s\n' "$badging"
          grep -F "package: name='app.myfinhub.android'" <<<"$badging"
          grep -F "versionCode='$PHASE6_VERSION_CODE'" <<<"$badging"
          grep -F "versionName='$PHASE6_VERSION_NAME'" <<<"$badging"

          apk_sha256="$(sha256sum "$output" | awk '{print $1}')"
          size_bytes="$(stat -c '%s' "$output")"
          cat > MyFinHub-Phase6-6011.txt <<EOF
          package=app.myfinhub.android
          versionCode=$PHASE6_VERSION_CODE
          versionName=$PHASE6_VERSION_NAME
          updateChannel=$PHASE6_UPDATE_CHANNEL
          storagePath=$PHASE6_STORAGE_PATH
          validatedSourceSha=$VALIDATED_SOURCE_SHA
          signerCertificateSha256=$cert_sha256
          apkSha256=$apk_sha256
          sizeBytes=$size_bytes
          signingIdentity=AOSP public development testkey; NON-PRODUCTION ONLY
          EOF
          cat MyFinHub-Phase6-6011.txt

      - name: Publish verified private-publish input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MyFinHub-Phase6-6011-private-publish-input
          path: |
            MyFinHub-Phase6-6011.apk
            MyFinHub-Phase6-6011.txt
          if-no-files-found: error
          retention-days: 7

      - name: Self-remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin android/uiux-phase6-test-6011
          remote_sha="$(git rev-parse origin/android/uiux-phase6-test-6011)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm "$HELPER_PATH"
          git commit -m 'ci: remove completed 6011 one-shot builder'
          git push origin HEAD:android/uiux-phase6-test-6011
