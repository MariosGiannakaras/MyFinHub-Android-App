name: Android Shared PIN Real Stack

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/android-shared-pin-real-stack.yml'
      - 'scripts/run_shared_pin_real_stack.py'
      - 'scripts/test_shared_pin_real_stack_runner.py'
      - 'app/src/test/java/app/myfinhub/android/core/network/SharedAppLockRealStackTest.kt'
      - 'app/src/main/java/app/myfinhub/android/core/network/SharedAppLock*.kt'
      - 'app/src/main/java/app/myfinhub/android/core/network/OkHttpMyFinHubApi.kt'
      - 'app/src/main/java/app/myfinhub/android/core/auth/SupabaseAuthGateway.kt'
      - 'app/src/main/java/app/myfinhub/android/core/auth/JwtClaimsParser.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-shared-pin-real-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-shared-pin:
    name: isolated-shared-pin
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Android
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check runner safety contract
        run: python3 -m unittest discover -s scripts -p test_shared_pin_real_stack_runner.py
      - name: Checkout immutable Web fixture (read only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: MariosGiannakaras/MyFinHub
          ref: e05fb3fe58f8a89566b616db056578fbd451f39e
          path: isolated-web
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: isolated-web/.nvmrc
          cache: npm
          cache-dependency-path: isolated-web/package-lock.json
      - name: Install Web dependencies
        working-directory: isolated-web
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Start disposable local Supabase
        id: local-stack
        working-directory: isolated-web
        run: npx --yes supabase@2.119.0 start >/dev/null 2>&1
      - name: Build pinned Web application
        working-directory: isolated-web
        run: npm run build
      - name: Execute actual Kotlin bearer integration
        run: python3 scripts/run_shared_pin_real_stack.py isolated-web
      - name: Discard isolated Supabase data
        if: always() && steps.local-stack.outcome != 'skipped'
        working-directory: isolated-web
        run: npx --yes supabase@2.119.0 stop --no-backup >/dev/null 2>&1
