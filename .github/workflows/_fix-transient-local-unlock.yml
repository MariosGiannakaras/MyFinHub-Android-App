name: Apply transient local unlock correction

on:
  push:
    branches:
      - android/offline-first-finance
    paths:
      - '.github/workflows/_fix-transient-local-unlock.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/offline-first-finance

      - name: Apply focused auth correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/myfinhub/android/feature/auth/AuthShellViewModel.kt')
          text = path.read_text()

          replacements = [
              (
                  '     * [offline] means the owner passed local PIN/biometric unlock but the stored server session has\n     * not yet been revalidated because there is no network. Product reads may use encrypted cached\n',
                  '     * [offline] means the owner passed local PIN/biometric unlock but the stored server session has\n     * not yet been revalidated because network/server validation is unavailable. Product reads may use encrypted cached\n',
              ),
              ('validateUnlockedSession(current.session, fallbackToPin = false)', 'validateUnlockedSession(current.session)'),
              ('validateUnlockedSession(current.session, fallbackToPin = true)', 'validateUnlockedSession(current.session)'),
              ('private fun validateUnlockedSession(session: AuthSession, fallbackToPin: Boolean)', 'private fun validateUnlockedSession(session: AuthSession)'),
              (
                  '''                    is AuthAppState.Failure -> {\n                        reportAuthFailure(result.failure, "Έλεγχος συνεδρίας μετά το ξεκλείδωμα")\n                        mutableState.value = lockedState(\n                            session = result.recoverableSession ?: session,\n                            showPin = fallbackToPin,\n                            message = authFailureMessage(result.failure.kind),\n                        )\n                    }''',
                  '''                    is AuthAppState.Failure -> {\n                        reportAuthFailure(result.failure, "Έλεγχος συνεδρίας μετά το ξεκλείδωμα")\n                        // Local authentication already succeeded. A transient server/network failure\n                        // must not re-lock the owner or force a full login; product access stays\n                        // cache-only until the stored server session can be revalidated.\n                        mutableState.value = AuthShellUiState.Ready(\n                            session = result.recoverableSession ?: session,\n                            offline = true,\n                        )\n                    }''',
              ),
              (
                  '''            } catch (error: Exception) {\n                mutableState.value = lockedState(\n                    session = session,\n                    showPin = fallbackToPin,\n                    message = "Το ασφαλές ξεκλείδωμα δεν ολοκληρώθηκε. Μπορείς να δοκιμάσεις ξανά.",\n                )\n                mutableNotices.emit(\n                    unexpectedUserNotice(\n                        operation = "Έλεγχος συνεδρίας μετά το ξεκλείδωμα",\n                        throwable = error,\n                        message = "Το ασφαλές ξεκλείδωμα δεν ολοκληρώθηκε.",\n                    ),\n                )\n            }''',
                  '''            } catch (error: Exception) {\n                mutableState.value = AuthShellUiState.Ready(session = session, offline = true)\n                mutableNotices.emit(\n                    unexpectedUserNotice(\n                        operation = "Έλεγχος συνεδρίας μετά το ξεκλείδωμα",\n                        throwable = error,\n                        message = "Η επαλήθευση της συνεδρίας δεν ολοκληρώθηκε. Τα τοπικά δεδομένα παραμένουν διαθέσιμα.",\n                    ),\n                )\n            }''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Run auth/unit verification
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Verify unit tests
        shell: bash
        run: ./gradlew test --stacktrace

      - name: Commit correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_fix-transient-local-unlock.yml
          git add app/src/main/java/app/myfinhub/android/feature/auth/AuthShellViewModel.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(auth): keep transient local unlock offline-capable'
          git push origin HEAD:android/offline-first-finance
