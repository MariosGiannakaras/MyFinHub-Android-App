name: One-time PR453 visual baseline approval

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]
    paths:
      - '.github/workflows/pr453-screen-reference-approval.yml'

permissions:
  contents: write
  actions: read

jobs:
  promote-reviewed-screenshots:
    if: github.event.pull_request.number == 453 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'android/d7-uiux-semantics-batch-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout the exact authorized PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/d7-uiux-semantics-batch-20261112
          persist-credentials: true

      - name: Promote only the 21 inspected failed baseline images from official renderer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3d97b30b1b5af89da18898c6f68e3cfb52c58ea4 HEAD
          mkdir -p "$RUNNER_TEMP/myfinhub-approved-render"
          gh run download 43117895641 \
            --repo "$GITHUB_REPOSITORY" \
            --name android-ui-screenshots-43117895641 \
            --dir "$RUNNER_TEMP/myfinhub-approved-render"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["RUNNER_TEMP"]) / "myfinhub-approved-render"
          source = root / "src/screenshotTestDebug/reference"
          destination = Path("app/src/screenshotTestDebug/reference")
          expected = [
              "UserNoticeSnackbarScreenshot",
              "ProductionActivityPendingDarkScreenshot",
              "ProductionActivityPendingLightScreenshot",
              "ProductionHomeAllAccountsDarkScreenshot",
              "ProductionHomeCompactLightScreenshot",
              "ProductionHomeCompactDarkScreenshot",
              "ProductionHomeAllAccountsLightScreenshot",
              "ProductionHomeCompactLargeFontScreenshot",
              "CreditCardStackCompactLargeFontScreenshot",
              "CreditCardStackCompactLightScreenshot",
              "WalletCardsLargeFontScreenshot",
              "WalletCardsLightScreenshot",
              "WalletCardsDarkScreenshot",
              "ProductionQuickEntrySplitLightScreenshot",
              "ProductionQuickEntryCardPaymentScreenshot",
              "ProductionQuickEntrySplitDarkScreenshot",
              "ProductionQuickEntryCompactDarkScreenshot",
              "ProductionQuickEntryReconciliationLargeFontScreenshot",
              "ProductionQuickEntryCompactLargeFontScreenshot",
              "ProductionQuickEntryCompactLightScreenshot",
              "ProductionQuickEntrySplitLargeFontScreenshot",
          ]
          candidates = list(source.rglob("*.png"))
          updated = []
          for name in expected:
              matches = [p for p in candidates if name in p.name]
              if len(matches) != 1:
                  raise SystemExit(f"Invalid expected snapshot {name}: {len(matches)} matches")
              file = matches[0]
              relative = file.relative_to(source)
              target = destination / relative
              if not target.is_file():
                  raise SystemExit(f"Refusing unexpected baseline path {target}")
              if target.read_bytes() == file.read_bytes():
                  raise SystemExit(f"Expected regression candidate is unchanged: {name}")
              target.write_bytes(file.read_bytes())
              updated.append(str(target))
          if len(updated) != 21:
              raise SystemExit("Expected exactly 21 reviewed snapshots")
          print("Reviewed UI baselines updated:", len(updated))
          for path in updated:
              print("  ", path)
          PY

      - name: Commit exactly the 21 reviewed references
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/screenshotTestDebug/reference
          changed="$(git diff --cached --name-only)"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          test "$count" -eq 21
          if printf '%s\n' "$changed" | grep -Ev '^app/src/screenshotTestDebug/reference/.+\.png$'; then
            echo 'Unexpected file staged, refusing to commit' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(screenshots): approve 21 owner-reviewed Android UI render baselines"
          git push origin HEAD:refs/heads/android/d7-uiux-semantics-batch-20261112
