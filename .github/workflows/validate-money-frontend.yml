name: Validate Money Frontend

on:
  push:
    branches:
      - feature/money-product-parity
    paths:
      - '.github/workflows/validate-money-frontend.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/money-product-parity
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Unit, lint and assemble
        run: ./gradlew test lint assembleDebug --stacktrace

  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/money-product-parity
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Render and validate screenshots
        run: |
          ./gradlew updateDebugScreenshotTest --stacktrace
          ./gradlew validateDebugScreenshotTest --stacktrace
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: money-ui-candidates-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/**/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: error
          retention-days: 14

  navigation:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/money-product-parity
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Money navigation flow
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: >-
            ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=app.myfinhub.android.MoneyParityTest
            --stacktrace
