name: One-shot reviewed reversible-card archive screenshots
on:
  push:
    branches: [android/web-parity-archive-ux-20261015]
    paths:
      - '.github/workflows/android-archive-ux-baselines.yml'
permissions:
  contents: write
concurrency:
  group: archive-ux-approved-baselines-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reviewed-card-detail-only:
    if: github.repository == 'MariosGiannakaras/MyFinHub-Android-App'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Install Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Generate screenshot references
        run: ./gradlew updateDebugScreenshotTest --stacktrace
      - name: Commit only two reviewed archive wording images
        shell: bash
        run: |
          set -euo pipefail
          base=app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCardDetailScreenshotTestKt
          files=(
            "$base/CanonicalCardDetailLightScreenshot_canonical_card_detail_light_315a739a_0.png"
            "$base/CanonicalCardDetailDarkScreenshot_canonical_card_detail_dark_7c0c9ebf_0.png"
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "Missing approved PNG: $file"; exit 1; }
          done
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No card-detail screenshot changes."
            exit 0
          fi
          while IFS= read -r changed; do
            allowed=false
            for file in "${files[@]}"; do
              if [[ "$changed" == "$file" ]]; then allowed=true; break; fi
            done
            if [[ "$allowed" != true ]]; then
              echo "Unexpected staged change: $changed"; exit 1
            fi
          done < <(git diff --cached --name-only)
          git diff --cached --name-only
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(android): reviewed light/dark card archive screenshots (#155)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
