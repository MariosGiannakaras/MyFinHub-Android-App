name: Temporary transaction entry readback patch

on:
  push:
    branches:
      - feature/full-transaction-entry-parity
    paths:
      - .github/workflows/tmp-readback-transaction-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-transaction-entry-parity
          fetch-depth: 0
      - name: Extend canonical event readback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/app/myfinhub/android/core/data/CanonicalFinanceDomain.kt')
          text = path.read_text()
          old = '''    val note: String,
              val category: String?,
              val accountId: String?,
              val fromAccountId: String?,
              val toAccountId: String?,
              val cardId: String?,
              val loanId: String?,'''
          new = '''    val note: String,
              val category: String?,
              val subcategory: String?,
              val accountId: String?,
              val fromAccountId: String?,
              val toAccountId: String?,
              val person: String?,
              val expectedReturnDate: String?,
              val cardId: String?,
              val loanId: String?,'''
          if old not in text:
              raise SystemExit('CanonicalEvent fields marker not found')
          text = text.replace(old, new, 1)
          old = '''            note = event.string("note").orEmpty(),
              category = event.string("category"),
              accountId = event.string("accountId"),
              fromAccountId = event.string("fromAccountId"),
              toAccountId = event.string("toAccountId"),
              cardId = event.string("cardId"),'''
          new = '''            note = event.string("note").orEmpty(),
              category = event.string("category"),
              subcategory = event.string("subcategory"),
              accountId = event.string("accountId"),
              fromAccountId = event.string("fromAccountId"),
              toAccountId = event.string("toAccountId"),
              person = event.string("person"),
              expectedReturnDate = event.string("expectedReturnDate"),
              cardId = event.string("cardId"),'''
          if old not in text:
              raise SystemExit('CanonicalEvent parser marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-readback-transaction-entry.yml
          git add app/src/main/java/app/myfinhub/android/core/data/CanonicalFinanceDomain.kt
          git commit -m "feat: read back full transaction entry metadata"
          git push origin feature/full-transaction-entry-parity
