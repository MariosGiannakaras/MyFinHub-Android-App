name: Sync self-update status handoff

on:
  push:
    paths:
      - .github/workflows/_sync-self-update-status.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: develop
          fetch-depth: 0

      - name: Synchronize STATUS and TODO
        shell: python
        run: |
          from pathlib import Path

          status_path = Path('STATUS.md')
          status = status_path.read_text()
          status_heading = '## 2026-09-03 — Private self-updater hosted implementation complete and merged'
          status_section = '''## 2026-09-03 — Private self-updater hosted implementation complete and merged

Tracker #52 is completed/closed and the validated private self-updater implementation is merged into `develop`.

### Completed updater work

- MyFinHub now checks the owner-only authenticated AAL2 update endpoint automatically after a ready session and manually from Settings without coupling update-service failures to auth logout or finance state.
- Update metadata and APK bytes use the private MyFinHub/Supabase path. The Android client accepts only the configured HTTPS Storage host and `/storage/v1/object/authenticated/android-releases/`, sends the owner bearer plus publishable key, and never embeds runtime service-role/storage-admin/signing secrets.
- Downloads are bounded and streamed with progress, exact size and SHA-256 validation, temporary-file cleanup and explicit recoverable failure states.
- APK verification rejects wrong package, downgrade/wrong version and wrong signing identity before PackageInstaller. The verifier remains fail-closed down to minSdk 26.
- PackageInstaller handles the Android install-source permission boundary and system-confirmation fallback; the app does not bypass platform security prompts.
- Package replacement is designed to preserve encrypted app data. After restart the expected flow is local PIN/biometric unlock plus server-session validation/refresh, not a new email/password/TOTP login unless the server session is actually invalid/expired/revoked.
- Production Settings includes the real Updates section with current version, update state, release notes, progress and install/recovery actions.
- The central MyFinHub `develop` backend contains the matching owner+AAL2 `/api/android-update` endpoint, private `android-releases` Storage/metadata RLS and backend coverage; the API response matches the Android parser/download contract.

### Visual and hosted validation

- Real Compose Settings/update candidates were rendered for compact light, dark and 150% font.
- The changed candidates were personally inspected before canonicalization; a focused 150% updater reference confirms version, release notes, primary download action and session-continuity copy without clipping/overlap.
- The accepted PNGs were reproduced exactly by the official renderer before commit.
- Final canonical screenshot regression passed without candidate fallback.
- Final representative S24-target instrumentation passed.
- Final normal Android verification passed: benchmark/Baseline Profile tooling, unit tests, instrumentation compile, lint/debug assembly, optimized unsigned release/R8 and release-manifest/unsigned-APK policy audit.
- No unresolved updater PR review blocker remained at merge.

### Preserved Phase 6 / signing boundary

The physical Galaxy S24 Ultra remains authoritative. Before production signing, Phase 6 must run an in-place update smoke with two controlled non-production builds signed by the same temporary/test identity and verify install-source/system-confirmation behavior plus encrypted session/PIN/CVV continuity. After physical acceptance and explicit signing authorization, repeat the same upgrade with strictly increasing production-signed builds using the single long-lived production signing identity.

No production signing key, production-signed APK, version freeze, `develop -> main` promotion or public/private production release was created by this hosted workstream. Issue #14 and `docs/PHASE_6_DEVICE_HANDOFF.md` remain authoritative.

'''
          if status_heading not in status:
              prefix = '# MyFinHub Android status\n\n'
              if not status.startswith(prefix):
                  raise SystemExit('Unexpected STATUS.md heading')
              status = prefix + status_section + status[len(prefix):]
              status_path.write_text(status)

          todo_path = Path('TODO.md')
          todo = todo_path.read_text()
          todo_heading = '## Private self-updater — completed and merged'
          todo_section = '''## Private self-updater — completed and merged

Tracker #52 is completed/closed and the validated updater implementation is merged into `develop`.

- [x] Add automatic and manual authenticated owner+AAL2 update checks without blocking normal product use when the update service is unavailable.
- [x] Add a production Settings Updates section with current version, release state/notes, progress and install/recovery actions.
- [x] Download APKs only from the configured private bearer-authenticated `android-releases` Storage path with bounded streaming, exact-size and SHA-256 validation.
- [x] Reject malformed metadata, insecure/wrong-host URLs, downgrade/wrong version, wrong package, wrong signer and integrity mismatch.
- [x] Add PackageInstaller integration with install-source permission handoff and system-confirmation fallback; do not bypass Android security prompts.
- [x] Preserve updater failures outside auth-logout/finance failure policy and preserve encrypted session/PIN/CVV application data across normal package replacement.
- [x] Align with the central MyFinHub owner+AAL2 `/api/android-update` endpoint and private Storage/metadata RLS already merged on central `develop`.
- [x] Add unit/instrumentation/security coverage and Phase 6 update/session-continuity handoff documentation.
- [x] Render and personally inspect real light/dark/150%-font Settings/update candidates; canonicalize only the accepted replacements.
- [x] Final canonical screenshot regression, representative S24 instrumentation and full normal Android verification green on the final implementation state.
- [x] Merge to Android `develop` with zero unresolved hosted review blockers.
- [x] Keep production signing/release/version freeze and `develop -> main` deferred to the physical Phase 6/signing handoff.

'''
          phase_heading = '## Phase 6 — physical-device / production / signing handoff'
          if todo_heading not in todo:
              if phase_heading not in todo:
                  raise SystemExit('Phase 6 TODO heading not found')
              todo = todo.replace(phase_heading, todo_section + phase_heading, 1)

          anchor = '- [ ] Validate Appearance System/Light/Dark persistence on the physical Samsung device.\n'
          updater_physical = '''- [ ] Validate the real Settings Updates section against the production-configured owner+AAL2 update endpoint, including the no-release/up-to-date state.\n- [ ] Before production signing, run an in-place updater smoke with two controlled non-production builds signed by the same temporary/test identity.\n- [ ] Validate Samsung install-source permission handoff and PackageInstaller system-confirmation fallback without bypassing Android prompts.\n- [ ] After that package replacement, verify the encrypted session/PIN/CVV stores survive, local PIN/biometric unlock works and email/password/TOTP is not requested unless the server session is genuinely invalid/expired/revoked.\n- [ ] After physical acceptance and explicit signing authorization, repeat the in-place update smoke with strictly increasing builds signed by the same long-lived production identity before release promotion.\n'''
          if updater_physical.splitlines()[0] not in todo:
              if anchor not in todo:
                  raise SystemExit('Phase 6 insertion anchor not found')
              todo = todo.replace(anchor, anchor + updater_physical, 1)

          todo_path.write_text(todo)

      - name: Commit synchronized handoff and remove helper
        shell: bash
        run: |
          rm .github/workflows/_sync-self-update-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md TODO.md .github/workflows/_sync-self-update-status.yml
          git diff --cached --check
          git commit -m "docs: record merged private self-updater handoff [skip ci]"
          git push origin HEAD:develop
