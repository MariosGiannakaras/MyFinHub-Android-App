name: UI UX batch C one-shot

on:
  push:
    branches: [android/ui-ux-canonical-correction-pass]
    paths: [.github/workflows/_uiux_batch_c_once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/ui-ux-canonical-correction-pass
          fetch-depth: 0

      - name: Repair brittle helper guard
        run: python scripts/_patch_uiux_batch_c_helper.py

      - name: Apply guarded transaction corrections
        run: python scripts/_uiux_batch_c.py

      - name: Verify focused activity edit tests and compile
        run: ./gradlew test --tests app.myfinhub.android.core.data.ActivityEditMutationTest compileDebugKotlin --stacktrace

      - name: Verify complete unit suite
        run: ./gradlew test --stacktrace

      - name: Commit retained transaction correction
        run: |
          rm -f .github/workflows/_uiux_batch_c_once.yml scripts/_uiux_batch_c.py scripts/_patch_uiux_batch_c_helper.py
          test ! -e .github/workflows/_uiux_batch_c_once.yml
          test ! -e scripts/_uiux_batch_c.py
          test ! -e scripts/_patch_uiux_batch_c_helper.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add canonical transaction interactions (#61)"
          git push origin HEAD:android/ui-ux-canonical-correction-pass
