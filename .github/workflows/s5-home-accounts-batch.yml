name: S5 Home Accounts Verification

on:
  push:
    branches:
      - automation/s2-checkpoint-sync
    paths:
      - '.github/workflows/s5-home-accounts-batch.yml'

permissions:
  contents: write

jobs:
  verify-and-refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout S5 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s5-home-accounts
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Refine canonical Home and Wallet semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Carry canonical detail that the S5 UI can truthfully display.
          home_state = 'app/src/main/java/app/myfinhub/android/feature/home/HomeUiState.kt'
          replace_once(
              home_state,
              '''data class HomeAttentionItem(\n    val id: String,\n    val title: String,\n    val reason: String,\n    val dueLabel: String,\n    val tone: HomeAttentionTone,\n)\n''',
              '''data class HomeAttentionItem(\n    val id: String,\n    val title: String,\n    val reason: String,\n    val dueLabel: String,\n    val tone: HomeAttentionTone,\n    val sourceLabel: String? = null,\n    val rawDueDate: String? = null,\n    val amount: Double? = null,\n)\n''',
          )

          money_state = 'app/src/main/java/app/myfinhub/android/feature/money/MoneyUiState.kt'
          replace_once(
              money_state,
              '''data class MoneyAccount(\n    val id: String,\n    val name: String,\n    val balance: Double,\n    val kind: String,\n    val institution: String? = null,\n)\n''',
              '''data class MoneyAccount(\n    val id: String,\n    val name: String,\n    val balance: Double,\n    val kind: String,\n    val institution: String? = null,\n    val excludeFromAvailable: Boolean = false,\n)\n''',
          )
          replace_once(
              money_state,
              '''    /** Canonical aggregate ledger debt, independent of active card visibility. Null for legacy fixtures. */\n    val aggregateCreditOutstanding: Double? = null,\n)\n''',
              '''    /** Canonical aggregate ledger debt, independent of active card visibility. Null for legacy fixtures. */\n    val aggregateCreditOutstanding: Double? = null,\n    /** Date used for the canonical balance projection; null only for synthetic/legacy fixtures. */\n    val asOfDate: String? = null,\n)\n''',
          )

          projection = 'app/src/main/java/app/myfinhub/android/app/CanonicalProductProjection.kt'
          replace_once(
              projection,
              '''                kind = accountKindLabel(account.kind),\n                institution = provider?.institutionLabel,\n            )\n''',
              '''                kind = accountKindLabel(account.kind),\n                institution = provider?.institutionLabel,\n                excludeFromAvailable = account.excludeFromAvailable,\n            )\n''',
          )
          replace_once(
              projection,
              '''        aggregateCreditOutstanding = globalCreditOutstanding,\n    )\n''',
              '''        aggregateCreditOutstanding = globalCreditOutstanding,\n        asOfDate = asOf,\n    )\n''',
          )
          replace_once(
              projection,
              '''                    dueLabel = if (item.dueDate == asOf) "Σήμερα" else "Καθυστερημένη",\n                    tone = HomeAttentionTone.URGENT,\n                )\n''',
              '''                    dueLabel = if (item.dueDate == asOf) "Σήμερα" else "Καθυστερημένη",\n                    tone = HomeAttentionTone.URGENT,\n                    sourceLabel = accountLabel(item.accountId, item.fromAccountId, item.toAccountId, accountNames)\n                        .takeUnless { it == "—" },\n                    rawDueDate = item.dueDate,\n                    amount = -abs(item.amount),\n                )\n''',
          )

          # Excluded accounts must never leak into the daily-available subtotal.
          wallet = 'app/src/main/java/app/myfinhub/android/feature/money/WalletAccountsScreens.kt'
          replace_once(
              wallet,
              '''          internal fun walletAccountGroup(account: MoneyAccount): WalletAccountGroup = when {\n              account.kind.contains("Αποταμί", ignoreCase = true) -> WalletAccountGroup.SAVINGS\n              account.kind.contains("Τράπεζ", ignoreCase = true) ||\n                  account.kind.contains("Μετρη", ignoreCase = true) -> WalletAccountGroup.DAILY\n              else -> WalletAccountGroup.OTHER\n          }\n''',
              '''          internal fun walletAccountGroup(account: MoneyAccount): WalletAccountGroup = when {\n              account.kind.contains("Αποταμί", ignoreCase = true) -> WalletAccountGroup.SAVINGS\n              account.excludeFromAvailable -> WalletAccountGroup.OTHER\n              account.kind.contains("Τράπεζ", ignoreCase = true) ||\n                  account.kind.contains("Μετρη", ignoreCase = true) -> WalletAccountGroup.DAILY\n              else -> WalletAccountGroup.OTHER\n          }\n''',
          )
          replace_once(
              wallet,
              '''          import java.text.NumberFormat\n          import java.util.Locale\n''',
              '''          import java.text.NumberFormat\n          import java.time.LocalDate\n          import java.time.format.DateTimeFormatter\n          import java.util.Locale\n''',
          )
          replace_once(
              wallet,
              '''                          title = "Καθαρή θέση",\n                          subtitle = "Τελευταία διαθέσιμη canonical εικόνα",\n                          navigation = { MyFinHubBackButton(onBack) },\n''',
              '''                          title = "Καθαρή θέση",\n                          subtitle = state.asOfDate?.let { "Εικόνα έως ${formatWalletDate(it)}" }\n                              ?: "Τελευταία διαθέσιμη canonical εικόνα",\n                          navigation = { MyFinHubBackButton(onBack) },\n''',
          )
          replace_once(
              wallet,
              '''          private fun walletAmountText(value: Double, visible: Boolean): String =\n              if (visible) NumberFormat.getCurrencyInstance(Locale.forLanguageTag("el-GR")).format(value) else "•••• €"\n''',
              '''          private fun walletAmountText(value: Double, visible: Boolean): String =\n              if (visible) NumberFormat.getCurrencyInstance(Locale.forLanguageTag("el-GR")).format(value) else "•••• €"\n\n          private fun formatWalletDate(raw: String): String = runCatching {\n              LocalDate.parse(raw.take(10)).format(DateTimeFormatter.ofPattern("d MMMM yyyy", Locale.forLanguageTag("el-GR")))\n          }.getOrDefault(raw)\n''',
          )

          # A contextual account remains the source when the user changes Expense -> Transfer/Card payment.
          quick = 'app/src/main/java/app/myfinhub/android/feature/quickentry/QuickEntryUiState.kt'
          replace_once(
              quick,
              '''    val fromId = state.fromAccountId.takeIf {\n        previousUsesSource && newUsesSource && idExists(state, it)\n    } ?: defaultSourceId\n''',
              '''    val contextualSourceId = state.accountId.takeIf {\n        previousKind.needsPrimaryAccount && newUsesSource && idExists(state, it)\n    }\n    val fromId = state.fromAccountId.takeIf {\n        previousUsesSource && newUsesSource && idExists(state, it)\n    } ?: contextualSourceId ?: defaultSourceId\n''',
          )

          # Force Home -> All accounts to reset the Wallet selector to Accounts without disturbing normal tab memory.
          app = 'app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt'
          replace_once(
              app,
              '''    var currentDestination by rememberSaveable { mutableStateOf(TopLevelDestination.HOME) }\n    var frontendMoneyState by remember(moneyState) { mutableStateOf(moneyState) }\n''',
              '''    var currentDestination by rememberSaveable { mutableStateOf(TopLevelDestination.HOME) }\n    var walletAccountsRequest by rememberSaveable { mutableStateOf(0) }\n    var frontendMoneyState by remember(moneyState) { mutableStateOf(moneyState) }\n''',
          )
          replace_once(
              app,
              '''                            onOpenAllAccounts = {\n                                homeBackStack.popToRoot()\n                                currentDestination = TopLevelDestination.MONEY\n                                moneyBackStack.popToRoot()\n                            },\n''',
              '''                            onOpenAllAccounts = {\n                                homeBackStack.popToRoot()\n                                moneyBackStack.popToRoot()\n                                walletAccountsRequest += 1\n                                currentDestination = TopLevelDestination.MONEY\n                            },\n''',
          )
          replace_once(
              app,
              '''                        CanonicalWalletScreen(\n                            state = moneyState,\n                            onOpenAccount = { accountId -> moneyBackStack.pushIfNew(AppRoute.AccountDetail(accountId)) },\n''',
              '''                        CanonicalWalletScreen(\n                            state = moneyState,\n                            accountsRequest = walletAccountsRequest,\n                            onOpenAccount = { accountId -> moneyBackStack.pushIfNew(AppRoute.AccountDetail(accountId)) },\n''',
          )
          replace_once(
              wallet,
              '''          fun CanonicalWalletScreen(\n              state: MoneyUiState,\n              onOpenAccount: (String) -> Unit,\n''',
              '''          fun CanonicalWalletScreen(\n              state: MoneyUiState,\n              accountsRequest: Int = 0,\n              onOpenAccount: (String) -> Unit,\n''',
          )
          replace_once(
              wallet,
              '''              var selectedName by rememberSaveable { mutableStateOf(WalletSection.ACCOUNTS.name) }\n''',
              '''              var selectedName by rememberSaveable(accountsRequest) { mutableStateOf(WalletSection.ACCOUNTS.name) }\n''',
          )
          PY

      - name: Expand attention detail with available canonical facts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/myfinhub/android/feature/home/HomeAttentionDetailScreen.kt')
          s = p.read_text()
          s = s.replace(
              'package app.myfinhub.android.feature.home\n\n',
              'package app.myfinhub.android.feature.home\n\nimport android.content.Context\n',
              1,
          )
          s = s.replace(
              'import androidx.compose.runtime.Composable\n',
              'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.DisposableEffect\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\n',
              1,
          )
          s = s.replace(
              'import androidx.compose.ui.Modifier\n',
              'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.platform.LocalContext\n',
              1,
          )
          s = s.replace(
              'import app.myfinhub.android.feature.home.HomeAttentionTone\n' if 'import app.myfinhub.android.feature.home.HomeAttentionTone\n' in s else 'import app.myfinhub.android.designsystem.MyFinHubSpacing\n',
              'import app.myfinhub.android.designsystem.MyFinHubSpacing\nimport app.myfinhub.android.feature.utilities.AmountVisibilityPreference\nimport app.myfinhub.android.feature.utilities.AppAppearancePreference\nimport java.text.NumberFormat\nimport java.time.LocalDate\nimport java.time.format.DateTimeFormatter\nimport java.util.Locale\n',
              1,
          )
          anchor = '''          ) { padding ->\n              Column(\n'''
          replacement = '''          ) { padding ->\n              val context = LocalContext.current\n              val preferences = remember(context) {\n                  context.applicationContext.getSharedPreferences(AppAppearancePreference.PREFERENCES_NAME, Context.MODE_PRIVATE)\n              }\n              var amountsVisible by remember(context) { mutableStateOf(AmountVisibilityPreference.read(context)) }\n              DisposableEffect(preferences) {\n                  val listener = android.content.SharedPreferences.OnSharedPreferenceChangeListener { _, key ->\n                      if (key == AmountVisibilityPreference.KEY) amountsVisible = AmountVisibilityPreference.read(context)\n                  }\n                  preferences.registerOnSharedPreferenceChangeListener(listener)\n                  onDispose { preferences.unregisterOnSharedPreferenceChangeListener(listener) }\n              }\n              Column(\n'''
          if s.count(anchor) != 1:
              raise SystemExit('attention padding anchor mismatch')
          s = s.replace(anchor, replacement, 1)
          old = '''                              Text(\n                                  text = if (urgent) "Άμεσος έλεγχος · ${item.dueLabel}" else item.dueLabel,\n                                  style = MaterialTheme.typography.labelLarge,\n                                  color = if (urgent) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.onSurfaceVariant,\n                              )\n'''
          new = '''                              Text(\n                                  text = if (urgent) "Άμεσος έλεγχος" else "Για έλεγχο",\n                                  style = MaterialTheme.typography.labelLarge,\n                                  color = if (urgent) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.onSurfaceVariant,\n                              )\n'''
          if s.count(old) != 1:
              raise SystemExit('attention urgency anchor mismatch')
          s = s.replace(old, new, 1)
          old = '''                      MyFinHubSectionCard(modifier = Modifier.fillMaxWidth()) {\n                          Column(verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.xs)) {\n                              Text("Γιατί εμφανίζεται", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)\n                              Text(\n                                  item.reason,\n                                  style = MaterialTheme.typography.bodyMedium,\n                                  color = MaterialTheme.colorScheme.onSurfaceVariant,\n                              )\n                          }\n                      }\n\n                      val actionLabel = if (item.id == "transaction-review") "Άνοιγμα κινήσεων" else "Άνοιγμα πλάνου"\n'''
          new = '''                      MyFinHubSectionCard(modifier = Modifier.fillMaxWidth()) {\n                          Column(verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.xs)) {\n                              Text("Στοιχεία", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)\n                              item.sourceLabel?.takeIf(String::isNotBlank)?.let { AttentionFact("Πηγή", it) }\n                              AttentionFact(\n                                  "Ημερομηνία",\n                                  item.rawDueDate?.takeIf(String::isNotBlank)?.let(::formatAttentionDate) ?: item.dueLabel,\n                              )\n                              item.amount?.let { amount ->\n                                  AttentionFact("Ποσό", if (amountsVisible) formatAttentionEuro(amount) else "•••• €")\n                              }\n                              Text(\n                                  item.reason,\n                                  style = MaterialTheme.typography.bodyMedium,\n                                  color = MaterialTheme.colorScheme.onSurfaceVariant,\n                              )\n                          }\n                      }\n\n                      val actionLabel = if (item.id == "transaction-review") "Άνοιγμα κινήσεων" else "Άνοιγμα πλάνου"\n'''
          if s.count(old) != 1:
              raise SystemExit('attention detail card anchor mismatch')
          s = s.replace(old, new, 1)
          s += '''\n@Composable\nprivate fun AttentionFact(label: String, value: String) {\n    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {\n        Text(label, style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.onSurfaceVariant)\n        Text(value, style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.SemiBold)\n    }\n}\n\nprivate fun formatAttentionDate(raw: String): String = runCatching {\n    LocalDate.parse(raw.take(10)).format(DateTimeFormatter.ofPattern("d MMMM yyyy", Locale.forLanguageTag("el-GR")))\n}.getOrDefault(raw)\n\nprivate fun formatAttentionEuro(value: Double): String =\n    NumberFormat.getCurrencyInstance(Locale.forLanguageTag("el-GR")).format(value)\n'''
          p.write_text(s)
          PY

      - name: Extend focused unit coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/java/app/myfinhub/android/feature/money/WalletAccountsScreensTest.kt')
          s = p.read_text()
          old = '''                          MoneyAccount("other", "Broker", 300.0, "Επένδυση"),\n'''
          new = '''                          MoneyAccount("excluded", "Δεσμευμένος", 400.0, "Τράπεζα", excludeFromAvailable = true),\n                          MoneyAccount("other", "Broker", 300.0, "Επένδυση"),\n'''
          if s.count(old) != 1:
              raise SystemExit('wallet test fixture mismatch')
          s = s.replace(old, new, 1)
          s = s.replace(
              '                  assertEquals(listOf("other"), walletAccountsInGroup(state, WalletAccountGroup.OTHER).map { it.id })\n',
              '                  assertEquals(listOf("excluded", "other"), walletAccountsInGroup(state, WalletAccountGroup.OTHER).map { it.id })\n',
              1,
          )
          p.write_text(s)

          q = Path('app/src/test/java/app/myfinhub/android/feature/quickentry/QuickEntryReducerTest.kt')
          qs = q.read_text()
          marker = '''    @Test\n    fun allTwelveKinds_haveAValidCanonicalDraft() {\n'''
          addition = '''    @Test\n    fun contextualPrimaryAccount_becomesSourceWhenChangingToTransfer() {\n        val state = QuickEntryUiState(\n            kind = QuickEntryKind.EXPENSE,\n            accountId = "acc-cash",\n            fromAccountId = "acc-main",\n        )\n\n        val transfer = reduceQuickEntry(state, QuickEntryAction.SelectKind(QuickEntryKind.TRANSFER))\n        val cardPayment = reduceQuickEntry(state, QuickEntryAction.SelectKind(QuickEntryKind.CARD_PAYMENT))\n\n        assertEquals("acc-cash", transfer.fromAccountId)\n        assertEquals("acc-cash", cardPayment.fromAccountId)\n    }\n\n'''
          if qs.count(marker) != 1:
              raise SystemExit('quick entry test marker mismatch')
          q.write_text(qs.replace(marker, addition + marker, 1))
          PY

      - name: Add production S5 Compose contract tests
        shell: bash
        run: |
          cat > app/src/androidTest/java/app/myfinhub/android/feature/money/ProductionHomeWalletTest.kt <<'KOTLIN'
          package app.myfinhub.android.feature.money

          import androidx.compose.ui.test.assertCountEquals
          import androidx.compose.ui.test.assertDoesNotExist
          import androidx.compose.ui.test.assertIsDisplayed
          import androidx.compose.ui.test.junit4.v2.createComposeRule
          import androidx.compose.ui.test.onAllNodesWithText
          import androidx.compose.ui.test.onNodeWithText
          import androidx.compose.ui.test.performClick
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import app.myfinhub.android.designsystem.MyFinHubTheme
          import app.myfinhub.android.feature.home.ProductionHomeScreen
          import app.myfinhub.android.feature.home.syntheticHomeUiState
          import app.myfinhub.android.feature.activity.syntheticActivityUiState
          import org.junit.Assert.assertTrue
          import org.junit.Rule
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class ProductionHomeWalletTest {
              @get:Rule
              val composeRule = createComposeRule()

              @Test
              fun home_isCompactAndDoesNotRepeatSecondarySummaries() {
                  composeRule.setContent {
                      MyFinHubTheme {
                          ProductionHomeScreen(
                              state = syntheticHomeUiState(),
                              onAction = {},
                              onOpenAttention = {},
                              onOpenSettings = {},
                              onOpenQuickEntry = {},
                              onOpenAccount = {},
                              onOpenAllAccounts = {},
                          )
                      }
                  }

                  composeRule.onNodeWithText("Διαθέσιμα τώρα").assertIsDisplayed()
                  composeRule.onNodeWithText("Νέα κίνηση").assertIsDisplayed()
                  composeRule.onNodeWithText("Όλοι οι λογαριασμοί").assertIsDisplayed()
                  composeRule.onNodeWithText("Έσοδα μήνα").assertDoesNotExist()
                  composeRule.onNodeWithText("Επόμενες υποχρεώσεις").assertDoesNotExist()
                  composeRule.onAllNodesWithText("Χρειάζεται προσοχή").assertCountEquals(1)
              }

              @Test
              fun wallet_exposesAccountsCardsDebtsAndNetPositionWithoutAdminControls() {
                  composeRule.setContent {
                      MyFinHubTheme {
                          CanonicalWalletScreen(
                              state = syntheticMoneyUiState(),
                              onOpenAccount = {},
                              onOpenNetPosition = {},
                              onOpenCard = {},
                              onAddCard = {},
                              onOpenLoans = {},
                              onOpenLending = {},
                          )
                      }
                  }

                  composeRule.onNodeWithText("Καθημερινά").assertIsDisplayed()
                  composeRule.onNodeWithText("Αποταμίευση").assertIsDisplayed()
                  composeRule.onNodeWithText("Καθαρή θέση").assertIsDisplayed()
                  composeRule.onNodeWithText("Κάρτες").performClick()
                  composeRule.onNodeWithText("Νέα κάρτα").assertIsDisplayed()
                  composeRule.onNodeWithText("Διαγραφή ενεργής κάρτας").assertDoesNotExist()
                  composeRule.onNodeWithText("Οφειλές").performClick()
                  composeRule.onNodeWithText("Πιστωτικό χρέος").assertIsDisplayed()
                  composeRule.onNodeWithText("Δάνεια").assertIsDisplayed()
                  composeRule.onNodeWithText("Απαιτήσεις").assertIsDisplayed()
              }

              @Test
              fun accountDetail_contextualNewTransactionAndSharedLedgerAreExposed() {
                  var requested = false
                  val account = syntheticMoneyAccounts().first()
                  composeRule.setContent {
                      MyFinHubTheme {
                          CanonicalAccountDetailScreen(
                              account = account,
                              activityItems = accountActivityItems(account.id, syntheticActivityUiState().items),
                              onBack = {},
                              onOpenActivity = {},
                              onNewTransaction = { requested = true },
                          )
                      }
                  }

                  composeRule.onNodeWithText("Νέα κίνηση από αυτόν τον λογαριασμό")
                      .assertIsDisplayed()
                      .performClick()
                  composeRule.runOnIdle { assertTrue(requested) }
                  composeRule.onNodeWithText("Κινήσεις λογαριασμού").assertIsDisplayed()
              }

              @Test
              fun netPosition_explainsAssetsLiabilitiesAndCalculation() {
                  composeRule.setContent {
                      MyFinHubTheme {
                          CanonicalNetPositionScreen(
                              state = syntheticMoneyUiState().copy(asOfDate = "2026-09-13"),
                              onBack = {},
                          )
                      }
                  }

                  composeRule.onNodeWithText("Περιουσιακά στοιχεία").assertIsDisplayed()
                  composeRule.onNodeWithText("Υποχρεώσεις").assertIsDisplayed()
                  composeRule.onNodeWithText("Προβολή υπολογισμού").performClick()
                  composeRule.onNodeWithText("Υπολογισμός").assertIsDisplayed()
              }
          }
          KOTLIN

      - name: Focused compile, unit and screenshot render
        shell: bash
        run: |
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin updateDebugScreenshotTest --stacktrace

      - name: Publish S5 candidate renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s5-home-wallet-candidates-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/**/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Commit verified S5 refinements
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/app/myfinhub/android/app/CanonicalProductProjection.kt \
            app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt \
            app/src/main/java/app/myfinhub/android/feature/home/HomeUiState.kt \
            app/src/main/java/app/myfinhub/android/feature/home/HomeAttentionDetailScreen.kt \
            app/src/main/java/app/myfinhub/android/feature/money/MoneyUiState.kt \
            app/src/main/java/app/myfinhub/android/feature/money/WalletAccountsScreens.kt \
            app/src/main/java/app/myfinhub/android/feature/quickentry/QuickEntryUiState.kt \
            app/src/test/java/app/myfinhub/android/feature/money/WalletAccountsScreensTest.kt \
            app/src/test/java/app/myfinhub/android/feature/quickentry/QuickEntryReducerTest.kt \
            app/src/androidTest/java/app/myfinhub/android/feature/money/ProductionHomeWalletTest.kt
          git diff --cached --check
          git commit -m "test: harden S5 account semantics"
          git push origin HEAD:android/redesign-s5-home-accounts
