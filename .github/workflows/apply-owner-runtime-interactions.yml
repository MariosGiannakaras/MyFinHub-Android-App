name: Apply owner runtime interactions

on:
  push:
    branches:
      - android/rc7-owner-ui-ux-correction-pass
    paths:
      - 'scripts/implement_owner_runtime_interactions.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/rc7-owner-ui-ux-correction-pass
          fetch-depth: 0

      - name: Apply deterministic patch
        shell: bash
        run: python3 scripts/implement_owner_runtime_interactions.py

      - name: Render canonical tracking
        shell: bash
        run: python3 scripts/render_project_tracking.py

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Validate runtime implementation
        shell: bash
        run: ./gradlew testDebugUnitTest compileDebugKotlin compileDebugAndroidTestKotlin --stacktrace

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: restore immediate online writes and add motion contract'
          git push origin HEAD:android/rc7-owner-ui-ux-correction-pass
