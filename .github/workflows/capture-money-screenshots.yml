name: Capture Money Screenshots

on:
  push:
    branches:
      - feature/money-product-parity
    paths:
      - '.github/workflows/capture-money-screenshots.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Money branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/money-product-parity

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh

      - name: Render current Money references
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Promote validated Money screenshots
        shell: bash
        run: |
          set -euo pipefail
          src='app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/MoneyParityScreenshotTestKt'
          mkdir -p screenshots/money
          cp "$src"/MoneyOverviewCompactLightScreenshot_money_overview_compact_light_98c1b72f_0.png screenshots/money/money-overview.png
          cp "$src"/MoneyOverviewCompactLargeFontScreenshot_money_overview_compact_large_font_1abb04bc_0.png screenshots/money/money-overview-large-font.png
          cp "$src"/MoneySavingsCompactLightScreenshot_money_savings_compact_light_db37ee82_0.png screenshots/money/money-savings.png
          cp "$src"/MoneyLoansCompactLightScreenshot_money_loans_compact_light_2459ad0d_0.png screenshots/money/money-loans.png
          cp "$src"/MoneyLoanEditorCompactLargeFontScreenshot_money_loan_editor_compact_large_font_66cf52cc_0.png screenshots/money/money-loan-edit-large-font.png
          cp "$src"/MoneyLendingCompactLightScreenshot_money_lending_compact_light_2880436e_0.png screenshots/money/money-lending.png
          cp "$src"/MoneyLendingEditorCompactLightScreenshot_money_lending_editor_compact_light_4c15b6ab_0.png screenshots/money/money-lending-edit.png

      - name: Commit references and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/capture-money-screenshots.yml .github/workflows/validate-money-frontend.yml
          git add app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/MoneyParityScreenshotTestKt screenshots/money
          git commit -m 'test(money): store validated visual references'
          git push origin HEAD:feature/money-product-parity
