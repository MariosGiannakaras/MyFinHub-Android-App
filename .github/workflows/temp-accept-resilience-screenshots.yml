name: Temporary accept resilience screenshots

on:
  push:
    branches:
      - feature/resilience-data-integrity-diagnostics
    paths:
      - '.github/workflows/temp-accept-resilience-screenshots.yml'

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/resilience-data-integrity-diagnostics
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Render and commit personally approved references
        shell: bash
        run: |
          ./gradlew updateDebugScreenshotTest --stacktrace
          diag=$(find app/src/screenshotTestDebug/reference -type f -name 'SettingsDiagnosticsPhoneScreenshot_settings_diagnostics_phone_*.png')
          edge=$(find app/src/screenshotTestDebug/reference -type f -name 'HomeEdgeValuesPhoneScreenshot_home_edge_values_phone_*.png')
          test "$(printf '%s\n' "$diag" | sed '/^$/d' | wc -l)" -eq 1
          test "$(printf '%s\n' "$edge" | sed '/^$/d' | wc -l)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-accept-resilience-screenshots.yml
          git add "$diag" "$edge"
          git diff --cached --check
          git commit -m "test: accept resilience and edge-state screenshots"
          git push origin HEAD:feature/resilience-data-integrity-diagnostics
