name: S3 reviewed fix batch

on:
  push:
    branches:
      - automation/s3-fix-review-batch

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/s3-fix-review-batch
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Apply reviewed fixes and regenerate tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_s3_review_fixes.py
          python3 scripts/render_project_tracking.py
          python3 scripts/render_project_tracking.py --check
          python3 -m unittest discover -s scripts -p 'test_project_tracking.py'
          git diff --check

      - name: Focused compile and unit validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:testDebugUnitTest \
            :app:compileDebugAndroidTestKotlin \
            :app:compileDebugScreenshotTestKotlin \
            --stacktrace

      - name: Regenerate only reviewed Activity references
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:updateDebugScreenshotTest --stacktrace
          python3 <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          expected = {
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/app/Phase2BScreenshotTestKt/Phase2BActivityCompactLargeFontScreenshot_phase2b_activity_compact_large_font_028afa13_0.png': '7c99fa07357eeb2caf854913d6aca6155a8decd72b76adb03a6d9c799cfe371a',
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/app/Phase2BScreenshotTestKt/Phase2BActivityCompactLightScreenshot_phase2b_activity_compact_light_5f73a0b5_0.png': 'f79794bb296c87ffcb355785885cf5738cfb304fe4b6436b1665263b234da93e',
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/CategoryActivityDarkScreenshot_category_activity_dark_e06782f7_0.png': '25900cb0394fe4bab96fedf76c52371043ccdd35cf8c131d3791cddb27239fa8',
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/CategoryActivityLargeFontScreenshot_category_activity_large_font_0e5a9b82_0.png': 'f49ee9b29c3f7b1006b084f3987fe9367c361d2c2a020b13de9f2f4172e7004c',
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/CategoryActivityLightScreenshot_category_activity_light_1c0e364d_0.png': 'd9f2494c6f0c8be1a5ae6fb9d29a81b888a122d8a8a70c0a8e2ab2b14f1a88b9',
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityAccountFilterSheetScreenshot_production_activity_account_filter_sheet_c54cb18a_0.png': '562c24ef8d606e7d670d28d018756538edf0a231e926ddec411edcdca9017290',
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityEditScreenshot_production_activity_edit_0f264771_0.png': 'd56414b909e2f40bf753d84783630075a04ffa6bd3d897d3196c69a93afac0d5',
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityPendingDarkScreenshot_production_activity_pending_dark_322b8683_0.png': '9ac79074f6826398a166fe9f40453ba011bda31d1f9bef159a518695230bd233',
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityPendingDetailScreenshot_production_activity_pending_detail_e48c1de9_0.png': '1b147b3ebafe95a30dfa438d1e1dee0e3952c6b529d2f5a2f789e4f59759ce44',
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityPendingLargeFontScreenshot_production_activity_pending_large_font_83e0a837_0.png': '3353e12e6d1f34c042dd0d676c012b340b82556991e2b7dd0ec055cb64af2ad4',
              'app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityPendingLightScreenshot_production_activity_pending_light_ee7d53cf_0.png': '5dfe691ae1ff5b2cec4492322f7a7926d6c3452afbbc581adc4b07470c8c204c',
          }
          changed = subprocess.check_output([
              'git', 'diff', '--name-only', '--', 'app/src/screenshotTestDebug/reference'
          ], text=True).splitlines()
          if set(changed) != set(expected):
              raise SystemExit(f'Unexpected screenshot reference diff. Expected {sorted(expected)}, got {sorted(changed)}')
          for raw, digest in expected.items():
              actual = hashlib.sha256(Path(raw).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'Render mismatch for {raw}: expected reviewed {digest}, got {actual}')
          print('All 11 generated references exactly match the personally reviewed candidate bytes.')
          PY
          ./gradlew :app:validateDebugScreenshotTest --stacktrace

      - name: Commit coherent reviewed checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_s3_review_fixes.py
          rm .github/workflows/s3-reviewed-fix-batch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(activity): close durable offline flows and accept reviewed S3 renders'
          git push origin HEAD:automation/s3-fix-review-batch
