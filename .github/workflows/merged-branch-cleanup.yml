name: Merged branch cleanup

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/merged-branch-cleanup.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Fetch all remote branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Delete only merged historical branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t open_heads < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].head.ref' | sort -u
          )
          mapfile -t merged_pr_heads < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
              --jq '.[] | select(.merged_at != null) | .head.ref' | sort -u
          )

          is_open_pr_head() {
            local candidate="$1"
            local head
            for head in "${open_heads[@]}"; do
              [[ "$candidate" == "$head" ]] && return 0
            done
            return 1
          }

          declare -A candidates=()

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            [[ -z "$branch" || "$branch" == *" -> "* ]] && continue
            candidates["$branch"]="fully-merged-tip"
          done < <(git branch -r --merged origin/develop --format='%(refname:short)' | sort)

          for branch in "${merged_pr_heads[@]}"; do
            [[ -z "$branch" ]] && continue
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              candidates["$branch"]="merged-pr-head"
            fi
          done

          deleted=0
          skipped=0
          failed=0

          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            case "$branch" in
              main|develop|extensions|android/protected-release-develop-trigger)
                echo "Preserve permanent branch: $branch"
                ((skipped+=1))
                continue
                ;;
            esac
            if is_open_pr_head "$branch"; then
              echo "Preserve open-PR branch: $branch"
              ((skipped+=1))
              continue
            fi
            reason="${candidates[$branch]}"
            echo "Delete historical branch ($reason): $branch"
            if git push origin --delete "$branch"; then
              ((deleted+=1))
            else
              echo "::warning::Could not delete $branch; leaving it in place."
              ((failed+=1))
            fi
          done < <(printf '%s\n' "${!candidates[@]}" | sort)

          {
            echo "## Merged branch cleanup"
            echo "- deleted: $deleted"
            echo "- preserved/skipped: $skipped"
            echo "- deletion failures: $failed"
            echo
            echo "Eligible branches were either fully merged into develop or recorded as heads of merged PRs."
            echo "Permanent branches, open-PR heads, branches with no merged-PR evidence, and other divergent work were not eligible."
          } >> "$GITHUB_STEP_SUMMARY"
