name: Final obsolete branch prune

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/merged-branch-cleanup.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: final-obsolete-branch-prune
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Delete only explicitly reviewed obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t open_heads < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].head.ref' | sort -u
          )

          is_open_pr_head() {
            local candidate="$1"
            local head
            for head in "${open_heads[@]}"; do
              [[ "$candidate" == "$head" ]] && return 0
            done
            return 1
          }

          allowlist=(
            "android/owner-ui-home-slice-b"
            "android/phase6-test-build-6010"
            "android/rc3-redesign-release-source"
            "android/rc4-redesign-pass2-release-source"
            "android/rc5-redesign-pass3-release-source"
            "android/rc6-full-reaudit-release-source"
            "android/rc6-owner-feedback-fixes"
            "android/rc6-post-publication-tracking"
            "android/rc7-corrected-release-source"
            "android/rc7-owner-home-ui-correction"
            "android/rc7-owner-ui-ux-home"
            "android/uiux-phase6-test-6011"
            "automation/s2-checkpoint-sync"
            "automation/s3-fix-review-batch"
            "automation/s4-tracking-close-20260913"
            "automation/s4-tracking-sync"
            "automation/s7-completion-sync-20260914"
            "automation/s7-plan-debts-20260914"
            "automation/s8-analysis-20260914"
            "automation/s8-analysis-20260915"
            "automation/s9-settings-auth-20260915"
            "checkpoint/phase1-trackers"
            "feat/124-synced-card-details"
            "feature/canonical-data-sync"
            "feature/frontend-utilities-parity"
            "feature/mobile-core-flows"
            "feature/performance-release-hardening"
            "__invalid_unused"
            "__noop_invalid"
            "chore/final-obsolete-branch-prune"
            "chore/fix-final-obsolete-prune"
            "chore/remove-final-cleanup-workflow"
          )

          deleted=0
          missing=0
          skipped_open=0
          failed=0

          for branch in "${allowlist[@]}"; do
            case "$branch" in
              main|develop|extensions|android/protected-release-develop-trigger)
                echo "::error::Permanent branch appeared in deletion allowlist: $branch"
                exit 1
                ;;
            esac

            if is_open_pr_head "$branch"; then
              echo "Preserve open-PR branch: $branch"
              ((skipped_open+=1))
              continue
            fi

            if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Already absent: $branch"
              ((missing+=1))
              continue
            fi

            echo "Delete reviewed obsolete branch: $branch"
            if git push origin --delete "$branch"; then
              ((deleted+=1))
            else
              echo "::warning::Could not delete $branch; leaving it in place."
              ((failed+=1))
            fi
          done

          {
            echo "## Final obsolete branch prune"
            echo "- deleted: $deleted"
            echo "- already absent: $missing"
            echo "- open-PR branches preserved: $skipped_open"
            echo "- deletion failures: $failed"
            echo
            echo "Only the explicit reviewed allowlist was eligible."
          } >> "$GITHUB_STEP_SUMMARY"

          (( failed == 0 ))
