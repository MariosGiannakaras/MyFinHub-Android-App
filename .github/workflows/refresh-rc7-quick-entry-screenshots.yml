name: Refresh RC7 Quick Entry screenshots

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'app/src/main/java/app/myfinhub/android/feature/quickentry/**'
      - 'app/src/screenshotTest/kotlin/app/myfinhub/android/feature/quickentry/**'
      - '.github/workflows/refresh-rc7-quick-entry-screenshots.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'android/rc7-owner-ui-ux-correction-pass'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Render exact-head references
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Commit only changed Quick Entry references
        shell: bash
        run: |
          git add app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/quickentry/ProductionQuickEntryScreenshotTestKt/*.png
          if git diff --cached --quiet; then
            echo 'Quick Entry screenshot references are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: refresh validated quick entry screenshot references'
          git push origin HEAD:${{ github.head_ref }}
