name: Commit approved Home goldens

on:
  push:
    branches:
      - feature/home-screen
    paths:
      - '.github/workflows/commit-home-goldens.yml'

permissions:
  contents: write

jobs:
  commit-goldens:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/home-screen

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Generate approved Home references
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Verify approved image hashes
        shell: bash
        run: |
          cd app
          echo '0838e99f9a47ded68c4309a9fd789a3aca3e096e9b6d47f0cf5db637788e50fb  src/screenshotTestDebug/reference/app/myfinhub/android/app/HomeScreenshotTestKt/HomeCompactLargeFontScreenshot_home_compact_large_font_58d2dd1c_0.png' | sha256sum -c -
          echo '3dd226f7722a3195cce4e664460d77eb5218e909674d792a271c0fe160fbd25d  src/screenshotTestDebug/reference/app/myfinhub/android/app/HomeScreenshotTestKt/HomeCompactLightScreenshot_home_compact_light_bfd9ed62_0.png' | sha256sum -c -
          echo '22c49c210ed8cbbefa130dfd83cdaaa0e02241d0db4b102fd55fb74ea783cdc3  src/screenshotTestDebug/reference/app/myfinhub/android/app/HomeScreenshotTestKt/HomeExpandedDarkScreenshot_home_expanded_dark_6aa0d8b0_0.png' | sha256sum -c -

      - name: Commit only approved Home references
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/screenshotTestDebug/reference/app/myfinhub/android/app/HomeScreenshotTestKt/*.png
          git diff --cached --quiet && exit 0
          git commit -m 'test: commit approved Home screenshot goldens'
          git push origin HEAD:feature/home-screen
