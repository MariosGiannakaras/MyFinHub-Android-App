name: One-shot pending undo functional check

on:
  push:
    branches:
      - android/pending-undo-updater-delivery
    paths:
      - .github/workflows/_pending-undo-functional-check.yml

permissions:
  contents: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/pending-undo-updater-delivery

      - name: Add missing Undo helper import
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/app/myfinhub/android/app/FinanceProductViewModel.kt')
          text = path.read_text()
          anchor = 'import app.myfinhub.android.core.data.reconcileSatisfiedPendingMutations\n'
          addition = anchor + 'import app.myfinhub.android.core.data.undoLatestNeverSentPendingMutation\n'
          if 'import app.myfinhub.android.core.data.undoLatestNeverSentPendingMutation\n' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Unexpected import anchor')
              text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Functional compile and unit tests
        shell: bash
        run: ./gradlew test :app:compileDebugKotlin --stacktrace

      - name: Commit validated correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_pending-undo-functional-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/myfinhub/android/app/FinanceProductViewModel.kt
          git commit -m "Fix pending Undo wiring after functional validation"
          git push origin HEAD:android/pending-undo-updater-delivery
