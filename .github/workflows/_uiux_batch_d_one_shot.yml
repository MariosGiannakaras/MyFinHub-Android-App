name: UIUX Batch D One Shot

on:
  push:
    branches:
      - android/ui-ux-canonical-correction-pass

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/ui-ux-canonical-correction-pass
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Repair staged helper compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/_uiux_batch_d.py')
          t = p.read_text()
          old = '''private fun accountActivityIcon(kind: ActivityKind) = when (kind) {
              ActivityKind.INCOME -> MyFinHubIcons.Income
              ActivityKind.EXPENSE -> MyFinHubIcons.Expense
              ActivityKind.TRANSFER -> MyFinHubIcons.Transfer
              ActivityKind.CARD -> MyFinHubIcons.Card
              ActivityKind.SAVINGS -> MyFinHubIcons.Savings
              ActivityKind.REFUND -> MyFinHubIcons.Income
              ActivityKind.LENDING -> MyFinHubIcons.Account
              ActivityKind.RECONCILIATION -> MyFinHubIcons.Account
              ActivityKind.SPLIT -> MyFinHubIcons.Expense
          }

          private fun accountActivityTone(kind: ActivityKind) = when (kind) {
              ActivityKind.INCOME, ActivityKind.REFUND -> FinanceTone.Income
              ActivityKind.EXPENSE, ActivityKind.CARD, ActivityKind.SPLIT -> FinanceTone.Expense
              ActivityKind.TRANSFER -> FinanceTone.Transfer
              ActivityKind.SAVINGS -> FinanceTone.Savings
              ActivityKind.LENDING -> FinanceTone.Attention
              ActivityKind.RECONCILIATION -> FinanceTone.Neutral
          }'''
          new = '''private fun accountActivityIcon(kind: ActivityKind) = when (kind) {
              ActivityKind.INCOME -> MyFinHubIcons.Income
              ActivityKind.EXPENSE -> MyFinHubIcons.Expense
              ActivityKind.TRANSFER -> MyFinHubIcons.Transfer
              ActivityKind.CARD_PAYMENT -> MyFinHubIcons.Card
          }

          private fun accountActivityTone(kind: ActivityKind) = when (kind) {
              ActivityKind.INCOME -> FinanceTone.Income
              ActivityKind.EXPENSE, ActivityKind.CARD_PAYMENT -> FinanceTone.Expense
              ActivityKind.TRANSFER -> FinanceTone.Transfer
          }'''
          if old not in t:
              raise SystemExit('activity enum compatibility guard failed')
          t = t.replace(old, new)
          t = t.replace('''    onOpenAccount: (String) -> Unit,\n    onOpenRecent: (String) -> Unit,\n) {''', '''    onOpenAccount: (String) -> Unit = {},\n    onOpenRecent: (String) -> Unit = {},\n) {''', 1)
          t = t.replace('''    onOpenCard: (String) -> Unit,\n    onOpenAccount: (String) -> Unit,\n    onOpenSavings: () -> Unit,''', '''    onOpenCard: (String) -> Unit,\n    onOpenAccount: (String) -> Unit = {},\n    onOpenSavings: () -> Unit,''', 1)
          target = "assert t.count(old) == 1, 'app money wiring guard failed'\nt = t.replace(old, new)"
          repair = "assert t.count(old) == 2, 'app money wiring guard failed'\nt = t.replace(old, new, 1)"
          if t.count(target) != 1:
              raise SystemExit('app money guard repair target failed')
          t = t.replace(target, repair)
          p.write_text(t)
          PY

      - name: Apply guarded account drill-down batch
        run: python scripts/_uiux_batch_d.py

      - name: Verify focused projection test and Kotlin compile
        run: |
          ./gradlew :app:testDebugUnitTest --tests 'app.myfinhub.android.feature.money.AccountActivityProjectionTest' --stacktrace
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Verify complete unit suite
        run: ./gradlew test --stacktrace

      - name: Commit retained account drill-down correction
        shell: bash
        run: |
          rm -f scripts/_uiux_batch_d.py .github/workflows/_uiux_batch_d_one_shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add canonical account drill-down'
          git push origin HEAD:android/ui-ux-canonical-correction-pass
