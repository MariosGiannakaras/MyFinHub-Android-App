name: S3 batch apply

on:
  push:
    branches:
      - android/redesign-s3-activity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s3-activity
          fetch-depth: 0

      - name: Apply coherent S3 Activity batch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Missing replacement anchor in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              text = read(path)
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"Missing start anchor in {path}: {start!r}")
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f"Missing end anchor in {path}: {end!r}")
              write(path, text[:a] + replacement + text[b:])

          # Activity state: keep exact ledger scope, raw notes and linked-card identity.
          p = "app/src/main/java/app/myfinhub/android/feature/activity/ActivityUiState.kt"
          replace_once(
              p,
              '    /** Signed expense amounts by exact canonical category; null only for legacy preview fixtures. */\n    val categoryContributions: Map<String, Double>? = null,\n)',
              '    /** Signed expense amounts by exact canonical category; null only for legacy preview fixtures. */\n    val categoryContributions: Map<String, Double>? = null,\n    /** Raw canonical note. Keep this separate from presentation fallback text. */\n    val note: String = subtitle,\n    val cardId: String? = null,\n    val cardLabel: String? = null,\n)',
          )
          replace_once(
              p,
              '                item.subtitle.contains(needle, ignoreCase = true) ||\n                item.kind.label.contains(needle, ignoreCase = true) ||',
              '                item.subtitle.contains(needle, ignoreCase = true) ||\n                item.note.contains(needle, ignoreCase = true) ||\n                item.kind.label.contains(needle, ignoreCase = true) ||',
          )
          replace_once(
              p,
              '            val matchesCategory = exactCategory == null ||\n                (item.categoryContributions?.containsKey(exactCategory)\n                    ?: ((item.category?.takeIf(String::isNotBlank) ?: "Άλλο") == exactCategory))',
              '            val matchesCategory = exactCategory == null ||\n                (item.categoryContributions?.takeIf { it.isNotEmpty() }?.containsKey(exactCategory)\n                    ?: ((item.category?.takeIf(String::isNotBlank) ?: "Άλλο") == exactCategory))',
          )
          replace_once(
              p,
              '                    subtitle = action.note,\n                    category = action.category.takeIf(String::isNotBlank),',
              '                    subtitle = action.note,\n                    note = action.note,\n                    category = action.category.takeIf(String::isNotBlank),',
          )

          # Canonical projection: preserve S3 filters across refresh and expose safe card identity.
          p = "app/src/main/java/app/myfinhub/android/app/CanonicalProductProjection.kt"
          replace_once(
              p,
              'val contributionsById = document.categoryContributionsBetween("0001-01-01", "9999-12-31")\n    .groupBy { it.transactionId }\nval activityItems = buildActivityItems(legacy, events, accountNames, eventChronology).map { item ->',
              'val contributionsById = document.categoryContributionsBetween("0001-01-01", "9999-12-31")\n    .groupBy { it.transactionId }\nval activityCardLabels = document.canonicalCards().associate { card ->\n    val base = card.nickname.ifBlank { card.network.ifBlank { "Κάρτα" } }\n    val last4 = card.last4.orEmpty()\n    card.id to if (last4.isBlank()) base else "$base • $last4"\n}\nval activityItems = buildActivityItems(legacy, events, accountNames, eventChronology, activityCardLabels).map { item ->',
          )
          replace_once(
              p,
              '        filter = oldActivity?.filter ?: ActivityFilter.ALL,\n        categoryFilter = oldActivity?.categoryFilter,\n        dateFrom = oldActivity?.dateFrom,\n        dateTo = oldActivity?.dateTo,',
              '        filter = oldActivity?.filter ?: ActivityFilter.ALL,\n        ledgerCategoryFilter = oldActivity?.ledgerCategoryFilter,\n        ledgerDateFrom = oldActivity?.ledgerDateFrom,\n        ledgerDateTo = oldActivity?.ledgerDateTo,\n        categoryFilter = oldActivity?.categoryFilter,\n        dateFrom = oldActivity?.dateFrom,\n        dateTo = oldActivity?.dateTo,',
          )
          replace_once(
              p,
              '    accountNames: Map<String, String>,\n    eventChronology: Map<String, String>,\n): List<ActivityItem> {',
              '    accountNames: Map<String, String>,\n    eventChronology: Map<String, String>,\n    cardLabels: Map<String, String>,\n): List<ActivityItem> {',
          )
          replace_once(
              p,
              '                    category = tx.category,\n                    subcategory = tx.subcategory,\n                    rawDate = tx.date,',
              '                    category = tx.category,\n                    subcategory = tx.subcategory,\n                    note = tx.note,\n                    rawDate = tx.date,',
          )
          replace_once(
              p,
              '                    category = event.category,\n                    subcategory = event.subcategory,\n                    rawDate = event.date,\n                    accountId = event.accountId,\n                    fromAccountId = event.fromAccountId,\n                    toAccountId = event.toAccountId,',
              '                    category = event.category,\n                    subcategory = event.subcategory,\n                    note = event.note,\n                    rawDate = event.date,\n                    accountId = event.accountId,\n                    fromAccountId = event.fromAccountId,\n                    toAccountId = event.toAccountId,\n                    cardId = event.cardId,\n                    cardLabel = event.cardId?.let(cardLabels::get),',
          )

          # Wire the S3 ledger/read-detail/editor surfaces into the retained Activity stack.
          p = "app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt"
          replace_once(
              p,
              'import app.myfinhub.android.feature.activity.ActivityDetailScreen\nimport app.myfinhub.android.feature.activity.ActivityScreen\n',
              'import app.myfinhub.android.feature.activity.ActivityEditScreen\nimport app.myfinhub.android.feature.activity.ActivityLedgerScreen\nimport app.myfinhub.android.feature.activity.ActivityReadDetailScreen\n',
          )
          replace_once(
              p,
              '    activityState: ActivityUiState = ActivityUiState(),\n    onActivityAction: (ActivityAction) -> Unit = {},\n',
              '    activityState: ActivityUiState = ActivityUiState(),\n    onActivityAction: (ActivityAction) -> Unit = {},\n    activityMutationInFlight: Boolean = false,\n    activityMutationBlocked: Boolean = false,\n',
          )
          new_routes = '''                entry<AppRoute.Activity> {
                    MovementRootSurface(
                        selected = ActivitySection.HISTORY,
                        onHistory = {},
                        onAnalysis = { activityBackStack.pushIfNew(AppRoute.Insights) },
                    ) {
                        ActivityLedgerScreen(
                            state = activityState,
                            onAction = onActivityAction,
                            onOpenDetail = { eventId -> activityBackStack.pushIfNew(AppRoute.ActivityDetail(eventId)) },
                            onOpenQuickEntry = { openFastExpense(activityBackStack) },
                        )
                    }
                }
                entry<AppRoute.ActivityDetail> { route ->
                    val item = activityState.items.firstOrNull { it.id == route.eventId }
                    ActivityReadDetailScreen(
                        item = item,
                        accountOptions = activityState.accountOptions,
                        mutationBlocked = activityMutationBlocked,
                        onBack = { activeBackStack.removeLastOrNull() },
                        onEdit = { activeBackStack.pushIfNew(AppRoute.ActivityEdit(route.eventId)) },
                        onDelete = { onActivityAction(ActivityAction.Delete(route.eventId)) },
                        onDeleted = { activeBackStack.removeLastOrNull() },
                    )
                }
                entry<AppRoute.ActivityEdit> { route ->
                    val item = activityState.items.firstOrNull { it.id == route.eventId }
                    ActivityEditScreen(
                        item = item,
                        categoryOptions = item?.let(activityState::categoryOptionsFor).orEmpty(),
                        mutationInFlight = activityMutationInFlight,
                        mutationBlocked = activityMutationBlocked,
                        onBack = { activeBackStack.removeLastOrNull() },
                        onSave = { date, note, category, subcategory ->
                            onActivityAction(
                                ActivityAction.SaveEdit(
                                    id = route.eventId,
                                    note = note,
                                    category = category,
                                    date = date,
                                    subcategory = subcategory,
                                ),
                            )
                        },
                        onSaved = { activeBackStack.removeLastOrNull() },
                    )
                }
                entry<AppRoute.CategoryActivity> { route ->
                    ActivityLedgerScreen(
                        state = activityState.forCategory(route.category, route.start, route.end),
                        onAction = onActivityAction,
                        onOpenDetail = { eventId -> activeBackStack.pushIfNew(AppRoute.ActivityDetail(eventId)) },
                        onOpenQuickEntry = { openFastExpense(activeBackStack) },
                        onBack = { activeBackStack.removeLastOrNull() },
                    )
                }
'''
          replace_between(
              p,
              '                entry<AppRoute.Activity> {',
              '                entry<AppRoute.QuickEntry> {',
              new_routes,
          )

          # Production root exposes mutation progress separately from recovery blocking.
          p = "app/src/main/java/app/myfinhub/android/app/MyFinHubRoot.kt"
          replace_once(
              p,
              '                    activityState = projection.activityState,\n                    onActivityAction = onActivityAction,\n                    quickEntryState = projection.quickEntryState,',
              '                    activityState = projection.activityState,\n                    onActivityAction = onActivityAction,\n                    activityMutationInFlight = state.saving,\n                    activityMutationBlocked = state.saving || state.issue != null,\n                    quickEntryState = projection.quickEntryState,',
          )

          # S3 screen hardening: shared accessible flat row, honest detail fields, sticky save and durable-success exit.
          p = "app/src/main/java/app/myfinhub/android/feature/activity/ActivityS3Screens.kt"
          replace_once(p, 'import androidx.compose.foundation.layout.heightIn\n', 'import androidx.compose.foundation.layout.heightIn\nimport androidx.compose.foundation.layout.imePadding\n')
          replace_once(p, 'import app.myfinhub.android.designsystem.MyFinHubDesignMetrics\n', 'import app.myfinhub.android.designsystem.MyFinHubDesignMetrics\nimport app.myfinhub.android.designsystem.MyFinHubFinanceRow\n')
          flat_row = '''@Composable
private fun ActivityFlatLedgerRow(
    item: ActivityItem,
    accountOptions: List<ActivityAccountOption>,
    onClick: () -> Unit,
) {
    val tone = item.s3Tone()
    val secondary = if (item.kind == ActivityKind.TRANSFER) {
        activityTransferRouteLabel(item, accountOptions)
    } else {
        item.note
    }
    val meta = when {
        item.pendingSync -> "Εκκρεμεί συγχρονισμός"
        item.kind == ActivityKind.TRANSFER -> "Εσωτερική μεταφορά"
        item.kind == ActivityKind.CARD_PAYMENT -> "Πληρωμή πιστωτικής · ${item.accountLabel}"
        else -> item.accountLabel
    }

    MyFinHubFinanceRow(
        icon = myFinHubCategoryIcon(item.category, item.kind.s3Icon()),
        iconDescription = null,
        title = item.title,
        subtitle = secondary,
        meta = meta,
        amountText = formatSignedEuro(item.amount),
        tone = tone,
        onClick = onClick,
    )
}

'''
          replace_between(
              p,
              '@Composable\nprivate fun ActivityFlatLedgerRow(',
              '@Composable\ninternal fun ActivityFilterSheetContent(',
              flat_row + '@Composable\ninternal fun ActivityFilterSheetContent(',
          )
          # The replacement above includes the end marker text; collapse the duplicate function prefix if present.
          text = read(p)
          text = text.replace('@Composable\ninternal fun ActivityFilterSheetContent(@Composable\ninternal fun ActivityFilterSheetContent(', '@Composable\ninternal fun ActivityFilterSheetContent(', 1)
          write(p, text)

          # Read detail takes a blocking policy, not an ambiguous in-flight flag.
          text = read(p)
          a = text.index('fun ActivityReadDetailScreen(')
          b = text.index('@Composable\nprivate fun ActivityMoreActions', a)
          region = text[a:b].replace('mutationInFlight: Boolean', 'mutationBlocked: Boolean').replace('mutationInFlight', 'mutationBlocked')
          text = text[:a] + region + text[b:]
          write(p, text)
          replace_once(
              p,
              '                item { ActivityReadField("Σημείωση", item.subtitle.ifBlank { "Χωρίς σημείωση" }) }\n                if (item.kind == ActivityKind.CARD_PAYMENT && item.subtitle.isNotBlank()) {\n                    item { ActivityReadField("Συνδεδεμένη κάρτα", item.subtitle) }\n                }',
              '                item { ActivityReadField("Σημείωση", item.note.ifBlank { "Χωρίς σημείωση" }) }\n                item.cardLabel?.takeIf(String::isNotBlank)?.let { cardLabel ->\n                    item { ActivityReadField("Συνδεδεμένη κάρτα", cardLabel) }\n                }',
          )
          replace_once(
              p,
              '    mutationInFlight: Boolean,\n    onBack: () -> Unit,',
              '    mutationInFlight: Boolean,\n    mutationBlocked: Boolean,\n    onBack: () -> Unit,',
          )
          replace_once(p, '    var note by rememberSaveable(item.id) { mutableStateOf(item.subtitle) }', '    var note by rememberSaveable(item.id) { mutableStateOf(item.note) }')
          replace_once(
              p,
              '    var saveRequested by rememberSaveable(item.id) { mutableStateOf(false) }\n    var requestedDate by rememberSaveable(item.id) { mutableStateOf("") }',
              '    var saveRequested by rememberSaveable(item.id) { mutableStateOf(false) }\n    var observedMutationInFlight by rememberSaveable(item.id) { mutableStateOf(false) }\n    var requestedDate by rememberSaveable(item.id) { mutableStateOf("") }',
          )
          replace_once(
              p,
              '    val dirty = date != item.rawDate.take(10) ||\n        note != item.subtitle ||',
              '    val dirty = date != item.rawDate.take(10) ||\n        note != item.note ||',
          )
          replace_once(
              p,
              '    val requestBack = {\n        if (dirty && !saveRequested) discardDialogOpen = true else onBack()\n    }\n    BackHandler(onBack = requestBack)\n\n    LaunchedEffect(\n        item.rawDate,\n        item.subtitle,\n        item.category,\n        item.subcategory,\n        saveRequested,\n        requestedDate,\n        requestedNote,\n        requestedCategory,\n        requestedSubcategory,\n    ) {\n        if (\n            saveRequested &&\n            item.rawDate.take(10) == requestedDate &&\n            item.subtitle == requestedNote &&\n            item.category.orEmpty() == requestedCategory &&\n            item.subcategory.orEmpty() == requestedSubcategory\n        ) {\n            saveRequested = false\n            onSaved()\n        }\n    }',
              '    val requestBack = {\n        when {\n            mutationInFlight -> Unit\n            dirty -> discardDialogOpen = true\n            else -> onBack()\n        }\n    }\n    BackHandler(onBack = requestBack)\n\n    LaunchedEffect(\n        item.rawDate,\n        item.note,\n        item.category,\n        item.subcategory,\n        mutationInFlight,\n        saveRequested,\n        requestedDate,\n        requestedNote,\n        requestedCategory,\n        requestedSubcategory,\n    ) {\n        val persisted = saveRequested &&\n            item.rawDate.take(10) == requestedDate &&\n            item.note == requestedNote &&\n            item.category.orEmpty() == requestedCategory &&\n            item.subcategory.orEmpty() == requestedSubcategory\n        when {\n            persisted -> {\n                saveRequested = false\n                observedMutationInFlight = false\n                onSaved()\n            }\n            saveRequested && mutationInFlight -> observedMutationInFlight = true\n            saveRequested && observedMutationInFlight && !mutationInFlight -> {\n                saveRequested = false\n                observedMutationInFlight = false\n            }\n        }\n    }',
          )
          old_scaffold = '''    Scaffold(
        containerColor = MaterialTheme.colorScheme.background,
        topBar = {
            MyFinHubScreenHeader(
                title = "Επεξεργασία κίνησης",
                subtitle = item.title,
                navigation = { MyFinHubBackButton(requestBack) },
            )
        },
    ) { padding ->'''
          new_scaffold = '''    Scaffold(
        containerColor = MaterialTheme.colorScheme.background,
        topBar = {
            MyFinHubScreenHeader(
                title = "Επεξεργασία κίνησης",
                subtitle = item.title,
                navigation = { MyFinHubBackButton(requestBack) },
            )
        },
        bottomBar = {
            Surface(color = MaterialTheme.colorScheme.background) {
                MyFinHubPrimaryAction(
                    label = if (mutationInFlight || saveRequested) "Αποθήκευση…" else "Αποθήκευση αλλαγών",
                    onClick = {
                        requestedDate = date
                        requestedNote = note.trim()
                        requestedCategory = category
                        requestedSubcategory = subcategory
                        saveRequested = true
                        onSave(date, note.trim(), category, subcategory)
                    },
                    modifier = Modifier
                        .fillMaxWidth()
                        .padding(horizontal = MyFinHubDesignMetrics.screenHorizontalPadding, vertical = MyFinHubSpacing.xs)
                        .navigationBarsPadding()
                        .imePadding(),
                    enabled = dirty && valid && !mutationBlocked && !saveRequested,
                    icon = null,
                )
            }
        },
    ) { padding ->'''
          replace_once(p, old_scaffold, new_scaffold)
          replace_once(p, '                onValueChange = { date = it },', '                onValueChange = { if (!mutationInFlight && !saveRequested) date = it },')
          replace_once(p, '                    enabled = !mutationInFlight,\n                    onSelected = { selected ->', '                    enabled = !mutationInFlight && !saveRequested,\n                    onSelected = { selected ->')
          replace_once(p, '                        enabled = !mutationInFlight,\n                        onSelected = { subcategory = it },', '                        enabled = !mutationInFlight && !saveRequested,\n                        onSelected = { subcategory = it },')
          replace_once(p, '                onValueChange = { note = it },\n                label = "Σημείωση",\n                singleLine = false,\n                enabled = !mutationInFlight,', '                onValueChange = { note = it },\n                label = "Σημείωση",\n                singleLine = false,\n                enabled = !mutationInFlight && !saveRequested,')
          old_inline_save = '''            MyFinHubPrimaryAction(
                label = if (mutationInFlight) "Αποθήκευση…" else "Αποθήκευση αλλαγών",
                onClick = {
                    requestedDate = date
                    requestedNote = note.trim()
                    requestedCategory = category
                    requestedSubcategory = subcategory
                    saveRequested = true
                    onSave(date, note.trim(), category, subcategory)
                },
                modifier = Modifier.fillMaxWidth(),
                enabled = dirty && valid && !mutationInFlight,
                icon = null,
            )
'''
          replace_once(p, old_inline_save, '')

          # Unit coverage for exact filters and refresh preservation.
          p = "app/src/test/java/app/myfinhub/android/feature/activity/ActivityReducerTest.kt"
          text = read(p)
          insert = r'''

    @Test
    fun ledgerFilters_areExactInclusiveAndIndependentlyRemovable() {
        val items = listOf(
            ActivityItem("food-main", "10 Σεπ", ActivityKind.EXPENSE, "Αγορά", "", -10.0, "Κύριος", "Τρόφιμα",
                rawDate = "2026-09-10", accountId = "main", categoryContributions = mapOf("Τρόφιμα" to 10.0)),
            ActivityItem("food-old", "31 Αυγ", ActivityKind.EXPENSE, "Αγορά", "", -8.0, "Κύριος", "Τρόφιμα",
                rawDate = "2026-08-31", accountId = "main", categoryContributions = mapOf("Τρόφιμα" to 8.0)),
            ActivityItem("food-cash", "10 Σεπ", ActivityKind.EXPENSE, "Αγορά", "", -4.0, "Μετρητά", "Τρόφιμα",
                rawDate = "2026-09-10", accountId = "cash", categoryContributions = mapOf("Τρόφιμα" to 4.0)),
            ActivityItem("transport-main", "10 Σεπ", ActivityKind.EXPENSE, "Εισιτήριο", "", -3.0, "Κύριος", "Μεταφορές",
                rawDate = "2026-09-10", accountId = "main", categoryContributions = mapOf("Μεταφορές" to 3.0)),
        )
        val initial = ActivityUiState(
            items = items,
            accountOptions = listOf(ActivityAccountOption("main", "Κύριος"), ActivityAccountOption("cash", "Μετρητά")),
        )

        val filtered = reduceActivity(
            initial,
            ActivityAction.ApplyFilters(
                type = ActivityFilter.EXPENSE,
                accountId = "main",
                category = "Τρόφιμα",
                dateFrom = "2026-09-01",
                dateTo = "2026-09-10",
            ),
        )

        assertEquals(listOf("food-main"), filtered.visibleItems.map { it.id })
        assertEquals(4, filtered.activeFilterCount)

        val withoutDate = reduceActivity(filtered, ActivityAction.RemoveFilter(ActivityFilterField.DATE))
        assertEquals(listOf("food-main", "food-old"), withoutDate.visibleItems.map { it.id })

        val cleared = reduceActivity(filtered.copy(query = "καφ"), ActivityAction.ClearFilters)
        assertEquals("καφ", cleared.query)
        assertEquals(0, cleared.activeFilterCount)
    }
'''
          pos = text.rfind('\n}')
          if pos < 0:
              raise SystemExit('Could not append ActivityReducerTest')
          write(p, text[:pos] + insert + text[pos:])

          p = "app/src/test/java/app/myfinhub/android/app/CanonicalProductProjectionTest.kt"
          replace_once(
              p,
              '                filter = ActivityFilter.EXPENSE, accountFilterId = "acc-main",\n                categoryFilter = "Τρόφιμα", dateFrom = "2026-08-01", dateTo = "2026-08-23"),',
              '                filter = ActivityFilter.EXPENSE, accountFilterId = "acc-main",\n                ledgerCategoryFilter = "Τρόφιμα", ledgerDateFrom = "2026-08-02", ledgerDateTo = "2026-08-22",\n                categoryFilter = "Τρόφιμα", dateFrom = "2026-08-01", dateTo = "2026-08-23"),',
          )
          replace_once(
              p,
              '        assertEquals("acc-main", refreshed.activityState.accountFilterId)\n        assertEquals("Τρόφιμα", refreshed.activityState.categoryFilter)',
              '        assertEquals("acc-main", refreshed.activityState.accountFilterId)\n        assertEquals("Τρόφιμα", refreshed.activityState.ledgerCategoryFilter)\n        assertEquals("2026-08-02", refreshed.activityState.ledgerDateFrom)\n        assertEquals("2026-08-22", refreshed.activityState.ledgerDateTo)\n        assertEquals("Τρόφιμα", refreshed.activityState.categoryFilter)',
          )

          p = "app/src/test/java/app/myfinhub/android/app/AppNavigationPolicyTest.kt"
          replace_once(
              p,
              '            AppRoute.ActivityDetail("event-1"),\n            AppRoute.CategoryActivity',
              '            AppRoute.ActivityDetail("event-1"),\n            AppRoute.ActivityEdit("event-1"),\n            AppRoute.CategoryActivity',
          )

          # Focused S3 device contracts.
          Path("app/src/androidTest/java/app/myfinhub/android/ActivityS3NavigationTest.kt").write_text(r'''package app.myfinhub.android

import androidx.compose.ui.test.assertDoesNotExist
import androidx.compose.ui.test.assertIsDisplayed
import androidx.compose.ui.test.onNodeWithContentDescription
import androidx.compose.ui.test.onNodeWithText
import androidx.compose.ui.test.performClick
import androidx.compose.ui.test.junit4.v2.createAndroidComposeRule
import org.junit.Rule
import org.junit.Test

class ActivityS3NavigationTest {
    @get:Rule
    val composeRule = createAndroidComposeRule<ProductTestActivity>()

    @Test
    fun activity_filterSheet_exposesExactScopeControls() {
        composeRule.onNodeWithText("Κινήσεις").performClick()
        composeRule.onNodeWithText("Φίλτρα").performClick()

        composeRule.onNodeWithText("Φίλτρα κινήσεων").assertIsDisplayed()
        composeRule.onNodeWithText("Τύπος κίνησης").assertIsDisplayed()
        composeRule.onNodeWithText("Λογαριασμός").assertIsDisplayed()
        composeRule.onNodeWithText("Κατηγορία").assertIsDisplayed()
        composeRule.onNodeWithText("Από ημερομηνία").assertIsDisplayed()
        composeRule.onNodeWithText("Έως ημερομηνία").assertIsDisplayed()
        composeRule.onNodeWithText("Εφαρμογή").assertIsDisplayed()
    }

    @Test
    fun activity_detailIsReadFirst_andEditorIsSeparateSecondaryRoute() {
        composeRule.onNodeWithText("Κινήσεις").performClick()
        composeRule.onNodeWithText("Σούπερ μάρκετ").performClick()

        composeRule.onNodeWithText("Λεπτομέρειες κίνησης").assertIsDisplayed()
        composeRule.onNodeWithText("Επεξεργασία").assertIsDisplayed()
        composeRule.onNodeWithText("Περισσότερα").assertIsDisplayed()
        composeRule.onNodeWithText("Πορτοφόλι").assertDoesNotExist()

        composeRule.onNodeWithText("Επεξεργασία").performClick()
        composeRule.onNodeWithText("Επεξεργασία κίνησης").assertIsDisplayed()
        composeRule.onNodeWithText("Αποθήκευση αλλαγών").assertIsDisplayed()
        composeRule.onNodeWithText("Πορτοφόλι").assertDoesNotExist()

        composeRule.onNodeWithContentDescription("Πίσω").performClick()
        composeRule.onNodeWithText("Λεπτομέρειες κίνησης").assertIsDisplayed()
    }

    @Test
    fun activity_deleteConfirmation_statesMyFinHubMeaning_notBankReversal() {
        composeRule.onNodeWithText("Κινήσεις").performClick()
        composeRule.onNodeWithText("Σούπερ μάρκετ").performClick()
