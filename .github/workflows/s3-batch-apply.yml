name: S3 batch apply

on:
  push:
    branches:
      - android/redesign-s3-activity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s3-activity
          fetch-depth: 0

      - name: Apply coherent S3 Activity batch
        shell: bash
        run: |
          python3 scripts/apply_s3_batch.py
          python3 scripts/render_project_tracking.py
          python3 scripts/render_project_tracking.py --check
          python3 -m unittest discover -s scripts -p 'test_project_tracking.py'
          rm scripts/apply_s3_batch.py
          rm .github/workflows/s3-batch-apply.yml
          git diff --check

      - name: Commit coherent S3 batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(activity): wire S3 ledger detail and editor batch'
          git push origin HEAD:android/redesign-s3-activity
