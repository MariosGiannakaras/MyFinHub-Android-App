name: Android UI Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'scripts/install-android-sdk.sh'
      - 'scripts/run-connected-android-tests.sh'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Screenshot renderer / visual regression
        shell: bash
        run: |
          if find app/src/screenshotTestDebug/reference -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            ./gradlew validateDebugScreenshotTest --stacktrace
          else
            echo 'No committed product screenshot references yet; smoke the official renderer only.'
            ./gradlew updateDebugScreenshotTest --stacktrace
            ./gradlew validateDebugScreenshotTest --stacktrace
          fi

      - name: Render candidate references after regression failure
        if: failure()
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-ui-screenshots-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/**/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 14

  s24-ultra-target-instrumented:
    # A stock compact-phone emulator is only a representative automated host.
    # The user's physical Samsung Galaxy S24 Ultra is the sole supported device
    # and remains the authoritative device-specific acceptance target.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision compile SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Prebuild instrumentation APKs
        shell: bash
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: S24 Ultra target phone UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: bash scripts/run-connected-android-tests.sh

  sync-approved-screenshot-references:
    # One-shot helper for this hardening branch only. The rendered candidates were personally
    # inspected before enabling this job. Remove this helper immediately after it commits them.
    needs:
      - screenshot-regression
      - s24-ultra-target-instrumented
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.head_ref == 'android/ui-ux-hardening-2026' &&
        needs.screenshot-regression.result == 'failure' &&
        needs.s24-ultra-target-instrumented.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout hardening head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download visually approved renderer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-ui-screenshots-${{ github.run_id }}
          path: rendered

      - name: Replace canonical references and curated screenshots
        shell: bash
        run: |
          set -euo pipefail
          reference_root='rendered/src/screenshotTestDebug/reference'
          test "$(( $(find "$reference_root" -type f -name '*.png' | wc -l) ))" -eq 38

          rm -rf app/src/screenshotTestDebug/reference
          mkdir -p app/src/screenshotTestDebug/reference
          cp -a "$reference_root"/. app/src/screenshotTestDebug/reference/

          home_ref="$reference_root/app/myfinhub/android/app/HomeScreenshotTestKt"
          quick_ref="$reference_root/app/myfinhub/android/app/Phase2BScreenshotTestKt"
          money_ref="$reference_root/app/myfinhub/android/feature/money/CanonicalMoneyScreenshotTestKt"
          plan_ref="$reference_root/app/myfinhub/android/feature/plan/CanonicalPlanScreenshotTestKt"
          utility_ref="$reference_root/app/myfinhub/android/feature/utilities/FrontendUtilitiesScreenshotTestKt"

          cp "$home_ref/HomeCompactLightScreenshot_home_compact_light_bfd9ed62_0.png" screenshots/home/home-compact.png
          cp "$home_ref/HomeCompactLargeFontScreenshot_home_compact_large_font_58d2dd1c_0.png" screenshots/home/home-large-font.png
          cp "$home_ref/HomeCompactDarkScreenshot_home_compact_dark_75a2e448_0.png" screenshots/home/home-dark.png

          cp "$quick_ref/Phase2BQuickEntryCompactLightScreenshot_phase2b_quick_entry_compact_light_0e13f224_0.png" screenshots/quick-entry/quick-entry-compact.png
          cp "$quick_ref/Phase2BQuickEntryCompactDarkScreenshot_phase2b_quick_entry_compact_dark_04c039f2_0.png" screenshots/quick-entry/quick-entry-dark.png
          cp "$quick_ref/Phase2BQuickEntrySplitCompactLightScreenshot_phase2b_quick_entry_split_compact_light_fcccbe67_0.png" screenshots/quick-entry/quick-entry-split.png

          rm -f \
            screenshots/money/money-lending-edit.png \
            screenshots/money/money-lending.png \
            screenshots/money/money-loan-edit-large-font.png \
            screenshots/money/money-overview-large-font.png \
            screenshots/money/money-savings.png
          cp "$money_ref/CanonicalMoneyCompactLightScreenshot_canonical_money_compact_light_2b156103_0.png" screenshots/money/money-overview.png
          cp "$money_ref/CanonicalMoneyCompactDarkScreenshot_canonical_money_compact_dark_8ace8741_0.png" screenshots/money/money-overview-dark.png
          cp "$money_ref/CanonicalLoansCompactLightScreenshot_canonical_loans_compact_light_48b79ab1_0.png" screenshots/money/money-loans.png
          cp "$money_ref/CanonicalSavingsLargeFontScreenshot_canonical_savings_large_font_38536db9_0.png" screenshots/money/money-savings-large-font.png

          rm -f \
            screenshots/plan/plan-budgets.png \
            screenshots/plan/plan-item-edit.png \
            screenshots/plan/plan-overview-large-font.png
          cp "$plan_ref/CanonicalPlanCompactLightScreenshot_canonical_plan_compact_light_4a82b70a_0.png" screenshots/plan/plan-overview.png
          cp "$plan_ref/CanonicalPlanCompactDarkScreenshot_canonical_plan_compact_dark_625a004d_0.png" screenshots/plan/plan-overview-dark.png
          cp "$plan_ref/CanonicalBudgetCompactLargeFontScreenshot_canonical_budget_compact_large_font_d11e4a07_0.png" screenshots/plan/plan-budgets-large-font.png

          cp "$utility_ref/ChangeHistoryCompactScreenshot_change_history_compact_54532b0a_0.png" screenshots/utilities/change-history.png

      - name: Commit validated references
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/screenshotTestDebug/reference screenshots
          if git diff --cached --quiet; then
            echo 'Validated references are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update validated Android UI references'
          git push origin HEAD:${{ github.head_ref }}
