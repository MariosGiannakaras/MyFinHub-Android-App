name: Android UI Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'scripts/install-android-sdk.sh'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-and-compact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Ensure wrapper exists for repository-equivalent execution
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi

      - name: Screenshot renderer / visual regression
        shell: bash
        run: |
          if find app/src/screenshotTestDebug/reference -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            ./gradlew validateDebugScreenshotTest --stacktrace
          else
            echo 'No committed screenshot references yet; smoke the official renderer in this checkout.'
            ./gradlew updateDebugScreenshotTest validateDebugScreenshotTest --stacktrace
          fi

      - name: Publish rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-ui-screenshots-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/**/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Compact managed-device UI tests
        shell: bash
        run: >-
          ./gradlew compactApi36DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace

  full-adaptive-matrix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Ensure wrapper exists
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi

      - name: Foldable and expanded managed-device tests
        shell: bash
        run: >-
          ./gradlew foldableApi36DebugAndroidTest expandedApi36DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace
