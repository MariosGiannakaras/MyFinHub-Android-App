name: Android UI Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'scripts/install-android-sdk.sh'
      - 'scripts/run-connected-android-tests.sh'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Wire guarded Slice F production projection
        if: github.event_name == 'pull_request' && github.head_ref == 'android/rc7-owner-insights-ui-correction'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF" develop --depth=1
          git checkout "$GITHUB_HEAD_REF"
          python3 - <<'PY'
          from pathlib import Path

          projection = Path('app/src/main/java/app/myfinhub/android/app/CanonicalProductProjection.kt')
          source = projection.read_text()
          old = '''    val trend = (3L downTo 0L).map { offset -> YearMonth.from(today).minusMonths(offset) }.map { trendMonth ->
              val monthly = document.monthlyFlow(trendMonth.toString())
              TrendPoint(monthLabel(trendMonth), monthly.income, monthly.expense)
          }
          val categories = document.categoryTotals(month).entries.sortedByDescending { it.value }
          val categoryTotal = categories.sumOf { it.value }
          val insights = InsightsUiState(
              monthlyTrend = trend,
              categories = categories.take(8).map { (name, amount) ->
                  InsightCategory(
                      name = name,
                      amount = amount,
                      share = if (categoryTotal <= 0.0) 0f else (amount / categoryTotal).toFloat(),
                  )
              },
              averageMonthlySpend = trend.map { it.expense }.average().takeIf { it.isFinite() } ?: 0.0,
              savingsRate = if (flow.income > 0.0) {
                  (((flow.income - flow.expense) / flow.income) * 100.0).roundToInt()
              } else {
                  0
              },
          )'''
          new = '''    val insights = projectCanonicalInsightsState(
              document = document,
              today = today,
          )'''
          if source.count(old) != 1:
              raise SystemExit(f'CanonicalProductProjection guard expected one old block, found {source.count(old)}')
          projection.write_text(source.replace(old, new, 1))

          app = Path('app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt')
          source = app.read_text()
          old = '''                entry<AppRoute.Insights> {
                      InsightsScreen(
                          state = insightsState,
                          onOpenSupportingActivity = {
                              activityBackStack.popToRoot()
                              currentDestination = TopLevelDestination.ACTIVITY
                          },
                      )
                  }'''
          new = '''                entry<AppRoute.Insights> {
                      InsightsScreen(
                          state = insightsState,
                          onOpenSupportingActivity = {
                              activityBackStack.popToRoot()
                              currentDestination = TopLevelDestination.ACTIVITY
                          },
                          onOpenCategoryActivity = { category ->
                              onActivityAction(ActivityAction.FilterChanged(app.myfinhub.android.feature.activity.ActivityFilter.EXPENSE))
                              onActivityAction(ActivityAction.QueryChanged(category))
                              onActivityAction(ActivityAction.AccountFilterChanged(null))
                              onActivityAction(ActivityAction.Select(null))
                              activityBackStack.popToRoot()
                              currentDestination = TopLevelDestination.ACTIVITY
                          },
                      )
                  }'''
          if source.count(old) != 1:
              raise SystemExit(f'MyFinHubApp guard expected one Insights route block, found {source.count(old)}')
          app.write_text(source.replace(old, new, 1))
          PY
          git show origin/develop:.github/workflows/android-ui-quality.yml > .github/workflows/android-ui-quality.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/myfinhub/android/app/CanonicalProductProjection.kt \
                  app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt \
                  .github/workflows/android-ui-quality.yml
          git diff --cached --check
          git commit -m 'Android: wire canonical Insights production flow'
          git push origin HEAD:"$GITHUB_HEAD_REF"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Screenshot renderer / visual regression
        shell: bash
        run: |
          if find app/src/screenshotTestDebug/reference -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            ./gradlew validateDebugScreenshotTest --stacktrace
          else
            echo 'No committed product screenshot references yet; smoke the official renderer only.'
            ./gradlew updateDebugScreenshotTest --stacktrace
            ./gradlew validateDebugScreenshotTest --stacktrace
          fi

      - name: Render candidate references after regression failure
        if: failure()
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-ui-screenshots-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/**/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 14

  s24-ultra-target-instrumented:
    # A stock compact-phone emulator is only a representative automated host.
    # The user's physical Samsung Galaxy S24 Ultra is the sole supported device
    # and remains the authoritative device-specific acceptance target.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision compile SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Prebuild instrumentation APKs
        shell: bash
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: S24 Ultra target phone UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: bash scripts/run-connected-android-tests.sh
