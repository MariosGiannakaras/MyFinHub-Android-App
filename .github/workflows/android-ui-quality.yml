name: Android UI Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'scripts/install-android-sdk.sh'
      - 'scripts/run-connected-android-tests.sh'
      - 'scripts/s24_physical_preflight.py'
      - 'scripts/test_s24_physical_preflight.py'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Temporary, branch-scoped one-time acceptance of the real Compose PNGs
  # already rendered and visually reviewed from draft PR #448. Never enable for
  # untrusted forks, future PRs or unchecked source changes. Remove after sync.
  sync-reviewed-screenshot-references:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 448 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[approve-rendered-goldens]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: pr448-reviewed-screenshot-sync
      cancel-in-progress: false
    steps:
      - name: Checkout exact PR head (never merge ref)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Verify canonical tracking source
        run: python3 scripts/render_project_tracking.py --check
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Render official reference PNGs from this exact reviewed source
        run: ./gradlew updateDebugScreenshotTest --no-configuration-cache --stacktrace
      - name: Mirror exact approved references, without redrawing
        run: |
          python3 scripts/verify_visual_reference_mirrors.py --sync
          python3 scripts/verify_visual_reference_mirrors.py
      - name: Fast-forward commit exact rendered PNGs to the same PR branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/screenshotTestDebug/reference screenshots
          if git diff --cached --quiet; then
            echo 'Golden reference and public mirror files are already up to date.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'test(visual): accept reviewed mobile Compose golden screenshots'
          # Non-force push; never overwrite an independently advanced branch.
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

  screenshot-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        # Immutable PR merge tree, shared by Android CI, emulator and tracking.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Fail fast on canonical tracking drift
        run: python3 scripts/render_project_tracking.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Screenshot renderer / visual regression
        shell: bash
        run: |
          if find app/src/screenshotTestDebug/reference -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            ./gradlew validateDebugScreenshotTest --no-configuration-cache --stacktrace
          else
            echo 'No committed product screenshot references yet; smoke the official renderer only.'
            ./gradlew updateDebugScreenshotTest --no-configuration-cache --stacktrace
            ./gradlew validateDebugScreenshotTest --no-configuration-cache --stacktrace
          fi

      - name: Render candidate references after regression failure
        id: render-candidates
        if: failure()
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --no-configuration-cache --stacktrace

      - name: Build screenshot gallery from official rendered PNGs
        if: always()
        shell: bash
        run: |
          python3 -m unittest discover -s scripts -p 'test_render_android_screenshot_gallery.py'
          python3 scripts/render_android_screenshot_gallery.py

      - name: Publish rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-ui-screenshots-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/**/*.png
            app/build/reports/screenshotTest/**/*.png
            app/build/reports/screenshotTest/gallery/index.html
          if-no-files-found: warn
          retention-days: 14

  s24-emulator-shard:
    # Independent full-suite shards; aggregate required check below fails unless BOTH succeed.
    name: S24 emulator shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      MYFINHUB_ANDROID_TEST_SHARD_COUNT: '2'
      MYFINHUB_ANDROID_TEST_SHARD_INDEX: ${{ matrix.shard }}
    # A stock compact-phone emulator is only a representative automated host.
    # The user's physical Samsung Galaxy S24 Ultra is the sole supported device
    # and remains the authoritative device-specific acceptance target.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate read-only D7 physical preflight contract
        run: python3 -m unittest discover -s scripts -p 'test_s24_physical_preflight.py'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fail fast on canonical tracking drift
        run: python3 scripts/render_project_tracking.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision compile SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Prebuild instrumentation APKs
        shell: bash
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: S24 Ultra target phone UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: bash scripts/run-connected-android-tests.sh

  s24-ultra-target-instrumented:
    # Stable historical required-check identity: both matrix shards MUST pass.
    needs: s24-emulator-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful S24 instrumentation across both shards
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.s24-emulator-shard.result }}
        run: |
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "S24 instrumentation shards not all successful ($SHARD_RESULT)." >&2
            exit 1
          fi
          echo 'Both S24 shards succeeded; required instrumentation gate passed.'
