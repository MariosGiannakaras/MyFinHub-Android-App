name: Android UI Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'scripts/install-android-sdk.sh'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Screenshot renderer / visual regression
        shell: bash
        run: |
          if find app/src/screenshotTestDebug/reference -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            ./gradlew validateDebugScreenshotTest --stacktrace
          else
            echo 'No committed product screenshot references yet; smoke the official renderer only.'
            ./gradlew updateDebugScreenshotTest --stacktrace
            ./gradlew validateDebugScreenshotTest --stacktrace
          fi

      - name: Render candidate references after regression failure
        id: refresh_refs
        if: failure()
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Commit validated redesign references
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'feature/full-app-2026-ui-redesign' && steps.refresh_refs.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/app/HomeScreenshotTestKt/HomeCompactLightScreenshot_home_compact_light_bfd9ed62_0.png screenshots/home/home-compact.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/app/HomeScreenshotTestKt/HomeCompactLargeFontScreenshot_home_compact_large_font_58d2dd1c_0.png screenshots/home/home-large-font.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/app/HomeScreenshotTestKt/HomeExpandedDarkScreenshot_home_expanded_dark_6aa0d8b0_0.png screenshots/home/home-expanded-dark.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/home/HomeAttentionScreenshotTestKt/HomeAttentionDetailCompactScreenshot_home_attention_detail_compact_773398f6_0.png screenshots/home/home-attention-detail.png

          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/app/Phase2BScreenshotTestKt/Phase2BActivityCompactLightScreenshot_phase2b_activity_compact_light_5f73a0b5_0.png screenshots/activity/activity-compact.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/app/Phase2BScreenshotTestKt/Phase2BActivityCompactLargeFontScreenshot_phase2b_activity_compact_large_font_028afa13_0.png screenshots/activity/activity-large-font.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/app/Phase2BScreenshotTestKt/Phase2BInsightsExpandedDarkScreenshot_phase2b_insights_expanded_dark_37dfee01_0.png screenshots/insights/insights-expanded-dark.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/app/Phase2BScreenshotTestKt/Phase2BQuickEntryCompactLightScreenshot_phase2b_quick_entry_compact_light_0e13f224_0.png screenshots/quick-entry/quick-entry-compact.png

          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/auth/AuthShellScreenshotTestKt/AuthLoginCompactLightScreenshot_auth_login_compact_light_3e5c8e84_0.png screenshots/auth/login.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/auth/AuthShellScreenshotTestKt/AuthLockedPinFallbackCompactLightScreenshot_auth_locked_pin_fallback_compact_light_35ee1851_0.png screenshots/auth/locked-pin-fallback.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/auth/AuthShellScreenshotTestKt/AuthPinEnrollmentCompactLargeFontScreenshot_auth_pin_enrollment_compact_large_font_3464a141_0.png screenshots/auth/pin-enrollment-large-font.png

          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CreditCardStackScreenshotTestKt/CreditCardStackCompactLightScreenshot_card_stack_compact_light_04e49ab8_0.png screenshots/money/credit-card-stack-compact.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CreditCardStackScreenshotTestKt/CreditCardStackCompactLargeFontScreenshot_card_stack_compact_150_percent_font_c9b36481_0.png screenshots/money/credit-card-stack-large-font.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CreditCardStackScreenshotTestKt/CreditCardStackExpandedScreenshot_card_stack_expanded_tablet_light_e95bbfbd_0.png screenshots/money/credit-card-stack-expanded.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/MoneyParityScreenshotTestKt/MoneyOverviewCompactLightScreenshot_money_overview_compact_light_98c1b72f_0.png screenshots/money/money-overview.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/MoneyParityScreenshotTestKt/MoneyOverviewCompactLargeFontScreenshot_money_overview_compact_large_font_1abb04bc_0.png screenshots/money/money-overview-large-font.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/MoneyParityScreenshotTestKt/MoneySavingsCompactLightScreenshot_money_savings_compact_light_db37ee82_0.png screenshots/money/money-savings.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/MoneyParityScreenshotTestKt/MoneyLoansCompactLightScreenshot_money_loans_compact_light_2459ad0d_0.png screenshots/money/money-loans.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/MoneyParityScreenshotTestKt/MoneyLoanEditorCompactLargeFontScreenshot_money_loan_editor_compact_large_font_66cf52cc_0.png screenshots/money/money-loan-edit-large-font.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/MoneyParityScreenshotTestKt/MoneyLendingCompactLightScreenshot_money_lending_compact_light_2880436e_0.png screenshots/money/money-lending.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/MoneyParityScreenshotTestKt/MoneyLendingEditorCompactLightScreenshot_money_lending_editor_compact_light_4c15b6ab_0.png screenshots/money/money-lending-edit.png

          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/PlanScreenshotTestKt/PlanOverviewCompactLightScreenshot_plan_overview_compact_light_fac64c24_0.png screenshots/plan/plan-overview.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/PlanScreenshotTestKt/PlanOverviewCompactLargeFontScreenshot_plan_overview_compact_large_font_7b40152f_0.png screenshots/plan/plan-overview-large-font.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/PlanScreenshotTestKt/PlanItemEditorCompactLightScreenshot_plan_item_editor_compact_light_88195e46_0.png screenshots/plan/plan-item-edit.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/PlanScreenshotTestKt/PlanBudgetsCompactLightScreenshot_plan_budgets_compact_light_d3cd1ddd_0.png screenshots/plan/plan-budgets.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/PlanScreenshotTestKt/PlanForecastCompactLightScreenshot_plan_forecast_compact_light_3a07043b_0.png screenshots/plan/plan-forecast.png

          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/FrontendUtilitiesScreenshotTestKt/SettingsCompactLargeFontScreenshot_settings_compact_large_font_f30d85f4_0.png screenshots/utilities/settings-large-font.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/FrontendUtilitiesScreenshotTestKt/DataTransferCompactScreenshot_data_transfer_compact_e642b5b0_0.png screenshots/utilities/data-transfer.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/FrontendUtilitiesScreenshotTestKt/DataTransferConfirmationCompactScreenshot_data_transfer_confirmation_compact_ab727d7c_0.png screenshots/utilities/data-transfer-confirmation.png
          cp app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/FrontendUtilitiesScreenshotTestKt/ChangeHistoryCompactScreenshot_change_history_compact_54532b0a_0.png screenshots/utilities/change-history.png

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/screenshotTestDebug/reference screenshots
          if git diff --cached --quiet; then
            echo 'No screenshot reference changes to commit.'
          else
            git commit -m 'test: refresh validated 2026 UI screenshots'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Publish rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-ui-screenshots-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/**/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 14

  compact-instrumented:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision compile SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Compact emulator UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: ./gradlew connectedDebugAndroidTest --stacktrace
