name: Android UI Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'scripts/install-android-sdk.sh'
      - 'scripts/run-connected-android-tests.sh'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}

      - name: Apply pass-2 navigation correction
        if: github.event_name == 'pull_request' && github.head_ref == 'android/post-phase6-redesign-pass2'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt')
          text = app.read_text()
          old = '                    onClick = { currentDestination = destination },\n'
          new = '''                    onClick = {\n                        if (currentDestination == destination) {\n                            activeBackStack.popToRoot()\n                        } else {\n                            currentDestination = destination\n                        }\n                    },\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Top-level navigation click anchor not found')

          old = '''                        onOpenSupportingActivity = {\n                            onActivityAction(ActivityAction.FilterChanged(ActivityFilter.EXPENSE))\n                            currentDestination = TopLevelDestination.ACTIVITY\n                        },\n'''
          new = '''                        onOpenSupportingActivity = {\n                            onActivityAction(ActivityAction.FilterChanged(ActivityFilter.EXPENSE))\n                            activityBackStack.popToRoot()\n                            currentDestination = TopLevelDestination.ACTIVITY\n                        },\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Insights to Activity anchor not found')

          old = '''private fun NavBackStack<NavKey>.pushIfNew(route: NavKey) {\n    if (lastOrNull() != route) add(route)\n}\n'''
          new = '''private fun NavBackStack<NavKey>.pushIfNew(route: NavKey) {\n    if (lastOrNull() != route) add(route)\n}\n\nprivate fun NavBackStack<NavKey>.popToRoot() {\n    while (size > 1) removeLastOrNull()\n}\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('NavBackStack helper anchor not found')
          app.write_text(text)

          test = Path('app/src/androidTest/java/app/myfinhub/android/TopLevelParityTest.kt')
          text = test.read_text()
          anchor = '''    @Test\n    fun insights_drillsIntoExpenseActivityProjection() {\n'''
          inserted = '''    @Test\n    fun reselectingTopLevelDestination_returnsNestedFlowToRoot() {\n        composeRule.onNodeWithText("Κινήσεις").performClick()\n        composeRule.onNode(hasText("Σούπερ μάρκετ") and hasClickAction())\n            .performScrollTo()\n            .performClick()\n        composeRule.onNodeWithText("Λεπτομέρειες κίνησης").assertIsDisplayed()\n\n        composeRule.onNodeWithText("Κινήσεις").performClick()\n        composeRule.onNodeWithText("Αναζήτηση κινήσεων", useUnmergedTree = true).assertIsDisplayed()\n    }\n\n    @Test\n    fun insights_drillsIntoExpenseActivityProjection() {\n        composeRule.onNodeWithText("Κινήσεις").performClick()\n        composeRule.onNode(hasText("Σούπερ μάρκετ") and hasClickAction())\n            .performScrollTo()\n            .performClick()\n        composeRule.onNodeWithText("Λεπτομέρειες κίνησης").assertIsDisplayed()\n\n'''
          if anchor in text:
              text = text.replace(anchor, inserted, 1)
          elif 'fun reselectingTopLevelDestination_returnsNestedFlowToRoot()' not in text:
              raise SystemExit('TopLevelParityTest anchor not found')
          test.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt app/src/androidTest/java/app/myfinhub/android/TopLevelParityTest.kt
          if ! git diff --cached --quiet; then
            git commit -m 'fix: make top-level navigation deterministic'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Screenshot renderer / visual regression
        shell: bash
        run: |
          if find app/src/screenshotTestDebug/reference -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            ./gradlew validateDebugScreenshotTest --stacktrace
          else
            echo 'No committed product screenshot references yet; smoke the official renderer only.'
            ./gradlew updateDebugScreenshotTest --stacktrace
            ./gradlew validateDebugScreenshotTest --stacktrace
          fi

      - name: Render candidate references after regression failure
        if: failure()
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-ui-screenshots-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/**/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 14

  s24-ultra-target-instrumented:
    # A stock compact-phone emulator is only a representative automated host.
    # The user's physical Samsung Galaxy S24 Ultra is the sole supported device
    # and remains the authoritative device-specific acceptance target.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision compile SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Prebuild instrumentation APKs
        shell: bash
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: S24 Ultra target phone UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: bash scripts/run-connected-android-tests.sh