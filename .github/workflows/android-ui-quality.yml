name: Android UI Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'scripts/install-android-sdk.sh'
      - 'scripts/run-connected-android-tests.sh'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ui-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        # Immutable PR merge tree, shared by Android CI, emulator and tracking.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Fail fast on canonical tracking drift
        run: python3 scripts/render_project_tracking.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Screenshot renderer / visual regression
        shell: bash
        run: |
          if find app/src/screenshotTestDebug/reference -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            ./gradlew validateDebugScreenshotTest --stacktrace
          else
            echo 'No committed product screenshot references yet; smoke the official renderer only.'
            ./gradlew updateDebugScreenshotTest --stacktrace
            ./gradlew validateDebugScreenshotTest --stacktrace
          fi

      - name: Render candidate references after regression failure
        id: render-candidates
        if: failure()
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish rendered UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-ui-screenshots-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/**/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 14

  s24-ultra-target-instrumented:
    # A stock compact-phone emulator is only a representative automated host.
    # The user's physical Samsung Galaxy S24 Ultra is the sole supported device
    # and remains the authoritative device-specific acceptance target.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fail fast on canonical tracking drift
        run: python3 scripts/render_project_tracking.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision compile SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Prebuild instrumentation APKs
        shell: bash
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: S24 Ultra target phone UI tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: bash scripts/run-connected-android-tests.sh

# TEMPORARY one-shot transfer of FOUR personally reviewed, digest-pinned
  # generated Compose references from the failed UI Quality run. Remove
  # this job before merging PR #376; never relax screenshot validation.
  insights-approved-goldens-sync:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 376 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'android/w44-insights-ratio-privacy-batch-20261027'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact PR branch for reviewed reference update
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Restore only reviewed screenshot references
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 40485610465 -n android-ui-screenshots-40485610465 -D "$RUNNER_TEMP/approved-candidates"
          SOURCE="$RUNNER_TEMP/approved-candidates/src/screenshotTestDebug/reference/app/myfinhub/android/feature/insights/InsightsScreenshotTestKt"
          TARGET="app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/insights/InsightsScreenshotTestKt"
          test -d "$SOURCE"
          mkdir -p "$TARGET"
          echo '7b12aab6b87081543bd922ce9ebe4d6f4887e03b1d10223210303b70a7d64b72  $SOURCE/InsightsCompactDarkScreenshot_insights_compact_dark_79a1f2a1_0.png' | sha256sum --check --status
          cp "$SOURCE/InsightsCompactDarkScreenshot_insights_compact_dark_79a1f2a1_0.png" "$TARGET/InsightsCompactDarkScreenshot_insights_compact_dark_79a1f2a1_0.png"
          echo '7ee11b61186622391b7724df2d62d3437071468cc5bdc6529b0ea7204d16133b  $SOURCE/InsightsCompactLightScreenshot_insights_compact_light_0d06167b_0.png' | sha256sum --check --status
          cp "$SOURCE/InsightsCompactLightScreenshot_insights_compact_light_0d06167b_0.png" "$TARGET/InsightsCompactLightScreenshot_insights_compact_light_0d06167b_0.png"
          echo '73480dd42f7fb2b8612a6fa8f82a0c6dcf4b0b7e30211bdfe8d5cc086b055263  $SOURCE/InsightsCompactLargeFontScreenshot_insights_compact_large_font_92696cce_0.png' | sha256sum --check --status
          cp "$SOURCE/InsightsCompactLargeFontScreenshot_insights_compact_large_font_92696cce_0.png" "$TARGET/InsightsCompactLargeFontScreenshot_insights_compact_large_font_92696cce_0.png"
          echo 'c635783cf263a415e280763323189031941da7a096e4fb2e0816823ad181abb3  $SOURCE/InsightsFullLargeFontScreenshot_insights_full_large_font_b9013df4_0.png' | sha256sum --check --status
          cp "$SOURCE/InsightsFullLargeFontScreenshot_insights_full_large_font_b9013df4_0.png" "$TARGET/InsightsFullLargeFontScreenshot_insights_full_large_font_b9013df4_0.png"
          git add -- "$TARGET"
          if git diff --cached --quiet; then
            echo "Reviewed golden references already integrated."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(screenshots): refresh four reviewed Insights privacy references'
          git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
