name: Fix pass 3 Activity large font filters

on:
  push:
    branches:
      - android/post-phase6-redesign-pass3
    paths:
      - .github/workflows/pass3-fix-activity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/post-phase6-redesign-pass3
          fetch-depth: 0
      - name: Replace horizontally clipped filters with wrapping layout
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/app/myfinhub/android/feature/activity/ActivityScreen.kt')
          text = p.read_text(encoding='utf-8')
          for old, new in [
              ('import androidx.compose.foundation.horizontalScroll\n', ''),
              ('import androidx.compose.foundation.layout.Column\n', 'import androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.FlowRow\n'),
              ('import androidx.compose.foundation.rememberScrollState\n', ''),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one import occurrence for {old!r}')
              text = text.replace(old, new, 1)

          pattern = re.compile(
              r'(?P<indent>\s*)Row\(\n'
              r'\s*modifier = Modifier\.fillMaxWidth\(\)\.horizontalScroll\(rememberScrollState\(\)\),\n'
              r'\s*horizontalArrangement = Arrangement\.spacedBy\(MyFinHubSpacing\.xs\),\n'
              r'\s*\) \{\n'
              r'\s*ActivityFilter\.entries\.forEach \{ filter ->\n'
              r'\s*MyFinHubFilterChip\(\n'
              r'\s*selected = state\.filter == filter,\n'
              r'\s*onClick = \{ onAction\(ActivityAction\.FilterChanged\(filter\)\) \},\n'
              r'\s*label = filter\.label,\n'
              r'\s*icon = filter\.icon\(\),\n'
              r'\s*tone = filter\.tone\(\),\n'
              r'\s*\)\n'
              r'\s*\}\n'
              r'\s*\}',
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('Could not find Activity filter row')
          i = match.group('indent')
          replacement = f'''{i}FlowRow(\n{i}    modifier = Modifier.fillMaxWidth(),\n{i}    horizontalArrangement = Arrangement.spacedBy(MyFinHubSpacing.xs),\n{i}    verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.xxs),\n{i}) {{\n{i}    ActivityFilter.entries.forEach {{ filter ->\n{i}        MyFinHubFilterChip(\n{i}            selected = state.filter == filter,\n{i}            onClick = {{ onAction(ActivityAction.FilterChanged(filter)) }},\n{i}            label = filter.label,\n{i}            icon = filter.icon(),\n{i}            tone = filter.tone(),\n{i}        )\n{i}    }}\n{i}}}'''
          text = text[:match.start()] + replacement + text[match.end():]
          p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/pass3-fix-activity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/myfinhub/android/feature/activity/ActivityScreen.kt .github/workflows/pass3-fix-activity.yml
          git commit -m 'Wrap Activity filters at large font'
          git push origin HEAD:android/post-phase6-redesign-pass3
