name: Bootstrap Screenshot Baseline

on:
  push:
    branches:
      - feature/android-bootstrap
    paths:
      - 'app/src/screenshotTest/**'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'scripts/install-android-sdk.sh'
      - '.github/workflows/bootstrap-screenshot-baseline.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-screenshot-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/android-bootstrap
          fetch-depth: 0

      - name: Detect existing references
        id: refs
        shell: bash
        run: |
          if find app/src/screenshotTestDebug/reference -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.refs.outputs.present == 'false'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        if: steps.refs.outputs.present == 'false'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        if: steps.refs.outputs.present == 'false'
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Generate screenshot references
        if: steps.refs.outputs.present == 'false'
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Verify generated references
        if: steps.refs.outputs.present == 'false'
        shell: bash
        run: ./gradlew validateDebugScreenshotTest --stacktrace

      - name: Commit generated references
        if: steps.refs.outputs.present == 'false'
        shell: bash
        run: |
          if ! find app/src/screenshotTestDebug/reference -type f -name '*.png' -print -quit | grep -q .; then
            echo 'Screenshot renderer produced no PNG references.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/screenshotTestDebug/reference
          git commit -m 'test: commit initial Compose screenshot baseline'
          git push origin HEAD:feature/android-bootstrap

      - name: Baseline already committed
        if: steps.refs.outputs.present == 'true'
        run: echo 'Screenshot reference PNGs already exist; no bootstrap action required.'
