name: One-shot pending budget label correction

on:
  push:
    branches:
      - android/pending-undo-updater-delivery
    paths:
      - .github/workflows/_pending-budget-label-correction.yml

permissions:
  contents: write

jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/pending-undo-updater-delivery

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Generate wrapper when required
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi

      - name: Apply deterministic stale-label correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          projection = Path('app/src/main/java/app/myfinhub/android/app/PendingUiProjection.kt')
          text = projection.read_text()
          old = '''    if (pending.isEmpty()) return projection

    val pendingTransactionIds = pending
'''
          new = '''    val retainedPlanMessage = projection.planState.message
        ?.takeUnless { it.startsWith("Αλλαγή budget ·") }
    if (pending.isEmpty()) {
        return if (retainedPlanMessage == projection.planState.message) {
            projection
        } else {
            projection.copy(planState = projection.planState.copy(message = retainedPlanMessage))
        }
    }

    val pendingTransactionIds = pending
'''
          if text.count(old) != 1:
              raise SystemExit('Unexpected PendingUiProjection early-return shape')
          text = text.replace(old, new, 1)
          old = '''        planState = projection.planState.copy(
            message = budgetMessage ?: projection.planState.message,
        ),
'''
          new = '''        planState = projection.planState.copy(
            message = budgetMessage ?: retainedPlanMessage,
        ),
'''
          if text.count(old) != 1:
              raise SystemExit('Unexpected PendingUiProjection plan message shape')
          projection.write_text(text.replace(old, new, 1))

          tests = Path('app/src/test/java/app/myfinhub/android/app/PendingUiProjectionTest.kt')
          text = tests.read_text()
          old = 'import org.junit.Assert.assertNotNull\n'
          new = old + 'import org.junit.Assert.assertNull\n'
          if text.count(old) != 1:
              raise SystemExit('Unexpected test import shape')
          text = text.replace(old, new, 1)
          marker = '''    private fun projectWithPending(
        server: CanonicalFinanceDocument,
        pending: List<PendingCanonicalMutationIntent>,
    ): CanonicalProductProjection {
'''
          addition = '''    @Test
    fun confirmedBudget_clearsStalePendingInlineState() {
        val server = canonicalFixture()
        val base = projectCanonicalProduct(server, today)
        val stale = base.copy(
            planState = base.planState.copy(message = "Αλλαγή budget · Προς συγχρονισμό"),
        )

        val refreshed = projectCanonicalProduct(server, today, previous = stale)
        val result = projectPendingUi(
            projection = refreshed,
            serverDocument = server,
            pending = emptyList(),
            today = today,
        )

        assertNull(result.planState.message)
    }

    @Test
    fun emptyQueue_preservesNonPendingPlanMessage() {
        val server = canonicalFixture()
        val base = projectCanonicalProduct(server, today)
        val projection = base.copy(planState = base.planState.copy(message = "Έλεγξε το μηνιαίο όριο."))

        val result = projectPendingUi(
            projection = projection,
            serverDocument = server,
            pending = emptyList(),
            today = today,
        )

        assertEquals("Έλεγξε το μηνιαίο όριο.", result.planState.message)
    }

'''
          if text.count(marker) != 1:
              raise SystemExit('Unexpected test insertion point')
          tests.write_text(text.replace(marker, addition + marker, 1))
          PY

      - name: Compile and run pending projection tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'app.myfinhub.android.app.PendingUiProjectionTest' \
            --stacktrace

      - name: Commit validated correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_pending-budget-label-correction.yml
          git add \
            app/src/main/java/app/myfinhub/android/app/PendingUiProjection.kt \
            app/src/test/java/app/myfinhub/android/app/PendingUiProjectionTest.kt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clear confirmed pending budget label"
          git push origin HEAD:android/pending-undo-updater-delivery
