name: One-shot pending budget label correction

on:
  push:
    branches:
      - android/pending-undo-updater-delivery
    paths:
      - .github/workflows/_pending-budget-label-correction.yml

permissions:
  contents: write

jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/pending-undo-updater-delivery

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Generate wrapper when required
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi

      - name: Apply deterministic stale-label correction
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object app/src/main/java/app/myfinhub/android/app/PendingUiProjection.kt)" == "e8dd7a8e3aef5acc05630401bcd2a1f0e2518c26" ]]
          [[ "$(git hash-object app/src/test/java/app/myfinhub/android/app/PendingUiProjectionTest.kt)" == "011da7bb9fbf441e9c7cb46d0a823abec9964cff" ]]
          python3 <<'PY'
          from pathlib import Path
          projection = Path("app/src/main/java/app/myfinhub/android/app/PendingUiProjection.kt")
          text = projection.read_text()
          old = "    if (pending.isEmpty()) return projection\n\n    val pendingTransactionIds = pending\n"
          new = "    val retainedPlanMessage = projection.planState.message\n        ?.takeUnless { it.startsWith(\"Αλλαγή budget ·\") }\n    if (pending.isEmpty()) {\n        return if (retainedPlanMessage == projection.planState.message) {\n            projection\n        } else {\n            projection.copy(planState = projection.planState.copy(message = retainedPlanMessage))\n        }\n    }\n\n    val pendingTransactionIds = pending\n"
          if text.count(old) != 1:
              raise SystemExit("Unexpected PendingUiProjection early-return shape")
          text = text.replace(old, new, 1)
          old = "            message = budgetMessage ?: projection.planState.message,\n"
          new = "            message = budgetMessage ?: retainedPlanMessage,\n"
          if text.count(old) != 1:
              raise SystemExit("Unexpected PendingUiProjection plan-message shape")
          projection.write_text(text.replace(old, new, 1))

          tests = Path("app/src/test/java/app/myfinhub/android/app/PendingUiProjectionTest.kt")
          text = tests.read_text()
          old = "import org.junit.Assert.assertNotNull\n"
          if text.count(old) != 1:
              raise SystemExit("Unexpected test import shape")
          text = text.replace(old, old + "import org.junit.Assert.assertNull\n", 1)
          marker = "    private fun projectWithPending(\n        server: CanonicalFinanceDocument,\n        pending: List<PendingCanonicalMutationIntent>,\n    ): CanonicalProductProjection {\n"
          addition = "    @Test\n    fun confirmedBudget_clearsStalePendingInlineState() {\n        val server = canonicalFixture()\n        val base = projectCanonicalProduct(server, today)\n        val stale = base.copy(\n            planState = base.planState.copy(message = \"Αλλαγή budget · Προς συγχρονισμό\"),\n        )\n\n        val refreshed = projectCanonicalProduct(server, today, previous = stale)\n        val result = projectPendingUi(\n            projection = refreshed,\n            serverDocument = server,\n            pending = emptyList(),\n            today = today,\n        )\n\n        assertNull(result.planState.message)\n    }\n\n    @Test\n    fun emptyQueue_preservesNonPendingPlanMessage() {\n        val server = canonicalFixture()\n        val base = projectCanonicalProduct(server, today)\n        val projection = base.copy(planState = base.planState.copy(message = \"Έλεγξε το μηνιαίο όριο.\"))\n\n        val result = projectPendingUi(\n            projection = projection,\n            serverDocument = server,\n            pending = emptyList(),\n            today = today,\n        )\n\n        assertEquals(\"Έλεγξε το μηνιαίο όριο.\", result.planState.message)\n    }\n\n"
          if text.count(marker) != 1:
              raise SystemExit("Unexpected test insertion point")
          tests.write_text(text.replace(marker, addition + marker, 1))
          PY

      - name: Compile and run pending projection tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'app.myfinhub.android.app.PendingUiProjectionTest' \
            --stacktrace

      - name: Commit validated correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_pending-budget-label-correction.yml
          git add \
            app/src/main/java/app/myfinhub/android/app/PendingUiProjection.kt \
            app/src/test/java/app/myfinhub/android/app/PendingUiProjectionTest.kt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clear confirmed pending budget label"
          git push origin HEAD:android/pending-undo-updater-delivery
