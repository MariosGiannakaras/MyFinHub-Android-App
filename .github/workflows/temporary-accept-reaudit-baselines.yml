name: Temporary Accept Reaudit Baselines

on:
  push:
    branches:
      - android/full-product-reaudit-redesign
    paths:
      - .github/workflows/temporary-accept-reaudit-baselines.yml

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/full-product-reaudit-redesign
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Accept personally inspected Compose references
        run: ./gradlew updateDebugScreenshotTest --stacktrace
      - name: Render canonical project tracking
        run: python3 scripts/render_project_tracking.py
      - name: Commit references, generated tracking and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-accept-reaudit-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Accept inspected re-audit screenshots and sync tracking"
          git push origin HEAD:android/full-product-reaudit-redesign
