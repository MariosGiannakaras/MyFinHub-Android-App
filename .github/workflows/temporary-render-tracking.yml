name: Temporary Render Tracking

on:
  push:
    branches:
      - android/full-product-reaudit-redesign
    paths:
      - .github/workflows/temporary-render-tracking.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/full-product-reaudit-redesign
          fetch-depth: 0
      - name: Render generated tracking
        run: python3 scripts/render_project_tracking.py
      - name: Commit generated tracking and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-render-tracking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md TODO.md docs/CURRENT_HANDOFF.md .github/workflows/temporary-render-tracking.yml
          git commit -m "Synchronize re-audit project tracking"
          git push origin HEAD:android/full-product-reaudit-redesign
