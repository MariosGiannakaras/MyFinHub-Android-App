name: S9 Coherent Candidate

on:
  push:
    branches:
      - automation/s9-settings-auth-20260915
    paths:
      - '.github/workflows/s9-coherent-candidate.yml'

permissions:
  contents: write

jobs:
  apply-validate-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact S9 product base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s9-settings-auth
          fetch-depth: 1

      - name: Assert exact S8 merge base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "51a749e56b91c7ff2354fd69204b38a4e0b8b544"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Apply coherent S9 batch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/s9-settings-auth-20260915
          git show origin/automation/s9-settings-auth-20260915:scripts/apply_s9_settings_auth.py > /tmp/apply_s9_settings_auth.py
          python3 /tmp/apply_s9_settings_auth.py
          python3 scripts/render_project_tracking.py --check
          python3 -m unittest discover -s scripts -p test_project_tracking.py
          git diff --check

      - name: Targeted S9 validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug compileDebugKotlin --stacktrace
          git diff --check

      - name: Render fresh S9 candidates
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish S9 candidate renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s9-candidate-renders-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/utilities/S9UtilitiesScreenshotTestKt/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Commit coherent S9 candidate source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main \
            app/src/test \
            app/src/androidTest \
            app/src/screenshotTest \
            tracking/android-project-state.json \
            STATUS.md TODO.md docs/CURRENT_HANDOFF.md
          git diff --cached --check
          git commit -m 'feat(android): implement S9 settings diagnostics and auth candidate'
          git push origin HEAD:android/redesign-s9-settings-auth
