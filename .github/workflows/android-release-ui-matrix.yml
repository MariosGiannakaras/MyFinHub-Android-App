name: Android Release UI Matrix

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'scripts/install-android-sdk.sh'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-release-ui-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  large-font-full-suite:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Prebuild instrumentation APKs
        shell: bash
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Full product suite at 150 percent font scale
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: |
            adb wait-for-device
            ready=false
            for attempt in {1..60}; do
              if adb shell service check package 2>/dev/null | grep -q 'found' && adb shell service check activity 2>/dev/null | grep -q 'found'; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
            adb shell settings put system font_scale 1.5
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Publish large-font instrumentation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-release-ui-large-font-${{ github.run_id }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14

  adaptive-full-suite:
    runs-on: macos-15-intel
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: foldable
            profile: pixel_fold
            avd_name: myfinhub-release-foldable
          - label: tablet
            profile: pixel_tablet
            avd_name: myfinhub-release-tablet
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Prebuild instrumentation APKs
        shell: bash
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Full product adaptive suite (${{ matrix.label }})
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          avd-name: ${{ matrix.avd_name }}
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: |
            adb wait-for-device
            ready=false
            for attempt in {1..60}; do
              if adb shell service check package 2>/dev/null | grep -q 'found' && adb shell service check activity 2>/dev/null | grep -q 'found'; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Publish adaptive instrumentation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-release-ui-${{ matrix.label }}-${{ github.run_id }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
