name: Temporary diagnostics UI patch v2

on:
  push:
    branches:
      - feature/resilience-data-integrity-diagnostics
    paths:
      - .github/workflows/temp-diagnostics-ui-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/resilience-data-integrity-diagnostics
          fetch-depth: 0
      - name: Apply safe diagnostics UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          Path('app/src/main/java/app/myfinhub/android/feature/utilities/AppDiagnostics.kt').write_text('''package app.myfinhub.android.feature.utilities\n\n/** Safe support metadata only. Never place credentials, tokens, finance payloads or card secrets here. */\ndata class AppDiagnosticsSnapshot(\n    val versionName: String,\n    val buildType: String,\n    val environment: String,\n    val apiHost: String,\n    val networkStatus: String,\n    val apiStatus: String,\n    val sessionStatus: String,\n    val lastSuccessfulSync: String?,\n    val lastDiagnosticCode: String?,\n)\n''')

          path = 'app/src/main/java/app/myfinhub/android/feature/utilities/FrontendUtilitiesScreens.kt'
          replace_exact(
              path,
              '''fun SettingsScreen(\n    state: FrontendUtilitiesUiState,\n    onAction: (FrontendUtilitiesAction) -> Unit,\n    onBack: () -> Unit,\n) {''',
              '''fun SettingsScreen(\n    state: FrontendUtilitiesUiState,\n    onAction: (FrontendUtilitiesAction) -> Unit,\n    onBack: () -> Unit,\n    diagnostics: AppDiagnosticsSnapshot? = null,\n) {''',
          )
          marker = '''            SettingsCard(\n                title = "Υπενθυμίσεις",\n                rows = listOf(\n                    SettingSpec(\n                        "Προγραμματισμένες υποχρεώσεις",\n                        "Εμφάνιση υπενθυμίσεων για επερχόμενες υποχρεώσεις.",\n                        state.settings.remindersEnabled,\n                        FrontendUtilitiesAction.ToggleReminders,\n                    ),\n                ),\n                onAction = onAction,\n            )\n'''
          replace_exact(path, marker, marker + '            diagnostics?.let { DiagnosticsCard(it) }\n')
          diagnostics_card = '''\n@Composable\nprivate fun DiagnosticsCard(diagnostics: AppDiagnosticsSnapshot) {\n    MyFinHubSectionCard(modifier = Modifier.fillMaxWidth()) {\n        Column(verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.xs)) {\n            Text("Διαγνωστικά", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.SemiBold)\n            Text(\n                "Ασφαλείς τεχνικές πληροφορίες για σύνδεση και συγχρονισμό. Δεν περιλαμβάνονται οικονομικά δεδομένα ή μυστικά.",\n                style = MaterialTheme.typography.bodySmall,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n            )\n            DiagnosticRow("Έκδοση", "${diagnostics.versionName} · ${diagnostics.buildType}")\n            DiagnosticRow("Περιβάλλον", diagnostics.environment)\n            DiagnosticRow("API", diagnostics.apiHost)\n            DiagnosticRow("Δίκτυο", diagnostics.networkStatus)\n            DiagnosticRow("Κατάσταση API", diagnostics.apiStatus)\n            DiagnosticRow("Συνεδρία", diagnostics.sessionStatus)\n            DiagnosticRow("Τελευταίος συγχρονισμός", diagnostics.lastSuccessfulSync ?: "Δεν υπάρχει ακόμη")\n            DiagnosticRow("Τελευταίος κωδικός", diagnostics.lastDiagnosticCode ?: "Κανένας")\n        }\n    }\n}\n\n@Composable\nprivate fun DiagnosticRow(label: String, value: String) {\n    Column(verticalArrangement = Arrangement.spacedBy(2.dp)) {\n        Text(label, style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.onSurfaceVariant)\n        Text(value, style = MaterialTheme.typography.bodyMedium)\n    }\n    HorizontalDivider(color = MaterialTheme.colorScheme.outlineVariant)\n}\n\n'''
          replace_exact(path, '@Composable\nfun ChangeHistoryScreen(', diagnostics_card + '@Composable\nfun ChangeHistoryScreen(')

          path = 'app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt'
          replace_exact(path, 'import app.myfinhub.android.feature.utilities.ChangeHistoryScreen\n', 'import app.myfinhub.android.feature.utilities.AppDiagnosticsSnapshot\nimport app.myfinhub.android.feature.utilities.ChangeHistoryScreen\n')
          replace_exact(path, '    insightsState: InsightsUiState = InsightsUiState(),\n) {\n', '    insightsState: InsightsUiState = InsightsUiState(),\n    diagnostics: AppDiagnosticsSnapshot? = null,\n) {\n')
          replace_exact(
              path,
              '''                    SettingsScreen(\n                        state = frontendUtilitiesState,\n                        onAction = onFrontendUtilitiesAction,\n                        onBack = { homeBackStack.removeLastOrNull() },\n                    )\n''',
              '''                    SettingsScreen(\n                        state = frontendUtilitiesState,\n                        onAction = onFrontendUtilitiesAction,\n                        onBack = { homeBackStack.removeLastOrNull() },\n                        diagnostics = diagnostics,\n                    )\n''',
          )
          text = Path(path).read_text()
          replacements = 0
          for stack in ['homeBackStack', 'activityBackStack', 'moneyBackStack', 'planBackStack']:
              before = text.count(f'{stack}.add(AppRoute.')
              text = text.replace(f'{stack}.add(AppRoute.', f'{stack}.pushIfNew(AppRoute.')
              replacements += before
          if replacements < 4:
              raise SystemExit(f'expected nested navigation pushes, replaced only {replacements}')
          text = text.rstrip() + '''\n\nprivate fun NavBackStack<NavKey>.pushIfNew(route: NavKey) {\n    if (lastOrNull() != route) add(route)\n}\n'''
          Path(path).write_text(text)

          path = 'app/src/main/java/app/myfinhub/android/app/MyFinHubRoot.kt'
          replace_exact(path, 'import app.myfinhub.android.core.ui.UserNotice\n', 'import app.myfinhub.android.BuildConfig\nimport app.myfinhub.android.core.config.AppConfiguration\nimport app.myfinhub.android.core.network.NetworkStatus\nimport app.myfinhub.android.core.ui.UserNotice\n')
          replace_exact(path, 'import app.myfinhub.android.feature.money.CardSecretUiState\n', 'import app.myfinhub.android.feature.money.CardSecretUiState\nimport app.myfinhub.android.feature.utilities.AppDiagnosticsSnapshot\n')
          replace_exact(path, 'import kotlinx.coroutines.flow.merge\n', 'import java.net.URI\nimport kotlinx.coroutines.flow.merge\n')
          replace_exact(
              path,
              '''    val cardSecretState by cardSecretViewModel.state.collectAsStateWithLifecycle()\n    val snackbarHostState = remember { SnackbarHostState() }\n    var detailNotice by remember { mutableStateOf<UserNotice?>(null) }\n''',
              '''    val cardSecretState by cardSecretViewModel.state.collectAsStateWithLifecycle()\n    val networkStatus by financeViewModel.networkStatus.collectAsStateWithLifecycle()\n    val lastSuccessfulSync by financeViewModel.lastSuccessfulSync.collectAsStateWithLifecycle()\n    val snackbarHostState = remember { SnackbarHostState() }\n    var detailNotice by remember { mutableStateOf<UserNotice?>(null) }\n    var lastDiagnosticCode by remember { mutableStateOf<String?>(null) }\n''',
          )
          replace_exact(path, '        ).collect { notice ->\n            val result = snackbarHostState.showSnackbar(\n', '        ).collect { notice ->\n            lastDiagnosticCode = notice.diagnosticCode\n            val result = snackbarHostState.showSnackbar(\n')
          theme = '    MyFinHubTheme {\n        Box(modifier = Modifier.fillMaxSize()) {\n'
          diagnostics_build = '''    val configuration = remember { AppConfiguration.fromBuildConfig() }\n    val diagnostics = AppDiagnosticsSnapshot(\n        versionName = BuildConfig.VERSION_NAME,\n        buildType = BuildConfig.BUILD_TYPE,\n        environment = environmentLabel(configuration.myFinHubApiBaseUrl),\n        apiHost = runCatching { URI(configuration.myFinHubApiBaseUrl).host }.getOrNull().orEmpty().ifBlank { "Μη ρυθμισμένο" },\n        networkStatus = networkStatusLabel(networkStatus),\n        apiStatus = financeDiagnosticStatus(financeState),\n        sessionStatus = authDiagnosticStatus(authState),\n        lastSuccessfulSync = lastSuccessfulSync,\n        lastDiagnosticCode = lastDiagnosticCode,\n    )\n\n''' + theme
          replace_exact(path, theme, diagnostics_build)
          replace_exact(path, '                        onDeleteCard = financeViewModel::deleteCard,\n                    )\n', '                        onDeleteCard = financeViewModel::deleteCard,\n                        diagnostics = diagnostics,\n                    )\n')
          replace_exact(path, '    onDeleteCard: (String) -> Unit,\n) {\n', '    onDeleteCard: (String) -> Unit,\n    diagnostics: AppDiagnosticsSnapshot,\n) {\n')
          replace_exact(path, '                    insightsState = projection.insightsState,\n                )\n', '                    insightsState = projection.insightsState,\n                    diagnostics = diagnostics,\n                )\n')
          replace_exact(
              path,
              '''                            if (issue.kind == FinanceSyncIssueKind.REVISION_CONFLICT) {\n                                "Υπάρχει νεότερη έκδοση"\n                            } else {\n                                "Η αποθήκευση δεν ολοκληρώθηκε"\n                            },\n''',
              '''                            when (issue.kind) {\n                                FinanceSyncIssueKind.REVISION_CONFLICT -> "Υπάρχει νεότερη έκδοση"\n                                FinanceSyncIssueKind.WAITING_FOR_NETWORK -> "Αναμονή σύνδεσης"\n                                FinanceSyncIssueKind.SAVE_FAILED -> "Η αποθήκευση δεν ολοκληρώθηκε"\n                            },\n''',
          )
          marker = '@Composable\nprivate fun FinanceLoadingScreen() {'
          helpers = '''private fun environmentLabel(apiBaseUrl: String): String = when {\n    apiBaseUrl.isBlank() -> "Μη ρυθμισμένο"\n    apiBaseUrl.contains("localhost", ignoreCase = true) || apiBaseUrl.contains("127.0.0.1") -> "Τοπικό public client"\n    else -> "Production public client"\n}\n\nprivate fun networkStatusLabel(status: NetworkStatus): String = when (status) {\n    NetworkStatus.ONLINE -> "Συνδεδεμένο"\n    NetworkStatus.OFFLINE -> "Χωρίς σύνδεση"\n    NetworkStatus.UNKNOWN -> "Μη επιβεβαιωμένη σύνδεση"\n}\n\nprivate fun financeDiagnosticStatus(state: FinanceProductState): String = when (state) {\n    FinanceProductState.Idle -> "Δεν έχει ξεκινήσει"\n    FinanceProductState.Loading -> "Συγχρονισμός"\n    FinanceProductState.AuthRejected -> "Απαιτεί νέα σύνδεση"\n    is FinanceProductState.Failure -> "Μη διαθέσιμο"\n    is FinanceProductState.Ready -> when {\n        state.saving -> "Αποθήκευση"\n        state.issue != null -> "Απαιτεί ανάκτηση"\n        else -> "Συγχρονισμένο"\n    }\n}\n\nprivate fun authDiagnosticStatus(state: AuthShellUiState): String = when (state) {\n    AuthShellUiState.Loading -> "Έλεγχος"\n    is AuthShellUiState.Unconfigured -> "Μη ρυθμισμένο"\n    is AuthShellUiState.Login -> "Απαιτεί σύνδεση"\n    is AuthShellUiState.Mfa -> "Απαιτεί AAL2"\n    is AuthShellUiState.PinEnrollment -> "Ρύθμιση τοπικού PIN"\n    is AuthShellUiState.Locked -> "Τοπικά κλειδωμένη"\n    is AuthShellUiState.Ready -> "Ενεργή · ${state.session.assuranceLevel.name}"\n}\n\n''' + marker
          replace_exact(path, marker, helpers)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-diagnostics-ui-v2.yml
          git add app/src/main/java/app/myfinhub/android/feature/utilities/AppDiagnostics.kt \
                  app/src/main/java/app/myfinhub/android/feature/utilities/FrontendUtilitiesScreens.kt \
                  app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt \
                  app/src/main/java/app/myfinhub/android/app/MyFinHubRoot.kt
          git diff --cached --check
          git commit -m "feat: add safe in-app diagnostics and edge navigation guards"
          git push origin HEAD:feature/resilience-data-integrity-diagnostics
