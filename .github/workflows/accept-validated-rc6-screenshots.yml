name: Accept validated RC6 screenshots

on:
  push:
    branches:
      - android/owner-rc6-feedback-corrections
    paths:
      - '.github/workflows/accept-validated-rc6-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accept-validated-rc6-screenshots
  cancel-in-progress: false

jobs:
  accept-validated-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Render the validated application references
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Replace touched curated screenshots
        shell: bash
        run: |
          set -euo pipefail
          root='app/src/screenshotTestDebug/reference/app/myfinhub/android'
          cp "$root/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityPendingLightScreenshot_production_activity_pending_light_ee7d53cf_0.png" screenshots/activity/activity-compact.png
          cp "$root/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityPendingLargeFontScreenshot_production_activity_pending_large_font_83e0a837_0.png" screenshots/activity/activity-large-font.png
          cp "$root/feature/home/ProductionHomeScreenshotTestKt/ProductionHomeCompactLightScreenshot_production_home_compact_light_73154b5c_0.png" screenshots/home/home-compact.png
          cp "$root/feature/home/ProductionHomeScreenshotTestKt/ProductionHomeCompactDarkScreenshot_production_home_compact_dark_564e04bd_0.png" screenshots/home/home-dark.png
          cp "$root/feature/home/ProductionHomeScreenshotTestKt/ProductionHomeCompactLargeFontScreenshot_production_home_compact_large_font_99387350_0.png" screenshots/home/home-large-font.png
          cp "$root/feature/money/CreditCardStackScreenshotTestKt/CreditCardStackCompactLightScreenshot_card_stack_compact_light_04e49ab8_0.png" screenshots/money/credit-card-stack-compact.png
          cp "$root/feature/money/CreditCardStackScreenshotTestKt/CreditCardStackCompactLargeFontScreenshot_card_stack_compact_150_percent_font_c9b36481_0.png" screenshots/money/credit-card-stack-large-font.png
          cp "$root/feature/money/MoneyParityScreenshotTestKt/MoneyOverviewCompactLightScreenshot_money_overview_compact_light_98c1b72f_0.png" screenshots/money/money-overview.png

      - name: Commit accepted references and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/accept-validated-rc6-screenshots.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/screenshotTestDebug/reference screenshots/activity screenshots/home screenshots/money .github/workflows/accept-validated-rc6-screenshots.yml
          git commit -m 'Accept visually validated RC6 screenshots'
          git push origin "HEAD:${GITHUB_REF_NAME}"
