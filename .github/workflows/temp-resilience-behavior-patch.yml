name: Temporary resilience behavior patch

on:
  push:
    branches:
      - feature/resilience-data-integrity-diagnostics
    paths:
      - .github/workflows/temp-resilience-behavior-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/resilience-data-integrity-diagnostics
          fetch-depth: 0
      - name: Apply guarded resilience changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Central safe offline notice.
          path = 'app/src/main/java/app/myfinhub/android/core/ui/UserNotice.kt'
          replace_exact(
              path,
              'fun unexpectedUserNotice(\n',
              '''fun offlineUserNotice(\n    operation: String,\n    pendingMutation: Boolean = false,\n): UserNotice = UserNotice(\n    message = if (pendingMutation) {\n        "Δεν υπάρχει σύνδεση. Η αλλαγή διατηρείται μέχρι να επανέλθει το δίκτυο."\n    } else {\n        "Δεν υπάρχει διαθέσιμη σύνδεση δικτύου."\n    },\n    details = buildString {\n        append("Ενέργεια: ")\n        append(operation)\n        append("\\nΚατηγορία: OFFLINE")\n        append("\\nΑίτημα προς server: ")\n        append(if (pendingMutation) "δεν στάλθηκε" else "δεν ξεκίνησε")\n        append("\\nΔεν αποθηκεύονται credentials, payloads ή άλλα ευαίσθητα δεδομένα στα διαγνωστικά.")\n    },\n    diagnosticCode = if (pendingMutation) "MFH-NET-OFFLINE-PENDING" else "MFH-NET-OFFLINE",\n)\n\nfun unexpectedUserNotice(\n''',
          )

          # Finance product: connectivity state, cancellation, rapid-submit guard and safe offline pending intent.
          path = 'app/src/main/java/app/myfinhub/android/app/FinanceProductViewModel.kt'
          replace_exact(path, 'import app.myfinhub.android.core.network.ApiFailureKind\n', 'import app.myfinhub.android.core.network.AndroidConnectivityObserver\nimport app.myfinhub.android.core.network.ApiFailureKind\n')
          replace_exact(path, 'import app.myfinhub.android.core.network.OkHttpMyFinHubApi\n', 'import app.myfinhub.android.core.network.NetworkClientFactory\nimport app.myfinhub.android.core.network.NetworkStatus\nimport app.myfinhub.android.core.network.OkHttpMyFinHubApi\n')
          replace_exact(path, 'import app.myfinhub.android.core.ui.apiFailureMessage\n', 'import app.myfinhub.android.core.ui.apiFailureMessage\nimport app.myfinhub.android.core.ui.offlineUserNotice\n')
          replace_exact(path, 'import kotlinx.coroutines.flow.MutableSharedFlow\n', 'import kotlinx.coroutines.Job\nimport kotlinx.coroutines.flow.MutableSharedFlow\n')
          replace_exact(path, 'import kotlinx.coroutines.flow.SharedFlow\n', 'import kotlinx.coroutines.flow.SharedFlow\nimport kotlinx.coroutines.flow.SharingStarted\n')
          replace_exact(path, 'import kotlinx.coroutines.flow.asStateFlow\n', 'import kotlinx.coroutines.flow.asStateFlow\nimport kotlinx.coroutines.flow.collect\nimport kotlinx.coroutines.flow.drop\nimport kotlinx.coroutines.flow.stateIn\n')
          replace_exact(path, 'import okhttp3.OkHttpClient\n', '')
          replace_exact(path, 'enum class FinanceSyncIssueKind { REVISION_CONFLICT, SAVE_FAILED }', 'enum class FinanceSyncIssueKind { REVISION_CONFLICT, SAVE_FAILED, WAITING_FOR_NETWORK }')
          replace_exact(
              path,
              '''    private val repository = FinanceRepository(\n        OkHttpMyFinHubApi(\n            configuration = AppConfiguration.fromBuildConfig(),\n            client = OkHttpClient.Builder().build(),\n        ),\n    )\n''',
              '''    private val connectivityObserver = AndroidConnectivityObserver(application)\n    val networkStatus: StateFlow<NetworkStatus> = connectivityObserver.status.stateIn(\n        scope = viewModelScope,\n        started = SharingStarted.Eagerly,\n        initialValue = connectivityObserver.current(),\n    )\n\n    private val repository = FinanceRepository(\n        OkHttpMyFinHubApi(\n            configuration = AppConfiguration.fromBuildConfig(),\n            client = NetworkClientFactory.create(),\n        ),\n    )\n\n    private val mutableLastSuccessfulSync = MutableStateFlow<String?>(null)\n    val lastSuccessfulSync: StateFlow<String?> = mutableLastSuccessfulSync.asStateFlow()\n''',
          )
          replace_exact(
              path,
              '''    private var currentSession: AuthSession? = null\n    private var pendingMutation: CanonicalFinanceMutation? = null\n\n    fun attachSession(session: AuthSession) {\n        val previous = currentSession\n        currentSession = session\n        if (previous?.userId == session.userId && mutableState.value is FinanceProductState.Ready) return\n        loadFresh(preserveUi = false)\n    }\n\n    fun clear() {\n        currentSession = null\n        pendingMutation = null\n        repository.clear()\n        mutableState.value = FinanceProductState.Idle\n    }\n\n    fun retryLoad() {\n        if (currentSession == null) return\n        loadFresh(preserveUi = false)\n    }\n\n    fun retryPendingMutation() {\n        val session = currentSession ?: return\n        val mutation = pendingMutation ?: return\n        val previousProjection = (mutableState.value as? FinanceProductState.Ready)?.projection\n        viewModelScope.launch {\n            mutableState.value = FinanceProductState.Loading\n            repository.load(session)\n            when (val loaded = repository.state.value) {\n                is FinanceSyncState.Ready -> saveMutation(\n                    session = session,\n                    mutation = mutation,\n                    baseDocument = loaded.envelope.document,\n                    previousProjection = previousProjection,\n                )\n                is FinanceSyncState.Error -> handleLoadFailure(loaded.failure, "Επαναφόρτωση οικονομικών δεδομένων")\n                else -> failLoad("Δεν ήταν δυνατή η επαναφόρτωση των δεδομένων.")\n            }\n        }\n    }\n\n    fun discardPendingAndReload() {\n        pendingMutation = null\n        loadFresh(preserveUi = false)\n    }\n''',
              '''    private var currentSession: AuthSession? = null\n    private var pendingMutation: CanonicalFinanceMutation? = null\n    private var pendingMutationNeverSent = false\n    private var reloadWhenOnline = false\n    private var mutationLaunchInFlight = false\n    private var loadJob: Job? = null\n    private var mutationJob: Job? = null\n\n    init {\n        viewModelScope.launch {\n            networkStatus.drop(1).collect { status ->\n                if (status != NetworkStatus.ONLINE) return@collect\n                when {\n                    pendingMutationNeverSent && pendingMutation != null && currentSession != null -> retryPendingMutation()\n                    reloadWhenOnline && currentSession != null && mutableState.value is FinanceProductState.Failure -> {\n                        reloadWhenOnline = false\n                        retryLoad()\n                    }\n                }\n            }\n        }\n    }\n\n    fun attachSession(session: AuthSession) {\n        val previous = currentSession\n        if (previous != null && previous.userId != session.userId) {\n            cancelOperations()\n            pendingMutation = null\n            pendingMutationNeverSent = false\n            repository.clear()\n        }\n        currentSession = session\n        if (previous?.userId == session.userId && mutableState.value is FinanceProductState.Ready) return\n        loadFresh(preserveUi = false)\n    }\n\n    fun clear() {\n        cancelOperations()\n        currentSession = null\n        pendingMutation = null\n        pendingMutationNeverSent = false\n        reloadWhenOnline = false\n        mutableLastSuccessfulSync.value = null\n        repository.clear()\n        mutableState.value = FinanceProductState.Idle\n    }\n\n    fun retryLoad() {\n        if (currentSession == null || loadJob?.isActive == true) return\n        loadFresh(preserveUi = false)\n    }\n\n    fun retryPendingMutation() {\n        val session = currentSession ?: return\n        val mutation = pendingMutation ?: return\n        if (mutationLaunchInFlight || mutationJob?.isActive == true) return\n        if (connectivityObserver.current() == NetworkStatus.OFFLINE) {\n            mutableNotices.tryEmit(offlineUserNotice("Επαναφόρτωση οικονομικών δεδομένων"))\n            return\n        }\n        val previousProjection = (mutableState.value as? FinanceProductState.Ready)?.projection\n        mutationLaunchInFlight = true\n        mutationJob = viewModelScope.launch {\n            try {\n                mutableState.value = FinanceProductState.Loading\n                repository.load(session)\n                when (val loaded = repository.state.value) {\n                    is FinanceSyncState.Ready -> {\n                        recordSuccessfulSync(loaded.envelope.lastSavedAt)\n                        saveMutation(\n                            session = session,\n                            mutation = mutation,\n                            baseDocument = loaded.envelope.document,\n                            previousProjection = previousProjection,\n                        )\n                    }\n                    is FinanceSyncState.Error -> handleLoadFailure(loaded.failure, "Επαναφόρτωση οικονομικών δεδομένων")\n                    else -> failLoad("Δεν ήταν δυνατή η επαναφόρτωση των δεδομένων.")\n                }\n            } finally {\n                mutationLaunchInFlight = false\n            }\n        }\n    }\n\n    fun discardPendingAndReload() {\n        pendingMutation = null\n        pendingMutationNeverSent = false\n        reloadWhenOnline = false\n        loadFresh(preserveUi = false)\n    }\n''',
          )
          text = Path(path).read_text()
          guard_old = 'if (ready.saving || ready.issue != null) return'
          guard_count = text.count(guard_old)
          if guard_count < 4:
              raise SystemExit(f'FinanceProductViewModel: expected >=4 mutation guards, got {guard_count}')
          text = text.replace(guard_old, 'if (ready.saving || ready.issue != null || mutationLaunchInFlight) return')
          Path(path).write_text(text)
          replace_exact(
              path,
              '''    private fun loadFresh(preserveUi: Boolean) {\n        val session = currentSession ?: return\n        val previous = (mutableState.value as? FinanceProductState.Ready)?.projection.takeIf { preserveUi }\n        viewModelScope.launch {\n            mutableState.value = FinanceProductState.Loading\n            repository.load(session)\n            when (val loaded = repository.state.value) {\n                is FinanceSyncState.Ready -> {\n                    pendingMutation = null\n                    val projected = runCatching {\n                        projectCanonicalProduct(loaded.envelope.document, LocalDate.now(), previous)\n                    }.getOrElse {\n                        mutableNotices.emit(\n                            unexpectedUserNotice(\n                                operation = "Ανάγνωση οικονομικών δεδομένων",\n                                throwable = it,\n                                message = "Τα δεδομένα φορτώθηκαν αλλά δεν μπόρεσαν να εμφανιστούν σωστά.",\n                            ),\n                        )\n                        mutableState.value = FinanceProductState.Failure(\n                            "Τα οικονομικά δεδομένα έχουν μη αναμενόμενη μορφή.",\n                            retryable = true,\n                        )\n                        return@launch\n                    }\n                    mutableState.value = FinanceProductState.Ready(projected)\n                }\n                is FinanceSyncState.Error -> handleLoadFailure(loaded.failure, "Φόρτωση οικονομικών δεδομένων")\n                else -> failLoad("Δεν ήταν δυνατή η φόρτωση των οικονομικών δεδομένων.")\n            }\n        }\n    }\n\n    private fun applyMutation(mutation: CanonicalFinanceMutation) {\n        val session = currentSession ?: return\n        val ready = mutableState.value as? FinanceProductState.Ready ?: return\n        if (ready.saving || ready.issue != null || mutationLaunchInFlight) return\n        viewModelScope.launch {\n            saveMutation(\n                session = session,\n                mutation = mutation,\n                baseDocument = ready.projection.document,\n                previousProjection = ready.projection,\n            )\n        }\n    }\n''',
              '''    private fun loadFresh(preserveUi: Boolean) {\n        val session = currentSession ?: return\n        loadJob?.cancel()\n        val previous = (mutableState.value as? FinanceProductState.Ready)?.projection.takeIf { preserveUi }\n        if (connectivityObserver.current() == NetworkStatus.OFFLINE) {\n            reloadWhenOnline = true\n            mutableState.value = FinanceProductState.Failure(\n                message = "Δεν υπάρχει σύνδεση. Θα γίνει νέα προσπάθεια όταν επανέλθει το δίκτυο.",\n                retryable = true,\n            )\n            mutableNotices.tryEmit(offlineUserNotice("Φόρτωση οικονομικών δεδομένων"))\n            return\n        }\n        reloadWhenOnline = false\n        loadJob = viewModelScope.launch {\n            mutableState.value = FinanceProductState.Loading\n            repository.load(session)\n            when (val loaded = repository.state.value) {\n                is FinanceSyncState.Ready -> {\n                    pendingMutation = null\n                    pendingMutationNeverSent = false\n                    recordSuccessfulSync(loaded.envelope.lastSavedAt)\n                    val projected = runCatching {\n                        projectCanonicalProduct(loaded.envelope.document, LocalDate.now(), previous)\n                    }.getOrElse {\n                        mutableNotices.emit(\n                            unexpectedUserNotice(\n                                operation = "Ανάγνωση οικονομικών δεδομένων",\n                                throwable = it,\n                                message = "Τα δεδομένα φορτώθηκαν αλλά δεν μπόρεσαν να εμφανιστούν σωστά.",\n                            ),\n                        )\n                        mutableState.value = FinanceProductState.Failure(\n                            "Τα οικονομικά δεδομένα έχουν μη αναμενόμενη μορφή.",\n                            retryable = true,\n                        )\n                        return@launch\n                    }\n                    mutableState.value = FinanceProductState.Ready(projected)\n                }\n                is FinanceSyncState.Error -> handleLoadFailure(loaded.failure, "Φόρτωση οικονομικών δεδομένων")\n                else -> failLoad("Δεν ήταν δυνατή η φόρτωση των οικονομικών δεδομένων.")\n            }\n        }\n    }\n\n    private fun applyMutation(mutation: CanonicalFinanceMutation) {\n        val session = currentSession ?: return\n        val ready = mutableState.value as? FinanceProductState.Ready ?: return\n        if (ready.saving || ready.issue != null || mutationLaunchInFlight) return\n        mutationLaunchInFlight = true\n        mutationJob = viewModelScope.launch {\n            try {\n                saveMutation(\n                    session = session,\n                    mutation = mutation,\n                    baseDocument = ready.projection.document,\n                    previousProjection = ready.projection,\n                )\n            } finally {\n                mutationLaunchInFlight = false\n            }\n        }\n    }\n''',
          )
          replace_exact(
              path,
              '''        mutableState.value = FinanceProductState.Ready(localProjection, saving = true)\n\n        repository.save(session, localDocument)\n''',
              '''        if (connectivityObserver.current() == NetworkStatus.OFFLINE) {\n            pendingMutationNeverSent = true\n            mutableState.value = FinanceProductState.Ready(\n                projection = localProjection,\n                issue = FinanceSyncIssue(\n                    FinanceSyncIssueKind.WAITING_FOR_NETWORK,\n                    "Η αλλαγή δεν στάλθηκε. Θα επαναληφθεί με ασφάλεια όταν επανέλθει το δίκτυο.",\n                ),\n            )\n            mutableNotices.emit(offlineUserNotice("Αποθήκευση οικονομικών δεδομένων", pendingMutation = true))\n            return\n        }\n        pendingMutationNeverSent = false\n        mutableState.value = FinanceProductState.Ready(localProjection, saving = true)\n\n        repository.save(session, localDocument)\n''',
          )
          replace_exact(
              path,
              '''                pendingMutation = null\n                mutableState.value = FinanceProductState.Ready(projection)\n''',
              '''                pendingMutation = null\n                pendingMutationNeverSent = false\n                recordSuccessfulSync(saved.envelope.lastSavedAt)\n                mutableState.value = FinanceProductState.Ready(projection)\n''',
          )
          replace_exact(path, '            is FinanceSyncState.Conflict -> {\n', '            is FinanceSyncState.Conflict -> {\n                pendingMutationNeverSent = false\n')
          replace_exact(path, '            is FinanceSyncState.Error -> {\n                if (saved.failure.kind.isAuthRejection()) {', '            is FinanceSyncState.Error -> {\n                pendingMutationNeverSent = false\n                if (saved.failure.kind.isAuthRejection()) {')
          replace_exact(
              path,
              '''    private suspend fun handleLoadFailure(failure: ApiResult.Failure, operation: String) {\n        mutableNotices.emit(failure.toUserNotice(operation))\n''',
              '''    private suspend fun handleLoadFailure(failure: ApiResult.Failure, operation: String) {\n        if (failure.kind == ApiFailureKind.NETWORK) reloadWhenOnline = true\n        mutableNotices.emit(failure.toUserNotice(operation))\n''',
          )
          replace_exact(
              path,
              '''    private fun updateReady(transform: (FinanceProductState.Ready) -> FinanceProductState.Ready) {\n''',
              '''    private fun cancelOperations() {\n        loadJob?.cancel()\n        mutationJob?.cancel()\n        loadJob = null\n        mutationJob = null\n        mutationLaunchInFlight = false\n    }\n\n    private fun recordSuccessfulSync(serverTimestamp: String) {\n        mutableLastSuccessfulSync.value = serverTimestamp.takeIf(String::isNotBlank) ?: Instant.now().toString()\n        reloadWhenOnline = false\n    }\n\n    private fun updateReady(transform: (FinanceProductState.Ready) -> FinanceProductState.Ready) {\n''',
          )

          # Auth shell: shared HTTP policy, offline preflight and synchronous double-submit gating.
          path = 'app/src/main/java/app/myfinhub/android/feature/auth/AuthShellViewModel.kt'
          replace_exact(path, 'import app.myfinhub.android.core.config.AppConfiguration\n', 'import app.myfinhub.android.core.config.AppConfiguration\nimport app.myfinhub.android.core.network.AndroidConnectivityObserver\nimport app.myfinhub.android.core.network.NetworkClientFactory\nimport app.myfinhub.android.core.network.NetworkStatus\n')
          replace_exact(path, 'import app.myfinhub.android.core.ui.authFailureMessage\n', 'import app.myfinhub.android.core.ui.authFailureMessage\nimport app.myfinhub.android.core.ui.offlineUserNotice\n')
          replace_exact(path, 'import okhttp3.OkHttpClient\n', '')
          replace_exact(path, '    private val httpClient = OkHttpClient.Builder().build()\n', '    private val connectivityObserver = AndroidConnectivityObserver(application)\n    private val httpClient = NetworkClientFactory.create()\n')
          text = Path(path).read_text()
          start = text.index('    fun signIn(email: String, password: CharArray) {')
          end = text.index('    fun requestPinFallback() {', start)
          replacement = '''    fun signIn(email: String, password: CharArray) {\n        val current = mutableState.value as? AuthShellUiState.Login ?: run {\n            password.fill('\\u0000')\n            return\n        }\n        val passwordCopy = password.copyOf()\n        password.fill('\\u0000')\n        if (connectivityObserver.current() == NetworkStatus.OFFLINE) {\n            passwordCopy.fill('\\u0000')\n            mutableState.value = current.copy(message = "Δεν υπάρχει σύνδεση για νέα σύνδεση λογαριασμού.")\n            mutableNotices.tryEmit(offlineUserNotice("Σύνδεση"))\n            return\n        }\n        mutableState.value = AuthShellUiState.Loading\n        viewModelScope.launch {\n            try {\n                when (val result = coordinator.signIn(email.trim(), passwordCopy)) {\n                    is AuthAppState.Ready -> routeReady(result.session)\n                    is AuthAppState.MfaRequired -> mutableState.value = AuthShellUiState.Mfa(result.session, result.factor)\n                    AuthAppState.LoginRequired -> mutableState.value = AuthShellUiState.Login()\n                    is AuthAppState.Unconfigured -> mutableState.value = AuthShellUiState.Unconfigured(\n                        "Η έκδοση της εφαρμογής δεν έχει έγκυρη public client configuration.",\n                    )\n                    is AuthAppState.Failure -> {\n                        reportAuthFailure(result.failure, "Σύνδεση")\n                        mutableState.value = AuthShellUiState.Login(authFailureMessage(result.failure.kind))\n                    }\n                    is AuthAppState.Locked -> mutableState.value = lockedState(result.session)\n                }\n            } catch (cancelled: CancellationException) {\n                throw cancelled\n            } catch (error: Exception) {\n                mutableState.value = AuthShellUiState.Login("Η σύνδεση δεν ολοκληρώθηκε.")\n                mutableNotices.emit(unexpectedUserNotice("Σύνδεση", error, "Η σύνδεση δεν ολοκληρώθηκε."))\n            } finally {\n                passwordCopy.fill('\\u0000')\n            }\n        }\n    }\n\n    fun submitTotp(code: CharArray) {\n        val current = mutableState.value as? AuthShellUiState.Mfa ?: run {\n            code.fill('\\u0000')\n            return\n        }\n        val codeCopy = code.copyOf()\n        code.fill('\\u0000')\n        if (connectivityObserver.current() == NetworkStatus.OFFLINE) {\n            codeCopy.fill('\\u0000')\n            mutableState.value = current.copy(message = "Δεν υπάρχει σύνδεση για επαλήθευση δύο παραγόντων.")\n            mutableNotices.tryEmit(offlineUserNotice("Επαλήθευση δύο παραγόντων"))\n            return\n        }\n        mutableState.value = AuthShellUiState.Loading\n        viewModelScope.launch {\n            try {\n                when (\n                    val result = coordinator.completeTotp(\n                        session = current.session,\n                        factorId = current.factor.id,\n                        code = codeCopy,\n                    )\n                ) {\n                    is AuthAppState.Ready -> routeReady(result.session)\n                    is AuthAppState.Failure -> {\n                        reportAuthFailure(result.failure, "Επαλήθευση δύο παραγόντων")\n                        mutableState.value = current.copy(message = authFailureMessage(result.failure.kind))\n                    }\n                    AuthAppState.LoginRequired -> mutableState.value = AuthShellUiState.Login()\n                    is AuthAppState.MfaRequired -> mutableState.value = AuthShellUiState.Mfa(result.session, result.factor)\n                    is AuthAppState.Unconfigured -> mutableState.value = AuthShellUiState.Unconfigured(\n                        "Η έκδοση της εφαρμογής δεν έχει έγκυρη public client configuration.",\n                    )\n                    is AuthAppState.Locked -> mutableState.value = lockedState(result.session)\n                }\n            } catch (cancelled: CancellationException) {\n                throw cancelled\n            } catch (error: Exception) {\n                mutableState.value = current.copy(message = "Η επαλήθευση δεν ολοκληρώθηκε.")\n                mutableNotices.emit(\n                    unexpectedUserNotice(\n                        operation = "Επαλήθευση δύο παραγόντων",\n                        throwable = error,\n                        message = "Η επαλήθευση δεν ολοκληρώθηκε.",\n                    ),\n                )\n            } finally {\n                codeCopy.fill('\\u0000')\n            }\n        }\n    }\n\n'''
          Path(path).write_text(text[:start] + replacement + text[end:])
          text = Path(path).read_text()
          start = text.index('    private fun validateUnlockedSession(session: AuthSession, fallbackToPin: Boolean) {')
          end = text.index('    private suspend fun routeReady(session: AuthSession) {', start)
          old = text[start:end]
          new = '''    private fun validateUnlockedSession(session: AuthSession, fallbackToPin: Boolean) {\n        viewModelScope.launch {\n            if (connectivityObserver.current() == NetworkStatus.OFFLINE) {\n                mutableState.value = lockedState(\n                    session = session,\n                    showPin = fallbackToPin,\n                    message = "Δεν υπάρχει σύνδεση. Η αποθηκευμένη συνεδρία παραμένει κλειδωμένη και μπορείς να δοκιμάσεις ξανά.",\n                )\n                mutableNotices.emit(offlineUserNotice("Έλεγχος συνεδρίας μετά το ξεκλείδωμα"))\n                return@launch\n            }\n            mutableState.value = AuthShellUiState.Loading\n            try {\n                when (val result = coordinator.afterLocalUnlock(session)) {\n                    is AuthAppState.Ready -> routeReady(result.session)\n                    AuthAppState.LoginRequired -> mutableState.value = AuthShellUiState.Login(\n                        "Η προηγούμενη συνεδρία έληξε. Συνδέσου ξανά.",\n                    )\n                    is AuthAppState.Failure -> {\n                        reportAuthFailure(result.failure, "Έλεγχος συνεδρίας μετά το ξεκλείδωμα")\n                        mutableState.value = lockedState(\n                            session = result.recoverableSession ?: session,\n                            showPin = fallbackToPin,\n                            message = authFailureMessage(result.failure.kind),\n                        )\n                    }\n                    is AuthAppState.MfaRequired -> mutableState.value = AuthShellUiState.Mfa(result.session, result.factor)\n                    is AuthAppState.Unconfigured -> mutableState.value = AuthShellUiState.Unconfigured(\n                        "Η έκδοση της εφαρμογής δεν έχει έγκυρη public client configuration.",\n                    )\n                    is AuthAppState.Locked -> mutableState.value = lockedState(result.session)\n                }\n            } catch (cancelled: CancellationException) {\n                throw cancelled\n            } catch (error: Exception) {\n                mutableState.value = lockedState(\n                    session = session,\n                    showPin = fallbackToPin,\n                    message = "Το ασφαλές ξεκλείδωμα δεν ολοκληρώθηκε. Μπορείς να δοκιμάσεις ξανά.",\n                )\n                mutableNotices.emit(\n                    unexpectedUserNotice(\n                        operation = "Έλεγχος συνεδρίας μετά το ξεκλείδωμα",\n                        throwable = error,\n                        message = "Το ασφαλές ξεκλείδωμα δεν ολοκληρώθηκε.",\n                    ),\n                )\n            }\n        }\n    }\n\n'''
          if 'AuthShellUiState.Loading' not in old:
              raise SystemExit('AuthShellViewModel: validation block did not match expected structure')
          Path(path).write_text(text[:start] + new + text[end:])

          # Card secret network policy and rapid-operation guards.
          path = 'app/src/main/java/app/myfinhub/android/feature/money/CardSecretViewModel.kt'
          replace_exact(path, 'import app.myfinhub.android.core.network.MyFinHubApi\n', 'import app.myfinhub.android.core.network.MyFinHubApi\nimport app.myfinhub.android.core.network.NetworkClientFactory\n')
          replace_exact(path, 'import okhttp3.OkHttpClient\n', '')
          replace_exact(path, '            client = OkHttpClient.Builder().build(),\n', '            client = NetworkClientFactory.create(),\n')
          replace_exact(path, '    fun reveal() {\n        val session = currentSession', '    fun reveal() {\n        if (mutableState.value is CardSecretUiState.Loading) return\n        val session = currentSession')
          replace_exact(
