name: UI UX batch B one-shot

on:
  push:
    branches: [android/ui-ux-canonical-correction-pass]
    paths: [.github/workflows/_uiux_batch_b_once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/ui-ux-canonical-correction-pass
          fetch-depth: 0
      - name: Apply guarded full Quick Entry corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/app/myfinhub/android/feature/quickentry/QuickEntryScreen.kt')
          text = path.read_text()

          old_date = '@Composable\nprivate fun DateEntryField('
          new_date = '@Composable\ninternal fun DateEntryField('
          assert text.count(old_date) == 1, 'DateEntryField visibility guard failed'
          text = text.replace(old_date, new_date)

          scaffold = '\n    Scaffold(\n        containerColor = MaterialTheme.colorScheme.background,'
          assert text.count(scaffold) == 1, 'Quick Entry Scaffold guard failed'
          return_after_enqueue = '''

              // The encrypted local enqueue is the successful form-submit boundary. Sync and safe
              // Undo are surfaced centrally, so the editor should not become a pending dead end.
              LaunchedEffect(savedLocally) {
                  if (savedLocally) onBack()
              }'''
          text = text.replace(scaffold, return_after_enqueue + scaffold, 1)
          path.write_text(text)

          Path('.github/workflows/_uiux_batch_b_once.yml').unlink()

      - name: Verify Quick Entry and compile
        run: ./gradlew test compileDebugKotlin --stacktrace
      - name: Remove accidental scratch branch
        run: |
          test -n "$(git ls-remote --heads origin refs/heads/__noop_invalid2)"
          git push origin --delete __noop_invalid2
      - name: Commit retained Quick Entry correction
        run: |
          test ! -e .github/workflows/_uiux_batch_b_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete canonical Quick Entry flow"
          git push origin HEAD:android/ui-ux-canonical-correction-pass
