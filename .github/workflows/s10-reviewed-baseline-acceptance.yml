name: One-shot S10 reviewed render acceptance

on:
  push:
    branches:
      - android/redesign-s10-integration-acceptance

permissions:
  contents: write

jobs:
  accept-reviewed-render:
    if: contains(github.event.head_commit.message, '[s10-reviewed-acceptance]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Regenerate reviewed reference
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Verify exact reviewed byte and screenshot scope
        shell: bash
        run: |
          screen='app/src/screenshotTestDebug/reference/app/myfinhub/android/app/UserNoticeScreenshotTestKt/UserNoticeSnackbarScreenshot_user_notice_snackbar_phone_eb89e693_0.png'
          expected='07ad20df0a7f4796b97985359efda622a7cc27a0f8cc45d75d34453638fc8719'
          actual="$(sha256sum "$screen" | awk '{print $1}')"
          test "$actual" = "$expected"

          mapfile -t changed < <(git diff --name-only -- app/src/screenshotTestDebug/reference)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$screen"

          ./gradlew validateDebugScreenshotTest --stacktrace
          python3 scripts/render_project_tracking.py --check
          git diff --check

      - name: Commit only reviewed reference and remove helper
        shell: bash
        run: |
          screen='app/src/screenshotTestDebug/reference/app/myfinhub/android/app/UserNoticeScreenshotTestKt/UserNoticeSnackbarScreenshot_user_notice_snackbar_phone_eb89e693_0.png'
          helper='.github/workflows/s10-reviewed-baseline-acceptance.yml'
          rm "$helper"
          git add "$screen" "$helper"

          mapfile -t staged < <(git diff --cached --name-only)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 2
          printf '%s\n' "${staged[@]}" | grep -Fx "$screen"
          printf '%s\n' "${staged[@]}" | grep -Fx "$helper"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(android): accept reviewed S10 snackbar render"
          git push origin HEAD:android/redesign-s10-integration-acceptance
