name: Temporary rc6 card functionality patch

on:
  push:
    branches:
      - android/owner-rc6-feedback-corrections

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/owner-rc6-feedback-corrections
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python3 scripts/temporary_rc6_card_functionality_patch.py
      - name: Remove temporary helper
        run: rm -f scripts/temporary_rc6_card_functionality_patch.py .github/workflows/temporary-rc6-card-functionality.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete canonical card functionality correction"
          git push origin HEAD:android/owner-rc6-feedback-corrections
