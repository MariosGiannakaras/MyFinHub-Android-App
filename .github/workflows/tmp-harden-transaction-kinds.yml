name: Temporary harden transaction kinds

on:
  push:
    branches:
      - feature/full-transaction-entry-parity
    paths:
      - .github/workflows/tmp-harden-transaction-kinds.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-transaction-entry-parity
          fetch-depth: 0
      - name: Harden withdrawal and saving destinations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/app/myfinhub/android/core/data/CanonicalTransactionEntryMutation.kt')
          text = path.read_text()
          transfer_marker = '            require(normalizedFromId != normalizedToId) { "Οι λογαριασμοί πρέπει να είναι διαφορετικοί." }\n            legs += transactionLedgerLeg(normalizedFromId!!, -amount)'
          transfer_replacement = '            require(normalizedFromId != normalizedToId) { "Οι λογαριασμοί πρέπει να είναι διαφορετικοί." }\n            if (draft.kind == "withdrawal") {\n                require(eligibleAccounts[normalizedToId]?.kind == "cash") { "Η ανάληψη πρέπει να καταλήγει σε λογαριασμό μετρητών." }\n            }\n            legs += transactionLedgerLeg(normalizedFromId!!, -amount)'
          if text.count(transfer_marker) != 1:
              raise SystemExit(f'transfer marker count={text.count(transfer_marker)}')
          text = text.replace(transfer_marker, transfer_replacement, 1)

          saving_marker = '            require(normalizedFromId != normalizedToId) { "Οι λογαριασμοί αποταμίευσης πρέπει να είναι διαφορετικοί." }\n            legs += transactionLedgerLeg(normalizedFromId!!, -amount)'
          saving_replacement = '            require(normalizedFromId != normalizedToId) { "Οι λογαριασμοί αποταμίευσης πρέπει να είναι διαφορετικοί." }\n            require(eligibleAccounts[normalizedToId]?.kind == "savings") { "Η αποταμίευση πρέπει να καταλήγει σε λογαριασμό αποταμίευσης." }\n            legs += transactionLedgerLeg(normalizedFromId!!, -amount)'
          if text.count(saving_marker) != 1:
              raise SystemExit(f'saving marker count={text.count(saving_marker)}')
          path.write_text(text.replace(saving_marker, saving_replacement, 1))
          PY
      - name: Commit patch and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-harden-transaction-kinds.yml
          git add app/src/main/java/app/myfinhub/android/core/data/CanonicalTransactionEntryMutation.kt
          git commit -m "fix: enforce withdrawal and saving account semantics"
          git push origin feature/full-transaction-entry-parity
