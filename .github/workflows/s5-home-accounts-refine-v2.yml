name: S5 Consolidated Hosted Validation

on:
  push:
    branches:
      - automation/s2-checkpoint-sync
    paths:
      - '.github/workflows/s5-home-accounts-refine-v2.yml'

permissions:
  contents: read

jobs:
  verify-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact S5 head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: c149915d9eac87af68e80f1d30a602d658e828d0

      - name: Confirm exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "c149915d9eac87af68e80f1d30a602d658e828d0"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Validate project tracking
        shell: bash
        run: |
          python3 scripts/render_project_tracking.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Focused and broad Android validation
        shell: bash
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Render real Compose candidates
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish S5 candidate renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s5-consolidated-candidates-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/**/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 7
