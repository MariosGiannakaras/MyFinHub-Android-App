name: S6 Targeted Hosted Validation

on:
  push:
    branches:
      - automation/s2-checkpoint-sync
    paths:
      - '.github/workflows/s5-home-accounts-refine-v2.yml'

permissions:
  contents: read

jobs:
  verify-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact S6 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9e869ea22a8fc69e818b446b1d7bf8189b4d6cb3

      - name: Confirm exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "9e869ea22a8fc69e818b446b1d7bf8189b4d6cb3"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Validate tracking
        shell: bash
        run: |
          python3 scripts/render_project_tracking.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Targeted Android validation
        shell: bash
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          :app:lintDebug
          --stacktrace

      - name: Render real Compose candidates
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Publish S6 candidate renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s6-targeted-candidates-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference/**/*.png
            app/build/reports/screenshotTest/**/*.png
          if-no-files-found: warn
          retention-days: 7
