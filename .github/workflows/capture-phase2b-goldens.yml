name: Capture Phase 2B Goldens

on:
  push:
    branches:
      - feature/mobile-core-flows-v2
    paths:
      - '.github/workflows/capture-phase2b-goldens.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/mobile-core-flows-v2

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Render approved Phase 2B references
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Commit Phase 2B references only
        shell: bash
        run: |
          git add app/src/screenshotTestDebug/reference/app/myfinhub/android/app/Phase2BScreenshotTestKt
          if git diff --cached --quiet; then
            echo 'No Phase 2B reference changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: approve Phase 2B product screenshot goldens'
          git push origin HEAD:feature/mobile-core-flows-v2
