name: Temporary rc5 Signed Artifact Delivery

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/temporary-rc5-artifact.yml

permissions:
  contents: read

env:
  SUPABASE_URL: https://ahsukppxwaiagampsuzb.supabase.co
  EXPECTED_PATH: production/10004/MyFinHub-10004.apk
  EXPECTED_SHA256: ce14b3a67e8da726ac0c580e49f720c7b66804b60bf1b2218fcb3b6fa4f78914
  EXPECTED_SIZE: '3151628'

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-production-release
    steps:
      - name: Require trusted develop ref
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/develop'
      - name: Checkout trusted delivery helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Download and verify exact published rc5 bytes
        env:
          SUPABASE_RELEASE_PUBLISH_KEY: ${{ secrets.SUPABASE_RELEASE_PUBLISH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from scripts.production_release_publisher import SupabaseReleaseClient

          client = SupabaseReleaseClient(os.environ['SUPABASE_URL'], os.environ['SUPABASE_RELEASE_PUBLISH_KEY'])
          data = client.download_object(os.environ['EXPECTED_PATH'])
          expected_size = int(os.environ['EXPECTED_SIZE'])
          expected_sha = os.environ['EXPECTED_SHA256']
          if len(data) != expected_size:
              raise SystemExit('Published rc5 size mismatch')
          if hashlib.sha256(data).hexdigest() != expected_sha:
              raise SystemExit('Published rc5 SHA-256 mismatch')
          Path('MyFinHub-1.0.0-rc5.apk').write_bytes(data)
          print('Verified exact published rc5 bytes.')
          PY
      - name: Upload signed rc5 delivery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc5-signed-delivery
          path: MyFinHub-1.0.0-rc5.apk
          if-no-files-found: error
          retention-days: 1
