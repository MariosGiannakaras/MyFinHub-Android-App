name: UIUX Batch E One Shot

on:
  push:
    branches:
      - android/ui-ux-canonical-correction-pass

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/ui-ux-canonical-correction-pass
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply guarded canonical add-card batch
        run: python scripts/_uiux_batch_e.py

      - name: Repair durable create-card replay branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/myfinhub/android/core/data/PendingCanonicalMutation.kt')
          t = p.read_text()
          branch = '''        PendingMutationKind.CREATE_CARD -> CreateCanonicalCard(
              cardId = payload.string("cardId").orEmpty(),
              bankId = payload.string("bankId").orEmpty(),
              nickname = payload.string("nickname").orEmpty(),
              kind = payload.string("cardKind").orEmpty(),
              network = payload.string("network").orEmpty(),
              formFactor = payload.string("formFactor").orEmpty(),
              last4 = payload.string("last4"),
              creditLimit = payload.number("creditLimit"),
              nowIso = payload.string("nowIso").orEmpty(),
          )
          '''
          if 'PendingMutationKind.CREATE_CARD -> CreateCanonicalCard(' not in t:
              needle = '        PendingMutationKind.UPSERT_OVERALL_BUDGET -> UpsertOverallBudget('
              if t.count(needle) != 1:
                  raise SystemExit('create-card replay repair guard failed')
              t = t.replace(needle, branch + needle, 1)
          if t.count('PendingMutationKind.CREATE_CARD -> CreateCanonicalCard(') != 1:
              raise SystemExit('create-card replay branch count invalid')
          p.write_text(t)
          PY

      - name: Verify focused card mutation and pending semantics
        run: |
          ./gradlew :app:testDebugUnitTest --tests 'app.myfinhub.android.core.data.CanonicalCardMutationsTest' --tests 'app.myfinhub.android.core.data.OfflinePendingMutationSemanticsTest' --stacktrace
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Verify complete unit suite
        run: ./gradlew test --stacktrace

      - name: Commit retained canonical add-card correction
        shell: bash
        run: |
          rm -f scripts/_uiux_batch_e.py .github/workflows/_uiux_batch_e_one_shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add offline-first canonical card creation'
          git push origin HEAD:android/ui-ux-canonical-correction-pass
