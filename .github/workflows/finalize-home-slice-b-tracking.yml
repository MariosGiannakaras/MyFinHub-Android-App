name: Finalize Home Slice B tracking

on:
  push:
    branches:
      - android/rc7-owner-home-ui-correction
    paths:
      - '.github/workflows/finalize-home-slice-b-tracking.yml'

permissions:
  contents: write

jobs:
  sync-tracking:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Home branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/rc7-owner-home-ui-correction
          fetch-depth: 0

      - name: Advance canonical checkpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('tracking/android-project-state.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          work = data['active_workstream']
          work['status'] = 'rc7_owner_ui_correction_slice_b_home_final_gates'
          work['summary'] = "Production-signed `1.0.0-rc7` / versionCode `10006` remains the installed technical baseline on the authorized Samsung Galaxy S24 Ultra, but is not owner-accepted as final. Owner correction Slice A is merged to `develop` via PR #100 with immediate connected writes, offline-only durable pending/Undo semantics and shared short motion/micro-interaction foundations. Slice B Home is implemented on the single active PR #101 (`android/rc7-owner-home-ui-correction`): the Home now starts with a compact financial snapshot and primary Quick Entry action, promotes attention before lower-priority content, uses denser provider-aware account surfaces and interpretable 7-day trends, and preserves the non-blocking motion contract. Fresh real light/dark/150%-font Home renders were personally inspected and the three validated Home screenshot references were refreshed; the duplicate Home PR #102 was closed without merge. Final exact-head Project Tracking, Android CI, screenshot regression and S24-target instrumentation are the only remaining Slice B merge gates. Overall progress remains 4/6 until all owner correction slices, a higher same-signer production candidate and explicit physical S24 acceptance are complete."
          work['next'] = [
              "Run the final exact-head Slice B gates on PR #101: Project Tracking, Android CI, screenshot regression and S24-target instrumentation; fix any real regression and merge only when all required checks are green.",
              "After Slice B is merged to `develop`, start Slice C Activity/Transactions from current `develop` without repeating discovery, preserving the immediate-online/offline-only-pending delivery contract and shared motion language.",
              "Continue Slices D-G in order, then run full Slice H validation and publish a strictly higher same-signer candidate than versionCode `10006` for explicit physical S24 owner acceptance before any stable/main promotion."
          ]
          data['current_redesign_pass']['checkpoint'] = 'slice_b_home_visual_refs_validated_final_gates_pending'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/render_project_tracking.py

      - name: Commit canonical and generated tracking
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tracking/android-project-state.json STATUS.md TODO.md docs/CURRENT_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'Tracking already matches final-gates checkpoint.'
            exit 0
          fi
          git commit -m 'tracking: queue Home Slice B final gates'
          git push origin HEAD:android/rc7-owner-home-ui-correction
