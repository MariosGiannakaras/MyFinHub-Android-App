name: Project Tracking

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: project-tracking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Verify generated tracking
        run: python3 scripts/render_project_tracking.py --check

      - name: Require canonical-state update on product/release PRs
        if: github.event_name == 'pull_request'
        run: python3 scripts/render_project_tracking.py --check --enforce-pr-tracking-change
