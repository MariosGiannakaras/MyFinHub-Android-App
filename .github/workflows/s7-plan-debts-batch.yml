          /** Overall monthly budget only; category budgets remain unsupported production drafts. */
          @Composable
          fun CanonicalBudget2026Screen(
              state: PlanUiState,
              onAction: (PlanAction) -> Unit,
              onBack: () -> Unit,
          ) {
              val limit = state.budget.monthlyLimitText.replace(',', '.').toDoubleOrNull()
              val threshold = state.budget.alertThresholdText.toIntOrNull()
              val limitError = state.message == "Το μηνιαίο όριο πρέπει να είναι μεγαλύτερο από μηδέν."
              val thresholdError = state.message == "Το όριο ειδοποίησης πρέπει να είναι από 1 έως 100%."
              Scaffold(
                  topBar = {
                      MyFinHubScreenHeader(
                          title = "Μηνιαίος προϋπολογισμός",
                          subtitle = state.budgetMonthLabel.ifBlank { "Συνολικό όριο τρέχοντος μήνα" },
                          navigation = { MyFinHubBackButton(onBack) },
                      )
                  },
              ) { padding ->
                  LazyColumn(
                      modifier = Modifier.fillMaxSize().testTag("s7_budget_root"),
                      contentPadding = PaddingValues(
                          start = MyFinHubDesignMetrics.screenHorizontalPadding,
                          top = padding.calculateTopPadding() + MyFinHubSpacing.xs,
                          end = MyFinHubDesignMetrics.screenHorizontalPadding,
                          bottom = MyFinHubDesignMetrics.navigationContentBottomClearance,
                      ),
                      verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.md),
                  ) {
                      canonicalBudgetProgress(state)?.let { progress ->
                          item("budget-progress") {
                              MyFinHubSectionCard(modifier = Modifier.fillMaxWidth()) {
                                  Column(verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.sm)) {
                                      MyFinHubSectionHeading(
                                          title = "Πρόοδος μήνα",
                                          subtitle = "${formatPlan2026Euro(progress.spent)} από ${formatPlan2026Euro(progress.limit)}",
                                          icon = MyFinHubIcons.Savings,
                                          tone = FinanceTone.Savings,
                                      )
                                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                          Text(if (progress.remaining >= 0.0) "Υπόλοιπο" else "Υπέρβαση")
                                          MyFinHubAmountText(
                                              formatPlan2026Euro(abs(progress.remaining)),
                                              if (progress.remaining >= 0.0) FinanceTone.Savings else FinanceTone.Expense,
                                          )
                                      }
                                      LinearProgressIndicator(
                                          progress = { progress.progress },
                                          modifier = Modifier.fillMaxWidth(),
                                          color = if (progress.thresholdReached) MaterialTheme.colorScheme.tertiary else MaterialTheme.colorScheme.primary,
                                      )
                                      Text("${progress.percent}% του ορίου", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                      if (progress.thresholdReached) {
                                          Text(
                                              "Έφτασες το όριο προειδοποίησης ${progress.threshold}%.",
                                              style = MaterialTheme.typography.labelLarge,
                                              color = MaterialTheme.colorScheme.tertiary,
                                              modifier = Modifier.testTag("s7_budget_threshold_warning"),
                                          )
                                      }
                                  }
                              }
                          }
                      }
                      item("budget-editor") {
                          MyFinHubSectionCard(modifier = Modifier.fillMaxWidth()) {
                              Column(verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.sm)) {
                                  MyFinHubOutlinedField(
                                      value = state.budget.monthlyLimitText,
                                      onValueChange = { onAction(PlanAction.MonthlyLimitChanged(it)) },
                                      label = "Μηνιαίο όριο",
                                      suffix = { Text("€") },
                                      errorMessage = state.message.takeIf { limitError },
                                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal, imeAction = ImeAction.Next),
                                  )
                                  MyFinHubOutlinedField(
                                      value = state.budget.alertThresholdText,
                                      onValueChange = { onAction(PlanAction.AlertThresholdChanged(it.filter(Char::isDigit).take(3))) },
                                      label = "Όριο προειδοποίησης",
                                      suffix = { Text("%") },
                                      errorMessage = state.message.takeIf { thresholdError },
                                      supportingText = if (thresholdError) null else "Από 1 έως 100% · χρησιμοποιείται για την ένδειξη προόδου στο MyFinHub",
                                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number, imeAction = ImeAction.Done),
                                  )
                                  if (limit != null && limit > 0.0 && threshold != null && threshold in 1..100) {
                                      Text(
                                          "Προειδοποίηση προόδου στο $threshold% των ${formatPlan2026Euro(limit)}.",
                                          style = MaterialTheme.typography.bodySmall,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      )
                                  }
                                  MyFinHubPrimaryAction(
                                      label = "Αποθήκευση προϋπολογισμού",
                                      onClick = { onAction(PlanAction.SaveBudget) },
                                      modifier = Modifier.fillMaxWidth(),
                                      icon = MyFinHubIcons.Savings,
                                  )
                                  state.message?.takeUnless { limitError || thresholdError }?.let { message ->
                                      Text(
                                          plan2026UserMessage(message),
                                          style = MaterialTheme.typography.bodySmall,
                                          color = MaterialTheme.colorScheme.primary,
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          private fun plan2026UserMessage(message: String): String = when {
              message.startsWith("Αλλαγή budget ·") && message.contains("Προς συγχρονισμό", ignoreCase = true) ->
                  "Η αλλαγή αποθηκεύτηκε και θα συγχρονιστεί όταν υπάρχει σύνδεση."
              message.startsWith("Αλλαγή budget ·") && message.contains("Αναμονή επιβεβαίωσης", ignoreCase = true) ->
                  "Η αλλαγή αποθηκεύτηκε και αναμένει επιβεβαίωση."
              else -> message.replace("budget", "προϋπολογισμός", ignoreCase = true)
          }

          private fun String?.toPlanDateOrNull(): LocalDate? = this
              ?.takeIf(String::isNotBlank)
              ?.let { raw -> runCatching { LocalDate.parse(raw.take(10)) }.getOrNull() }

          private fun formatPlan2026Euro(value: Double): String =
              NumberFormat.getCurrencyInstance(Locale.forLanguageTag("el-GR")).format(value)
