                                    }
                                }
                                MyFinHubAmountText(formatCanonicalEuro(item.amount), FinanceTone.Income)
                            }
                            TextButton(onClick = { onRecordRepayment(item) }) {
                                Text("Καταχώριση επιστροφής")
