                        }
                    }'''
          if text.count(old_lending_card) != 1:
              raise SystemExit('CanonicalMoneyScreens: lending item card mismatch')
          money.write_text(text.replace(old_lending_card, new_lending_card, 1))
          PY

          cat > app/src/main/java/app/myfinhub/android/feature/plan/CanonicalPlan2026Screens.kt <<'KOTLIN'
          package app.myfinhub.android.feature.plan

          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.PaddingValues
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material3.HorizontalDivider
          import androidx.compose.material3.LinearProgressIndicator
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Scaffold
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.testTag
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.ImeAction
          import androidx.compose.ui.text.input.KeyboardType
          import app.myfinhub.android.designsystem.FinanceTone
          import app.myfinhub.android.designsystem.MyFinHubActionCard
          import app.myfinhub.android.designsystem.MyFinHubAmountText
          import app.myfinhub.android.designsystem.MyFinHubBackButton
          import app.myfinhub.android.designsystem.MyFinHubDesignMetrics
          import app.myfinhub.android.designsystem.MyFinHubIconBadge
          import app.myfinhub.android.designsystem.MyFinHubIcons
          import app.myfinhub.android.designsystem.MyFinHubOutlinedField
          import app.myfinhub.android.designsystem.MyFinHubPrimaryAction
          import app.myfinhub.android.designsystem.MyFinHubScreenHeader
          import app.myfinhub.android.designsystem.MyFinHubSectionCard
          import app.myfinhub.android.designsystem.MyFinHubSectionHeading
          import app.myfinhub.android.designsystem.MyFinHubSpacing
          import app.myfinhub.android.designsystem.myFinHubCategoryIcon
          import java.text.NumberFormat
          import java.time.LocalDate
          import java.time.format.DateTimeFormatter
          import java.util.Locale
          import kotlin.math.abs

          internal fun planUrgentObligations(state: PlanUiState): List<PlannedItem> = state.items.filter {
              it.flow == PlannedFlow.OBLIGATION &&
                  (it.urgency == PlannedUrgency.OVERDUE || it.urgency == PlannedUrgency.THIS_WEEK)
          }

          internal fun planRemainingItems(state: PlanUiState): List<PlannedItem> {
              val urgentIds = planUrgentObligations(state).mapTo(mutableSetOf(), PlannedItem::id)
              return state.items.filterNot { it.id in urgentIds }
          }

          internal fun planForecastIncludedItems(state: PlanUiState): List<PlannedItem> {
              val end = state.forecastEndDateIso.toPlanDateOrNull()
              if (end == null) return state.items
              return state.items.filter { item ->
                  item.dueDateIso.toPlanDateOrNull()?.let { !it.isAfter(end) } == true
              }
          }

          internal fun planForecastScopeLabel(state: PlanUiState): String {
              val start = state.forecastStartDateIso.toPlanDateOrNull()
              val end = state.forecastEndDateIso.toPlanDateOrNull()
              if (start == null || end == null) return "Ορίζοντας ${state.forecastHorizonDays} ημερών"
              val formatter = DateTimeFormatter.ofPattern("d MMM yyyy", Locale.forLanguageTag("el-GR"))
              return "${start.format(formatter)} – ${end.format(formatter)}"
          }

          /** S7 production Plan: urgent decisions first, then details-on-demand forecast and budget. */
          @Composable
          fun CanonicalPlan2026Screen(
              state: PlanUiState,
              onOpenForecast: () -> Unit,
              onOpenBudget: () -> Unit,
          ) {
              val urgent = planUrgentObligations(state)
              val remaining = planRemainingItems(state)
              Scaffold(
                  topBar = {
                      MyFinHubScreenHeader(
                          title = "Πλάνο",
                          subtitle = "Τι χρειάζεται προσοχή και τι ακολουθεί",
                      )
                  },
              ) { padding ->
                  LazyColumn(
                      modifier = Modifier.fillMaxSize().testTag("s7_plan_root"),
                      contentPadding = PaddingValues(
                          start = MyFinHubDesignMetrics.screenHorizontalPadding,
                          top = padding.calculateTopPadding() + MyFinHubSpacing.xs,
                          end = MyFinHubDesignMetrics.screenHorizontalPadding,
                          bottom = MyFinHubDesignMetrics.productSnackbarBottomClearance,
                      ),
                      verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.md),
                  ) {
                      if (urgent.isNotEmpty()) {
                          item("urgent-heading") {
                              MyFinHubSectionHeading(
                                  title = "Πρώτα",
                                  subtitle = "Καθυστερημένες και κοντινές υποχρεώσεις",
                                  icon = MyFinHubIcons.Attention,
                                  tone = FinanceTone.Expense,
                              )
                          }
                          items(urgent, key = { "urgent-${it.id}" }) { item ->
                              PlanDecisionRow(item = item)
                          }
                      }

                      item("forecast-link") {
                          ForecastLinkCard(state = state, onClick = onOpenForecast)
                      }
                      item("budget-link") {
                          BudgetLinkCard(state = state, onClick = onOpenBudget)
                      }

                      if (remaining.isNotEmpty()) {
                          item("remaining-heading") {
                              MyFinHubSectionHeading(
                                  title = "Υπόλοιπο πλάνου",
                                  subtitle = "Κάθε καταγεγραμμένη πηγή εμφανίζεται μία φορά",
                                  icon = MyFinHubIcons.Plan,
                                  tone = FinanceTone.Neutral,
                              )
                          }
                          val groups = remaining.groupBy { item -> item.dueDateIso.ifBlank { item.dueLabel.ifBlank { "Χωρίς ημερομηνία" } } }
                          groups.forEach { (_, group) ->
                              item("date-${group.first().id}") {
                                  Text(
                                      group.first().dueLabel.ifBlank { "Χωρίς ημερομηνία" },
                                      style = MaterialTheme.typography.labelLarge,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                              items(group, key = { "remaining-${it.id}" }) { item ->
                                  PlanDecisionRow(item = item)
                              }
                          }
                      } else if (urgent.isEmpty()) {
                          item("plan-empty") {
                              MyFinHubSectionCard(modifier = Modifier.fillMaxWidth()) {
                                  Text(
                                      "Δεν υπάρχουν καταγεγραμμένες επόμενες κινήσεις.",
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ForecastLinkCard(state: PlanUiState, onClick: () -> Unit) {
              MyFinHubActionCard(
                  onClick = onClick,
                  modifier = Modifier.fillMaxWidth().testTag("s7_forecast_link"),
              ) {
                  MyFinHubSectionHeading(
                      title = "Πρόβλεψη 30 ημερών",
                      subtitle = planForecastScopeLabel(state),
                      icon = MyFinHubIcons.Plan,
                      tone = FinanceTone.Neutral,
                  )
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Text("Προβλεπόμενο διαθέσιμο", style = MaterialTheme.typography.bodyMedium)
                      MyFinHubAmountText(
                          formatPlan2026Euro(state.forecastEndBalance),
                          if (state.forecastEndBalance >= 0.0) FinanceTone.Income else FinanceTone.Expense,
                          style = MaterialTheme.typography.titleLarge,
                      )
                  }
                  Text(
                      "Άνοιγμα, έσοδα, υποχρεώσεις και επίδραση μεταφορών σε ξεχωριστή ανάλυση.",
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
              }
          }

          @Composable
          private fun BudgetLinkCard(state: PlanUiState, onClick: () -> Unit) {
              MyFinHubActionCard(
                  onClick = onClick,
                  modifier = Modifier.fillMaxWidth().testTag("s7_budget_link"),
              ) {
                  MyFinHubSectionHeading(
                      title = "Μηνιαίος προϋπολογισμός",
                      subtitle = state.budgetMonthLabel.ifBlank { "Τρέχων μήνας" },
                      icon = MyFinHubIcons.Savings,
                      tone = FinanceTone.Savings,
                  )
                  val progress = canonicalBudgetProgress(state)
                  if (progress == null) {
                      Text("Δεν έχει οριστεί συνολικό μηνιαίο όριο.", color = MaterialTheme.colorScheme.onSurfaceVariant)
                  } else {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          Text("${progress.percent}% του ορίου", style = MaterialTheme.typography.bodyMedium)
                          MyFinHubAmountText(
                              formatPlan2026Euro(abs(progress.remaining)),
                              if (progress.remaining >= 0.0) FinanceTone.Savings else FinanceTone.Expense,
                          )
                      }
                      LinearProgressIndicator(
                          progress = { progress.progress },
                          modifier = Modifier.fillMaxWidth(),
                          color = if (progress.thresholdReached) MaterialTheme.colorScheme.tertiary else MaterialTheme.colorScheme.primary,
                      )
                      Text(
                          if (progress.remaining >= 0.0) "Υπόλοιπο προϋπολογισμού" else "Υπέρβαση προϋπολογισμού",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                  }
              }
          }

          @Composable
          private fun PlanDecisionRow(item: PlannedItem) {
              val tone = when (item.flow) {
                  PlannedFlow.OBLIGATION -> FinanceTone.Expense
                  PlannedFlow.INCOME -> FinanceTone.Income
                  PlannedFlow.TRANSFER -> FinanceTone.Neutral
              }
              val fallback = when (item.flow) {
                  PlannedFlow.OBLIGATION -> MyFinHubIcons.Plan
                  PlannedFlow.INCOME -> MyFinHubIcons.Income
                  PlannedFlow.TRANSFER -> MyFinHubIcons.Transfer
              }
              val icon = if (item.flow == PlannedFlow.TRANSFER) fallback else myFinHubCategoryIcon(item.category.ifBlank { item.title }, fallback)
              val amount = when (item.flow) {
                  PlannedFlow.OBLIGATION -> "−${formatPlan2026Euro(abs(item.amount))}"
                  PlannedFlow.INCOME -> "+${formatPlan2026Euro(abs(item.amount))}"
                  PlannedFlow.TRANSFER -> formatPlan2026Euro(abs(item.amount))
              }
              val largeFont = LocalDensity.current.fontScale >= 1.3f
              MyFinHubSectionCard(modifier = Modifier.fillMaxWidth().testTag("s7_plan_item_${item.id}")) {
                  if (largeFont) {
                      Column(verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.xs)) {
                          Row(horizontalArrangement = Arrangement.spacedBy(MyFinHubSpacing.sm), verticalAlignment = Alignment.Top) {
                              MyFinHubIconBadge(icon, tone, null)
                              PlanItemIdentity(item, Modifier.weight(1f))
                          }
                          MyFinHubAmountText(amount, tone, modifier = Modifier.align(Alignment.End))
                      }
                  } else {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(MyFinHubSpacing.sm),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          MyFinHubIconBadge(icon, tone, null)
                          PlanItemIdentity(item, Modifier.weight(1f))
                          MyFinHubAmountText(amount, tone)
                      }
                  }
              }
          }

          @Composable
          private fun PlanItemIdentity(item: PlannedItem, modifier: Modifier) {
              Column(modifier = modifier, verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.micro)) {
                  Text(item.title, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)
                  Text(
                      buildString {
                          append(item.dueLabel.ifBlank { "Χωρίς ημερομηνία" })
                          if (item.category.isNotBlank()) append(" · ${item.category}")
                      },
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
                  if (item.accountLabel.isNotBlank()) {
                      Text(item.accountLabel, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }

          /** Exact 30-day forecast detail. No presentation cap is applied to included canonical items. */
          @Composable
          fun CanonicalPlanForecastScreen(
              state: PlanUiState,
              onBack: () -> Unit,
              onRecordItem: (PlannedItem) -> Unit = {},
          ) {
              val included = planForecastIncludedItems(state)
              val overdueIncluded = included.any { it.flow == PlannedFlow.OBLIGATION && it.urgency == PlannedUrgency.OVERDUE }
              Scaffold(
                  topBar = {
                      MyFinHubScreenHeader(
                          title = "Πρόβλεψη 30 ημερών",
                          subtitle = planForecastScopeLabel(state),
                          navigation = { MyFinHubBackButton(onBack) },
                      )
                  },
              ) { padding ->
                  LazyColumn(
                      modifier = Modifier.fillMaxSize().testTag("s7_forecast_root"),
                      contentPadding = PaddingValues(
                          start = MyFinHubDesignMetrics.screenHorizontalPadding,
                          top = padding.calculateTopPadding() + MyFinHubSpacing.xs,
                          end = MyFinHubDesignMetrics.screenHorizontalPadding,
                          bottom = MyFinHubDesignMetrics.navigationContentBottomClearance,
                      ),
                      verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.md),
                  ) {
                      item("forecast-summary") {
                          MyFinHubSectionCard(modifier = Modifier.fillMaxWidth()) {
                              Column(verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.sm)) {
                                  Text("Προβλεπόμενο διαθέσιμο", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)
                                  MyFinHubAmountText(
                                      formatPlan2026Euro(state.forecastEndBalance),
                                      if (state.forecastEndBalance >= 0.0) FinanceTone.Income else FinanceTone.Expense,
                                      style = MaterialTheme.typography.headlineMedium,
                                  )
                                  ForecastMetric("Άνοιγμα", state.forecastStartBalance, FinanceTone.Neutral)
                                  ForecastMetric("Προγραμματισμένα έσοδα", state.forecastExpectedIncome, FinanceTone.Income, positive = true)
                                  ForecastMetric("Υποχρεώσεις", -state.forecastObligations, FinanceTone.Expense)
                                  ForecastMetric("Επίδραση μεταφορών", state.forecastTransferImpact, FinanceTone.Neutral, positive = true)
                                  HorizontalDivider(color = MaterialTheme.colorScheme.outlineVariant)
                                  Text(
                                      "Άνοιγμα + έσοδα − υποχρεώσεις ± επίδραση μεταφορών = προβλεπόμενο διαθέσιμο.",
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                                  if (overdueIncluded) {
                                      Text(
                                          "Περιλαμβάνονται και καθυστερημένες εκκρεμείς υποχρεώσεις που παραμένουν απλήρωτες.",
                                          style = MaterialTheme.typography.bodySmall,
                                          color = MaterialTheme.colorScheme.tertiary,
                                      )
                                  }
                              }
                          }
                      }

                      item("forecast-items-heading") {
                          MyFinHubSectionHeading(
                              title = "Κινήσεις που υπολογίζονται",
                              subtitle = "${included.size} καταγεγραμμένες πηγές · χωρίς περικοπή ή συγχώνευση όμοιων τίτλων",
                              icon = MyFinHubIcons.Plan,
                              tone = FinanceTone.Neutral,
                          )
                      }
                      if (included.isEmpty()) {
                          item("forecast-empty") {
                              MyFinHubSectionCard(modifier = Modifier.fillMaxWidth()) {
                                  Text("Δεν υπάρχουν καταγεγραμμένες κινήσεις μέσα στο εύρος.", color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                          }
                      } else {
                          items(included, key = { "forecast-${it.id}" }) { item ->
                              ForecastItemCard(item = item, onRecordItem = onRecordItem)
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ForecastMetric(label: String, amount: Double, tone: FinanceTone, positive: Boolean = false) {
              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                  Text(label, style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  val text = when {
                      amount < -0.005 -> "−${formatPlan2026Euro(abs(amount))}"
                      amount > 0.005 && positive -> "+${formatPlan2026Euro(amount)}"
                      else -> formatPlan2026Euro(abs(amount))
                  }
                  MyFinHubAmountText(text, tone)
              }
          }

          @Composable
          private fun ForecastItemCard(item: PlannedItem, onRecordItem: (PlannedItem) -> Unit) {
              MyFinHubSectionCard(modifier = Modifier.fillMaxWidth()) {
                  Column(verticalArrangement = Arrangement.spacedBy(MyFinHubSpacing.xs)) {
                      PlanDecisionRowContent(item)
                      if (item.flow != PlannedFlow.TRANSFER) {
                          TextButton(
                              onClick = { onRecordItem(item) },
                              modifier = Modifier.testTag("s7_forecast_record_${item.id}"),
                          ) {
                              Text(if (item.flow == PlannedFlow.INCOME) "Καταχώριση εσόδου" else "Καταχώριση πληρωμής")
                          }
                      }
                  }
              }
          }

          @Composable
          private fun PlanDecisionRowContent(item: PlannedItem) {
              val tone = when (item.flow) {
                  PlannedFlow.OBLIGATION -> FinanceTone.Expense
                  PlannedFlow.INCOME -> FinanceTone.Income
                  PlannedFlow.TRANSFER -> FinanceTone.Neutral
              }
              val amount = when (item.flow) {
                  PlannedFlow.OBLIGATION -> "−${formatPlan2026Euro(abs(item.amount))}"
                  PlannedFlow.INCOME -> "+${formatPlan2026Euro(abs(item.amount))}"
                  PlannedFlow.TRANSFER -> formatPlan2026Euro(abs(item.amount))
              }
              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(MyFinHubSpacing.sm), verticalAlignment = Alignment.CenterVertically) {
                  MyFinHubIconBadge(
                      when (item.flow) {
                          PlannedFlow.OBLIGATION -> MyFinHubIcons.Plan
                          PlannedFlow.INCOME -> MyFinHubIcons.Income
                          PlannedFlow.TRANSFER -> MyFinHubIcons.Transfer
