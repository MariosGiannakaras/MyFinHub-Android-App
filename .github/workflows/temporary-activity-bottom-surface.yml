name: Temporary Activity Bottom Surface

on:
  push:
    branches:
      - android/full-product-reaudit-redesign
    paths:
      - scripts/temporary_activity_bottom_surface_patch.py
      - .github/workflows/temporary-activity-bottom-surface.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/full-product-reaudit-redesign
          fetch-depth: 0
      - name: Apply inspected Activity and Insights cleanup
        run: python3 scripts/temporary_activity_bottom_surface_patch.py
      - name: Commit production changes and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/temporary_activity_bottom_surface_patch.py
          rm .github/workflows/temporary-activity-bottom-surface.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Activity bottom action and clear hidden drill-in filter"
          git push origin HEAD:android/full-product-reaudit-redesign
