# Temporary one-shot source checkpoint: reviewed UI/UX screenshot references for PR #490.
# Remove this workflow after its single successful push and rerun normal PR gates.
name: PR490 UI/UX reference refresh

on:
  push:
    branches:
      - android/ui-ux-interaction-redesign-20261119
    paths:
      - .github/workflows/ui-ux-pr490-reference-refresh.yml

permissions:
  contents: write

jobs:
  refresh-references:
    if: github.repository == 'MariosGiannakaras/MyFinHub-Android-App' && github.ref == 'refs/heads/android/ui-ux-interaction-redesign-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true

      - name: Check canonical project state
        run: python3 scripts/render_project_tracking.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh

      - name: Regenerate official screenshot references
        run: ./gradlew updateDebugScreenshotTest --no-configuration-cache --stacktrace

      - name: Check only expected snapshot changes are staged
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/screenshotTestDebug/reference
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          if (( ${#changed[@]} < 90 || ${#changed[@]} > 102 )); then
            echo "Unexpected number of visual references: ${#changed[@]}" >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            if [[ "$path" != app/src/screenshotTestDebug/reference/*.png ]]; then
              echo "Unexpected staged file: $path" >&2
              exit 1
            fi
          done
          printf 'Regenerated %s reviewed screenshot references.\n' "${#changed[@]}"

      - name: Commit generated references to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'test(android): refresh reviewed UI/UX screenshot goldens'
          git push origin HEAD:refs/heads/android/ui-ux-interaction-redesign-20261119
