name: Canonicalize validated UI screenshots once

on:
  push:
    branches:
      - feature/full-app-2026-ui-redesign
    paths:
      - .github/workflows/canonicalize-ui-screenshots-once.yml

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/full-app-2026-ui-redesign

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Regenerate exact-head screenshot references
        shell: bash
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Sync validated product screenshot folder
        shell: bash
        run: |
          set -euo pipefail
          root='app/src/screenshotTestDebug/reference'
          copy_one() {
            pattern="$1"
            dest="$2"
            src=$(find "$root" -type f -name "$pattern" -print -quit)
            if [[ -z "$src" ]]; then
              echo "Missing screenshot for pattern: $pattern" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
          }

          copy_one '*HomeCompactLightScreenshot_home_compact_light*.png' screenshots/home/home-compact.png
          copy_one '*HomeCompactLargeFontScreenshot_home_compact_large_font*.png' screenshots/home/home-large-font.png
          copy_one '*HomeExpandedDarkScreenshot_home_expanded_dark*.png' screenshots/home/home-expanded-dark.png
          copy_one '*HomeAttentionDetailCompactScreenshot_home_attention_detail_compact*.png' screenshots/home/home-attention-detail.png

          copy_one '*Phase2BActivityCompactLightScreenshot_phase2b_activity_compact_light*.png' screenshots/activity/activity-compact.png
          copy_one '*Phase2BActivityCompactLargeFontScreenshot_phase2b_activity_compact_large_font*.png' screenshots/activity/activity-large-font.png
          copy_one '*Phase2BQuickEntryCompactLightScreenshot_phase2b_quick_entry_compact_light*.png' screenshots/quick-entry/quick-entry-compact.png
          copy_one '*Phase2BInsightsExpandedDarkScreenshot_phase2b_insights_expanded_dark*.png' screenshots/insights/insights-expanded-dark.png

          copy_one '*AuthLoginCompactLightScreenshot_auth_login_compact_light*.png' screenshots/auth/login.png
          copy_one '*AuthLockedPinFallbackCompactLightScreenshot_auth_locked_pin_fallback_compact_light*.png' screenshots/auth/locked-pin-fallback.png
          copy_one '*AuthPinEnrollmentCompactLargeFontScreenshot_auth_pin_enrollment_compact_large_font*.png' screenshots/auth/pin-enrollment-large-font.png

          copy_one '*MoneyOverviewCompactLightScreenshot_money_overview_compact_light*.png' screenshots/money/money-overview.png
          copy_one '*MoneyOverviewCompactLargeFontScreenshot_money_overview_compact_large_font*.png' screenshots/money/money-overview-large-font.png
          copy_one '*CreditCardStackCompactLightScreenshot_card_stack_compact_light*.png' screenshots/money/credit-card-stack-compact.png
          copy_one '*CreditCardStackExpandedScreenshot_card_stack_expanded_tablet_light*.png' screenshots/money/credit-card-stack-expanded.png
          copy_one '*CreditCardStackCompactLargeFontScreenshot_card_stack_compact_150_percent_font*.png' screenshots/money/credit-card-stack-large-font.png
          copy_one '*MoneySavingsCompactLightScreenshot_money_savings_compact_light*.png' screenshots/money/money-savings.png
          copy_one '*MoneyLoansCompactLightScreenshot_money_loans_compact_light*.png' screenshots/money/money-loans.png
          copy_one '*MoneyLoanEditorCompactLargeFontScreenshot_money_loan_editor_compact_large_font*.png' screenshots/money/money-loan-edit-large-font.png
          copy_one '*MoneyLendingCompactLightScreenshot_money_lending_compact_light*.png' screenshots/money/money-lending.png
          copy_one '*MoneyLendingEditorCompactLightScreenshot_money_lending_editor_compact_light*.png' screenshots/money/money-lending-edit.png

          copy_one '*PlanOverviewCompactLightScreenshot_plan_overview_compact_light*.png' screenshots/plan/plan-overview.png
          copy_one '*PlanOverviewCompactLargeFontScreenshot_plan_overview_compact_large_font*.png' screenshots/plan/plan-overview-large-font.png
          copy_one '*PlanBudgetsCompactLightScreenshot_plan_budgets_compact_light*.png' screenshots/plan/plan-budgets.png
          copy_one '*PlanItemEditorCompactLightScreenshot_plan_item_editor_compact_light*.png' screenshots/plan/plan-item-edit.png

          copy_one '*SettingsCompactLargeFontScreenshot_settings_compact_large_font*.png' screenshots/utilities/settings-large-font.png
          copy_one '*ChangeHistoryCompactScreenshot_change_history_compact*.png' screenshots/utilities/change-history.png

          rm -f screenshots/plan/plan-forecast.png
          rm -f screenshots/utilities/data-transfer.png screenshots/utilities/data-transfer-confirmation.png

      - name: Commit validated screenshot baseline and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/screenshotTestDebug/reference screenshots
          git rm .github/workflows/canonicalize-ui-screenshots-once.yml
          git commit -m 'test: canonicalize validated 2026 UI screenshots'
          git push origin HEAD:feature/full-app-2026-ui-redesign
