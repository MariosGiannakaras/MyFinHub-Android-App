name: Temporary hardening compile fix

on:
  push:
    branches:
      - feature/full-app-2026-ui-redesign
    paths:
      - '.github/workflows/temporary-hardening-compile-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/full-app-2026-ui-redesign

      - name: Apply asserted one-line fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          finance = Path('app/src/main/java/app/myfinhub/android/app/FinanceProductViewModel.kt')
          text = finance.read_text()
          old = '        val amount = preview.amount\n'
          new = '        val amount = preview.amount ?: return\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one nullable amount binding, found {text.count(old)}')
          finance.write_text(text.replace(old, new, 1))

          api = Path('app/src/main/java/app/myfinhub/android/core/network/OkHttpMyFinHubApi.kt')
          text = api.read_text()
          old = '        return execute(request, ::parseEnvelope)\n'
          new = '        return execute(request, parse = ::parseEnvelope)\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one positional envelope parser call, found {text.count(old)}')
          api.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-hardening-compile-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/myfinhub/android/app/FinanceProductViewModel.kt \
                  app/src/main/java/app/myfinhub/android/core/network/OkHttpMyFinHubApi.kt \
                  .github/workflows/temporary-hardening-compile-fix.yml
          git commit -m 'fix: resolve hardening compile blockers'
          git push origin HEAD:feature/full-app-2026-ui-redesign
