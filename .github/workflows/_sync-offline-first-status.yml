name: Sync offline-first status

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/_sync-offline-first-status.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: develop

      - name: Update STATUS and TODO
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          status = Path('STATUS.md')
          text = status.read_text()
          marker = '## 2026-09-04 — Offline-first Phase 6 correction complete and merged'
          section = '''## 2026-09-04 — Offline-first Phase 6 correction complete and merged

Tracker #54 is completed/closed and the validated offline-first correction is merged into `develop`.

### Completed correction

- The latest server-accepted canonical finance snapshot is retained locally in owner-scoped Android-Keystore-backed encrypted storage for offline startup.
- Offline Quick Entry transactions are stored as a durable multi-item queue and survive process death/relaunch.
- Activity shows pending local transactions non-blockingly; pending detail supports safe local cancellation, while synchronized transaction detail supports canonical deletion with confirmation.
- Reconnect always loads the newest server state first, reconciles stable event IDs and automatically replays only mutations known never to have crossed the write boundary.
- Any attempted/ambiguous write is persisted as review-required before the network write and is never blindly resent automatically.
- Successful local PIN/biometric unlock can enter encrypted cache-only mode when network/server session validation is transiently unavailable. Only a genuinely invalid/expired/revoked server session requires full login.
- Regression coverage verifies encrypted cache restore, owner scoping, multi-pending persistence, stable-ID idempotency, server-first reconciliation, ambiguous retry exclusion and canonical transaction deletion.

### Final hosted validation

- Final canonical Activity pending screenshots for light, dark, 150% font and detail were personally inspected and accepted; screenshot regression passes without regeneration.
- Representative S24-target instrumentation is green.
- Normal Android verification is green: benchmark/Baseline Profile tooling, unit tests, instrumentation compile, lint/debug assembly, optimized unsigned release/R8 and release-manifest/unsigned-APK policy audit.
- No unresolved correction PR review blocker remained at merge.

### Current boundary

The latest `develop` state is the authoritative build for the next physical Samsung Galaxy S24 Ultra pass under issue #14 and `docs/PHASE_6_DEVICE_HANDOFF.md`. Physical offline/reconnect/deletion validation is still required. No production signing key, production-signed APK, version freeze, release or `develop -> main` promotion has been authorized.

'''
          if marker not in text:
              title = '# MyFinHub Android status\n\n'
              if not text.startswith(title):
                  raise SystemExit('Unexpected STATUS.md title')
              status.write_text(title + section + text[len(title):])

          todo = Path('TODO.md')
          text = todo.read_text()
          marker = '## Phase 6 offline-first physical correction — completed and merged'
          section = '''## Phase 6 offline-first physical correction — completed and merged

Tracker #54 / correction PR are complete and merged into `develop`.

- [x] Persist the last server-accepted canonical finance snapshot locally with owner-scoped Android Keystore encryption.
- [x] Restore cached finance data after process death/relaunch for authenticated local unlock.
- [x] Persist multiple offline-created transactions durably instead of blocking after one pending mutation.
- [x] Keep offline navigation usable and represent pending Activity items non-blockingly.
- [x] Reload fresh server state before replay and reconcile stable event IDs to prevent duplicates.
- [x] Automatically replay only transactions known never to have been sent; ambiguous attempts require explicit review/retry.
- [x] Keep successful PIN/biometric local unlock cache-capable during transient network/server session-validation failures; revoked/expired sessions still require login.
- [x] Add canonical synchronized transaction deletion plus safe local cancellation for never-synced pending transactions.
- [x] Cover cache restore, multi-pending persistence, replay idempotency, server-first reconciliation, ambiguous retry exclusion and deletion semantics with tests.
- [x] Accept final real Compose Activity pending light/dark/150%/detail references after personal inspection.
- [x] Final canonical screenshot regression, representative S24 instrumentation and complete normal Android verification green.
- [x] Merge with no unresolved hosted review blocker.

Physical S24 validation remains open in issue #14: offline cold/local unlock, multi-pending restart, reconnect/no-duplicate, ambiguous-write recovery, local pending cancellation and synchronized deletion/reload must be confirmed on the owner's Samsung Galaxy S24 Ultra.

'''
          if marker not in text:
              title = '# MyFinHub Android TODO\n\n'
              if not text.startswith(title):
                  raise SystemExit('Unexpected TODO.md title')
              todo.write_text(title + section + text[len(title):])
          PY

      - name: Commit docs and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_sync-offline-first-status.yml
          git add STATUS.md TODO.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record offline-first Phase 6 correction'
          git push origin HEAD:develop
