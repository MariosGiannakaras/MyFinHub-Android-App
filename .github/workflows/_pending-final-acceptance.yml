name: One-shot final pending UI acceptance

on:
  push:
    branches:
      - android/pending-undo-updater-delivery
    paths:
      - .github/workflows/_pending-final-acceptance.yml

permissions:
  contents: write

jobs:
  final-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact correction branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/pending-undo-updater-delivery

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Generate wrapper when required
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi

      - name: Install final retained pending screenshot fixtures
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object app/src/screenshotTest/kotlin/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTest.kt)" == "e30af8239fe1873ea53b3369ef9a2ccc544a4748" ]]
          [[ "$(git hash-object app/src/screenshotTest/kotlin/app/myfinhub/android/feature/money/CanonicalMoneyScreenshotTest.kt)" == "081b6e9127fe8204506a67d12e51508991501c3c" ]]
          [[ "$(git hash-object app/src/screenshotTest/kotlin/app/myfinhub/android/feature/plan/CanonicalPlanScreenshotTest.kt)" == "2456cdce61943729d1b2f0e775be2093f02a95fc" ]]
          [[ "$(git hash-object app/src/screenshotTest/kotlin/app/myfinhub/android/app/PendingChangesScreenshotTest.kt)" == "758fdc7e73c5324001da098c133756e6d5239fb3" ]]

