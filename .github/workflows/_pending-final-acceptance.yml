      - name: Full functional and release-policy verification
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :benchmark:assembleBenchmark \
            :app:assembleBenchmarkRelease \
            :app:assembleNonMinifiedRelease \
            test \
            :app:compileDebugAndroidTestKotlin \
            lint \
            assembleDebug \
            assembleDebugAndroidTest \
            assembleRelease \
            analyzeReleaseR8Config \
            --stacktrace

          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for variant in benchmarkRelease nonMinifiedRelease; do
            apk=$(find "app/build/outputs/apk/$variant" -type f -name '*.apk' -print -quit)
            [[ -n "$apk" ]]
            "$aapt" dump xmltree "$apk" AndroidManifest.xml | grep -F 'BenchmarkProductActivity'
          done
          [[ ! -s app/build/outputs/mapping/nonMinifiedRelease/mapping.txt ]]

          mapfile -t manifests < <(find app/build/intermediates -type f -name AndroidManifest.xml -path '*/release/*' -print)
          [[ ${#manifests[@]} -gt 0 ]]
          forbidden='BenchmarkProductActivity|ProductTestActivity|AuthTestActivity|<profileable|android:debuggable="true"|android:usesCleartextTraffic="true"'
          for manifest in "${manifests[@]}"; do
            if grep -E "$forbidden" "$manifest"; then
              exit 1
            fi
          done
          release_apk=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          [[ -n "$release_apk" ]]
          "$aapt" dump badging "$release_apk" | grep -F "package: name='app.myfinhub.android' versionCode='1'"
          if "$apksigner" verify "$release_apk" >/dev/null 2>&1; then
            echo 'Public CI release APK must remain unsigned.' >&2
            exit 1
          fi

      - name: Render and validate final screenshots
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew updateDebugScreenshotTest --stacktrace
          ./gradlew validateDebugScreenshotTest --stacktrace

          mapfile -t changed_refs < <(git diff --name-only -- app/src/screenshotTestDebug/reference)
          [[ ${#changed_refs[@]} -gt 0 ]]
          for path in "${changed_refs[@]}"; do
            case "$path" in
              app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/*|\
              app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalMoneyScreenshotTestKt/*|\
              app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/CanonicalPlanScreenshotTestKt/*|\
              app/src/screenshotTestDebug/reference/app/myfinhub/android/app/PendingChangesScreenshotTestKt/*)
                ;;
              *)
                echo "Unexpected screenshot reference change: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Representative S24-target interaction and accessibility tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: bash scripts/run-connected-android-tests.sh

      - name: Publish final rendered pending UI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pending-final-ui-evidence
          path: |
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/*.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalMoneyScreenshotTestKt/*.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/CanonicalPlanScreenshotTestKt/*.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/app/PendingChangesScreenshotTestKt/*.png
            app/build/reports/screenshotTest/**/*.html
          if-no-files-found: error
          retention-days: 14

      - name: Commit accepted candidates and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_pending-final-acceptance.yml
          git add \
            app/src/screenshotTest/kotlin/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTest.kt \
            app/src/screenshotTest/kotlin/app/myfinhub/android/feature/money/CanonicalMoneyScreenshotTest.kt \
            app/src/screenshotTest/kotlin/app/myfinhub/android/feature/plan/CanonicalPlanScreenshotTest.kt \
            app/src/screenshotTest/kotlin/app/myfinhub/android/app/PendingChangesScreenshotTest.kt \
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt \
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalMoneyScreenshotTestKt \
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/CanonicalPlanScreenshotTestKt \
            app/src/screenshotTestDebug/reference/app/myfinhub/android/app/PendingChangesScreenshotTestKt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add final pending state visual evidence"
          git push origin HEAD:android/pending-undo-updater-delivery
