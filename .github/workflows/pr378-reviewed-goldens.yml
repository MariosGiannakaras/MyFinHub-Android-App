name: PR 378 Reviewed Screenshot Baseline Sync

# Temporary, branch-scoped authoring helper. Delete before PR merge.
on:
  push:
    branches:
      - android/owner-five-tabs-vertical-stack-20261027
    paths:
      - .github/workflows/pr378-reviewed-goldens.yml

permissions:
  contents: write

jobs:
  update-reviewed-baselines:
    if: github.repository == 'MariosGiannakaras/MyFinHub-Android-App' && github.ref == 'refs/heads/android/owner-five-tabs-vertical-stack-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the isolated PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/owner-five-tabs-vertical-stack-20261027
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh

      - name: Render the already-reviewed Compose screenshots
        run: ./gradlew updateDebugScreenshotTest --stacktrace

      - name: Commit exactly the seven visually reviewed changed baselines
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            app/src/screenshotTestDebug/reference/app/myfinhub/android/app/UserNoticeScreenshotTestKt/UserNoticeSnackbarScreenshot_user_notice_snackbar_phone_eb89e693_0.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/home/ProductionHomeScreenshotTestKt/ProductionHomeAllAccountsDarkScreenshot_production_home_full_accounts_dark_fdc3528a_0.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/home/ProductionHomeScreenshotTestKt/ProductionHomeAllAccountsLightScreenshot_production_home_full_accounts_light_df291c5b_0.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CreditCardStackScreenshotTestKt/CreditCardStackCompactLargeFontScreenshot_card_stack_compact_150_percent_font_c9b36481_0.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/S7PlanScreenshotTestKt/S7PlanDark_s7_plan_dark_8ab7588e_0.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/S7PlanScreenshotTestKt/S7PlanLarge_s7_plan_large_18fa4087_0.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/S7PlanScreenshotTestKt/S7PlanLight_s7_plan_light_0b794e8d_0.png
          )
          git add -- "${expected[@]}"
          mapfile -t staged < <(git diff --cached --name-only)
          printf 'Rendered baseline paths:\n%s\n' "${staged[@]}"
          if (( ${#staged[@]} != 7 )); then
            echo "Expected 7 updated images, got ${#staged[@]}; refusing partial/unreviewed commit." >&2
            exit 1
          fi
          for path in "${staged[@]}"; do
            match=false
            for permitted in "${expected[@]}"; do
              if [[ "$path" == "$permitted" ]]; then match=true; break; fi
            done
            if [[ "$match" != true ]]; then
              echo "Unexpected staged file: $path" >&2
              exit 1
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh seven visually reviewed Android Compose screenshot references'
          git push origin HEAD:refs/heads/android/owner-five-tabs-vertical-stack-20261027
