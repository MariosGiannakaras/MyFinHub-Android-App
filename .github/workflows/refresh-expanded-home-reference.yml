name: Refresh expanded Home reference

on:
  push:
    branches:
      - feature/full-app-2026-ui-redesign
    paths:
      - '.github/workflows/refresh-expanded-home-reference.yml'

permissions:
  contents: write
  actions: read

jobs:
  refresh-reference:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/full-app-2026-ui-redesign

      - name: Restore validated rendered Home reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=9815644695
          archive=/tmp/myfinhub-rendered-home.zip
          rendered=/tmp/myfinhub-rendered-home
          relative='src/screenshotTestDebug/reference/app/myfinhub/android/app/HomeScreenshotTestKt/HomeExpandedDarkScreenshot_home_expanded_dark_6aa0d8b0_0.png'
          target="app/$relative"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$archive"

          mkdir -p "$rendered"
          unzip -q "$archive" "$relative" -d "$rendered"
          test "$(sha256sum "$rendered/$relative" | awk '{print $1}')" = '0dca3e7c16f65421925a5b233c131d7523cc6ba8153251e8771d7994b6bbaf43'
          cp "$rendered/$relative" "$target"

          rm .github/workflows/refresh-expanded-home-reference.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target" .github/workflows/refresh-expanded-home-reference.yml
          git diff --cached --quiet && exit 0
          git commit -m 'test: refresh expanded home screenshot'
          git push origin HEAD:feature/full-app-2026-ui-redesign
