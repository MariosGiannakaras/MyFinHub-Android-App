name: Android Reviewed Goldens PR448

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Single temporary, guarded workflow for accepting the exact synthetic Compose
# images already generated and visually inspected on the owner-approved PR.
# This workflow is NOT one of the four mandatory PR acceptance gates.
jobs:
  sync-reviewed-screenshot-references:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 448 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, '[approve-rendered-goldens]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: pr448-reviewed-screenshot-sync
      cancel-in-progress: false
    steps:
      - name: Checkout exact PR head (never merge ref)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Verify canonical tracking source
        run: python3 scripts/render_project_tracking.py --check
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Render official reference PNGs from this exact reviewed source
        run: ./gradlew updateDebugScreenshotTest --no-configuration-cache --stacktrace
      - name: Mirror exact approved references, without redrawing
        run: |
          python3 scripts/verify_visual_reference_mirrors.py --sync
          python3 scripts/verify_visual_reference_mirrors.py
      - name: Fast-forward commit exact rendered PNGs to the same PR branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/src/screenshotTestDebug/reference screenshots
          if git diff --cached --quiet; then
            echo 'Golden reference and public mirror files are already up to date.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'test(visual): accept reviewed mobile Compose golden screenshots'
          # Non-force push; never overwrite an independently advanced branch.
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"


