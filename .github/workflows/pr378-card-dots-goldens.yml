name: PR 378 Card Pagination Screenshot Update

# Temporary branch-specific helper. Remove in final validated PR commit.
on:
  push:
    branches: [android/owner-five-tabs-vertical-stack-20261027]
    paths: [.github/workflows/pr378-card-dots-goldens.yml]

permissions:
  contents: write

concurrency:
  group: pr378-card-dot-goldens
  cancel-in-progress: true

jobs:
  render-reviewed-cards:
    if: github.repository == 'MariosGiannakaras/MyFinHub-Android-App' && github.ref == 'refs/heads/android/owner-five-tabs-vertical-stack-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/owner-five-tabs-vertical-stack-20261027
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Render native Compose card snapshots
        run: ./gradlew updateDebugScreenshotTest --stacktrace
      - name: Commit only the affected real-card reference PNGs
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CreditCardStackScreenshotTestKt/CreditCardStackCompactLightScreenshot_card_stack_compact_light_04e49ab8_0.png
            app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CreditCardStackScreenshotTestKt/CreditCardStackCompactLargeFontScreenshot_card_stack_compact_150_percent_font_c9b36481_0.png
          )
          git add -- "${allowed[@]}"
          mapfile -t staged < <(git diff --cached --name-only)
          printf 'Reviewed card reference changes:\n%s\n' "${staged[@]}"
          if (( ${#staged[@]} < 1 || ${#staged[@]} > 2 )); then
            echo "Expected one or two affected card snapshot changes, got ${#staged[@]}" >&2
            exit 1
          fi
          for changed in "${staged[@]}"; do
            permitted=false
            for path in "${allowed[@]}"; do
              if [[ "$path" == "$changed" ]]; then permitted=true; break; fi
            done
            if [[ "$permitted" != true ]]; then
              echo "Unapproved screenshot path: $changed" >&2
              exit 1
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh card selector 48dp touch-target Compose screenshot references'
          git push origin HEAD:refs/heads/android/owner-five-tabs-vertical-stack-20261027
