name: One-time reviewed Android screenshot checkpoint
on:
  push:
    branches:
      - android/web-parity-code-first-bulk-20261023

permissions:
  contents: read

concurrency:
  group: reviewed-android-screenshots-bulk-20261023
  cancel-in-progress: true

jobs:
  reviewed-baselines:
    if: github.repository == 'MariosGiannakaras/MyFinHub-Android-App' && github.ref == 'refs/heads/android/web-parity-code-first-bulk-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact protected PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/web-parity-code-first-bulk-20261023
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'
      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh
      - name: Re-render actual Compose production previews
        run: ./gradlew updateDebugScreenshotTest --stacktrace
      - name: Require only personally reviewed changed baselines
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/reviewed-android-screenshots.txt <<'WHITELIST'
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityEditDarkScreenshot_production_activity_edit_dark_486e7d1d_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityEditLargeFontScreenshot_production_activity_edit_large_font_4f0ecc79_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/activity/ProductionActivityScreenshotTestKt/ProductionActivityEditScreenshot_production_activity_edit_0f264771_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/insights/InsightsScreenshotTestKt/InsightsCompactLargeFontScreenshot_insights_compact_large_font_92696cce_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/insights/InsightsScreenshotTestKt/InsightsCompactDarkScreenshot_insights_compact_dark_79a1f2a1_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/insights/InsightsScreenshotTestKt/InsightsCompactLightScreenshot_insights_compact_light_0d06167b_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/insights/InsightsScreenshotTestKt/InsightsFullLargeFontScreenshot_insights_full_large_font_b9013df4_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCardDetailScreenshotTestKt/CanonicalCardDetailLightScreenshot_canonical_card_detail_light_315a739a_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCardDetailScreenshotTestKt/CanonicalCardDetailLargeFontScreenshot_canonical_card_detail_large_font_665deb00_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalCardDetailScreenshotTestKt/CanonicalCardDetailDarkScreenshot_canonical_card_detail_dark_7c0c9ebf_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/money/CanonicalMoneyScreenshotTestKt/CanonicalLoansCompactLightScreenshot_canonical_loans_compact_light_48b79ab1_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/S7PlanScreenshotTestKt/S7BudgetLarge_s7_budget_large_acbd1ba0_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/S7PlanScreenshotTestKt/S7BudgetDark_s7_budget_dark_25640f28_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/plan/S7PlanScreenshotTestKt/S7BudgetLight_s7_budget_light_73b79d53_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/quickentry/ProductionQuickEntryScreenshotTestKt/ProductionQuickEntrySplitDarkScreenshot_production_quick_entry_split_dark_12cd45ee_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/quickentry/ProductionQuickEntryScreenshotTestKt/ProductionQuickEntrySplitLightScreenshot_production_quick_entry_split_light_e9879f9d_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/quickentry/ProductionQuickEntryScreenshotTestKt/ProductionQuickEntryCompactLargeFontScreenshot_production_quick_entry_compact_large_font_f2f26a3e_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/quickentry/ProductionQuickEntryScreenshotTestKt/ProductionQuickEntryCompactDarkScreenshot_production_quick_entry_compact_dark_e7f0ce82_0.png
          app/src/screenshotTestDebug/reference/app/myfinhub/android/feature/quickentry/ProductionQuickEntryScreenshotTestKt/ProductionQuickEntryCompactLightScreenshot_production_quick_entry_compact_light_5e5d5329_0.png
          WHITELIST
          git diff --name-only --diff-filter=ACMR > /tmp/actual-android-screenshots.txt
          if ! diff -u <(sort /tmp/reviewed-android-screenshots.txt) <(sort /tmp/actual-android-screenshots.txt); then
            echo 'Rendered screenshot set differs from the owner-review candidate; no baseline will be committed.' >&2
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard app/src/screenshotTestDebug/reference)" ]; then
            echo 'Unexpected new screenshot files; fail closed.' >&2
            exit 1
          fi
          if [ -n "$(git diff --name-only --diff-filter=D)" ]; then
            echo 'Unexpected deleted files; fail closed.' >&2
            exit 1
          fi
      - name: Publish only reviewed screenshots and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            git add -- "$path"
          done < /tmp/reviewed-android-screenshots.txt
          git rm -- .github/workflows/android-parity-reviewed-baselines-20261024.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(android): accept reviewed Web-parity Compose screenshot references'
          git push origin HEAD:refs/heads/android/web-parity-code-first-bulk-20261023
