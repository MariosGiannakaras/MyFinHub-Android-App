name: Polish Money Frontend

on:
  push:
    branches:
      - feature/money-product-parity
    paths:
      - '.github/workflows/polish-money-frontend.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Money branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/money-product-parity
          fetch-depth: 0

      - name: Bring in current Plan frontend state
        shell: bash
        run: |
          git fetch origin feature/frontend-product-parity
          git merge --no-edit origin/feature/frontend-product-parity

      - name: Polish Money copy and add navigation coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          screen = Path('app/src/main/java/app/myfinhub/android/feature/money/MoneyScreen.kt')
          text = screen.read_text()
          text = text.replace('import androidx.compose.ui.platform.LocalDensity\n', 'import androidx.compose.ui.platform.LocalDensity\nimport androidx.compose.ui.platform.testTag\n')
          text = text.replace('modifier = Modifier.fillMaxSize().padding(padding),', 'modifier = Modifier.fillMaxSize().padding(padding).testTag("money_list"),', 1)
          text = text.replace('Text("Αποθήκευση draft")', 'Text("Αποθήκευση")')
          text = text.replace('EmptyMoneyState("Δεν υπάρχουν δάνεια στο τρέχον frontend state.")', 'EmptyMoneyState("Δεν υπάρχουν δάνεια.")')
          text = text.replace('EmptyMoneyState("Δεν υπάρχουν απαιτήσεις στο τρέχον frontend state.")', 'EmptyMoneyState("Δεν υπάρχουν ανοιχτές απαιτήσεις.")')
          technical_blocks = [
              '''            Text(\n                "Ο στόχος και η μηνιαία συνεισφορά είναι frontend drafts. Η τελική persistence θα συνδεθεί αργότερα με το canonical finance contract.",\n                style = MaterialTheme.typography.bodySmall,\n                color = MaterialTheme.colorScheme.onSurfaceVariant,\n            )\n''',
              '''                Text(\n                    "Το edit flow είναι frontend-first και δεν δηλώνει server persistence πριν ολοκληρωθεί το backend integration pass.",\n                    style = MaterialTheme.typography.bodySmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                )\n''',
              '''                Text(\n                    "Η απαίτηση είναι frontend draft μέχρι να συνδεθεί με το canonical lending contract.",\n                    style = MaterialTheme.typography.bodySmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                )\n''',
          ]
          for block in technical_blocks:
              text = text.replace(block, '')
          screen.write_text(text)

          state = Path('app/src/main/java/app/myfinhub/android/feature/money/MoneyUiState.kt')
          text = state.read_text()
          replacements = {
              'Η κατάσταση του στόχου ενημερώθηκε τοπικά στο Android UI.': 'Η κατάσταση του στόχου ενημερώθηκε.',
              'Ο στόχος αποταμίευσης είναι έγκυρος ως frontend draft.': 'Οι αλλαγές του στόχου αποθηκεύτηκαν προσωρινά.',
              'Η αλλαγή δανείου διατηρείται στο Android UI μέχρι το backend integration pass.': 'Οι αλλαγές του δανείου αποθηκεύτηκαν προσωρινά.',
              'Η κατάσταση δανείου ενημερώθηκε τοπικά στο Android UI.': 'Η κατάσταση του δανείου ενημερώθηκε.',
              'Η απαίτηση διατηρείται στο Android UI μέχρι το backend integration pass.': 'Οι αλλαγές της απαίτησης αποθηκεύτηκαν προσωρινά.',
              'Η κατάσταση απαίτησης ενημερώθηκε τοπικά στο Android UI.': 'Η κατάσταση της απαίτησης ενημερώθηκε.',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          state.write_text(text)

          unit = Path('app/src/test/java/app/myfinhub/android/feature/money/MoneyReducerTest.kt')
          text = unit.read_text().replace('contains("έγκυρος")', 'contains("αποθηκεύτηκαν")')
          unit.write_text(text)
          PY

          cat > app/src/androidTest/java/app/myfinhub/android/MoneyParityTest.kt <<'EOF'
          package app.myfinhub.android

          import androidx.compose.ui.test.assertIsDisplayed
          import androidx.compose.ui.test.hasText
          import androidx.compose.ui.test.junit4.v2.createAndroidComposeRule
          import androidx.compose.ui.test.onNodeWithTag
          import androidx.compose.ui.test.onNodeWithText
          import androidx.compose.ui.test.performClick
          import androidx.compose.ui.test.performScrollToNode
          import org.junit.Rule
          import org.junit.Test

          class MoneyParityTest {
              @get:Rule
              val composeRule = createAndroidComposeRule<ProductTestActivity>()

              @Test
              fun money_drillsIntoSavingsLoansAndLending() {
                  composeRule.onNodeWithText("Χρήματα").performClick()
                  composeRule.onNodeWithText("Λογαριασμοί").assertIsDisplayed()

                  composeRule.onNodeWithTag("money_list")
                      .performScrollToNode(hasText("Διαχείριση στόχου"))
                  composeRule.onNodeWithText("Διαχείριση στόχου").performClick()
                  composeRule.onNodeWithText("Χρονικός στόχος").assertIsDisplayed()
                  composeRule.onNodeWithText("Μηνιαία συνεισφορά").assertIsDisplayed()
                  composeRule.onNodeWithText("Πίσω").performClick()

                  composeRule.onNodeWithTag("money_list")
                      .performScrollToNode(hasText("Δάνεια"))
                  composeRule.onNodeWithText("Δάνεια").performClick()
                  composeRule.onNodeWithText("Συνολικό υπόλοιπο").assertIsDisplayed()
                  composeRule.onNodeWithText("Προσωπικό δάνειο").performClick()
                  composeRule.onNodeWithText("Πιστωτής").assertIsDisplayed()
                  composeRule.onNodeWithText("Μηνιαία δόση").assertIsDisplayed()
                  composeRule.onNodeWithText("Πίσω").performClick()
                  composeRule.onNodeWithText("Πίσω").performClick()

                  composeRule.onNodeWithTag("money_list")
                      .performScrollToNode(hasText("Απαιτήσεις"))
                  composeRule.onNodeWithText("Απαιτήσεις").performClick()
                  composeRule.onNodeWithText("Αναμενόμενες επιστροφές").assertIsDisplayed()
                  composeRule.onNodeWithText("Επιστροφή χρημάτων").performClick()
                  composeRule.onNodeWithText("Αναμενόμενη ημερομηνία").assertIsDisplayed()
              }
          }
          EOF

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/polish-money-frontend.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/myfinhub/android/feature/money/MoneyScreen.kt \
                  app/src/main/java/app/myfinhub/android/feature/money/MoneyUiState.kt \
                  app/src/test/java/app/myfinhub/android/feature/money/MoneyReducerTest.kt \
                  app/src/androidTest/java/app/myfinhub/android/MoneyParityTest.kt
          git commit -m 'feat(money): polish frontend parity flows'
          git push origin HEAD:feature/money-product-parity
