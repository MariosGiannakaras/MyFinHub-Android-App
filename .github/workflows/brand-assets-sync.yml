name: Finalize canonical MyFinHub brand integration

on:
  push:
    branches:
      - feature/full-app-2026-ui-redesign
    paths:
      - .github/workflows/brand-assets-sync.yml

permissions:
  contents: write

jobs:
  integrate-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/full-app-2026-ui-redesign

      - name: Verify canonical artwork provenance
        shell: bash
        run: |
          set -euo pipefail
          light='app/src/main/res/drawable-nodpi/myfinhub_brand_light.png'
          dark='app/src/main/res/drawable-nodpi/myfinhub_brand_dark.png'
          [[ -f "$light" && -f "$dark" ]]
          [[ "$(git hash-object "$light")" == '5e7b1843f045636a4776e6180f32fccf552d0bfc' ]]
          [[ "$(git hash-object "$dark")" == '7156f1c56fc89c770593d257a5cb22d62c8a6fdd' ]]

      - name: Wire authentic mark into Home and auth presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('app/src/main/java/app/myfinhub/android/feature/home/HomeScreen.kt')
          text = home.read_text()
          if 'import app.myfinhub.android.designsystem.MyFinHubBrandMark\n' not in text:
              text = text.replace(
                  'import app.myfinhub.android.designsystem.FinanceTone\n',
                  'import app.myfinhub.android.designsystem.FinanceTone\nimport app.myfinhub.android.designsystem.MyFinHubBrandMark\n',
              )
          old = '''            MyFinHubScreenHeader(\n                title = "MyFinHub",\n                subtitle = "Έξυπνα οικονομικά, κάθε μέρα.",\n            )'''
          new = '''            MyFinHubScreenHeader(\n                title = "MyFinHub",\n                subtitle = "Έξυπνα οικονομικά, κάθε μέρα.",\n                navigation = { MyFinHubBrandMark(iconSize = 36.dp) },\n            )'''
          if old not in text and new not in text:
              raise SystemExit('Home brand header anchor not found')
          text = text.replace(old, new)
          home.write_text(text)

          auth = Path('app/src/main/java/app/myfinhub/android/feature/auth/AuthShellScreen.kt')
          text = auth.read_text()
          marker = 'import app.myfinhub.android.core.security.BiometricResult\n'
          imports = marker + 'import app.myfinhub.android.designsystem.MyFinHubBrandMark\nimport app.myfinhub.android.designsystem.MyFinHubBrandMode\n'
          if 'import app.myfinhub.android.designsystem.MyFinHubBrandMark\n' not in text:
              text = text.replace(marker, imports)
          old = '''            Column(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .widthIn(max = 480.dp)\n                    .verticalScroll(rememberScrollState()),\n                verticalArrangement = Arrangement.spacedBy(14.dp),\n                content = content,\n            )'''
          new = '''            Column(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .widthIn(max = 480.dp)\n                    .verticalScroll(rememberScrollState()),\n                verticalArrangement = Arrangement.spacedBy(14.dp),\n            ) {\n                MyFinHubBrandMark(\n                    mode = MyFinHubBrandMode.Lockup,\n                    iconSize = 40.dp,\n                    subtitle = "Smart. Clear. In Control.",\n                )\n                content()\n            }'''
          if old not in text and new not in text:
              raise SystemExit('Auth surface anchor not found')
          text = text.replace(old, new)
          auth.write_text(text)
          PY

      - name: Commit brand presentation wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/app/myfinhub/android/feature/home/HomeScreen.kt \
            app/src/main/java/app/myfinhub/android/feature/auth/AuthShellScreen.kt
          if git diff --cached --quiet; then
            echo 'Brand presentation already wired.'
            exit 0
          fi
          git commit -m 'ui: show authentic MyFinHub brand in app shell'
          git push origin HEAD:feature/full-app-2026-ui-redesign
