name: Temporary snackbar clearance fix

on:
  push:
    branches:
      - feature/full-app-2026-ui-redesign
    paths:
      - .github/workflows/temporary-snackbar-clearance-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/full-app-2026-ui-redesign
          fetch-depth: 0

      - name: Apply asserted FAB clearance adjustment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('app/src/main/java/app/myfinhub/android/app/MyFinHubRoot.kt')
          text = root.read_text()
          old = ') 88.dp else 12.dp'
          new = ') 152.dp else 12.dp'
          assert text.count(old) == 1, 'Unexpected product Snackbar clearance anchor count'
          root.write_text(text.replace(old, new, 1))

          fixture = Path('app/src/screenshotTest/kotlin/app/myfinhub/android/app/UserNoticeScreenshotTest.kt')
          text = fixture.read_text()
          old = '.padding(bottom = 88.dp),'
          new = '.padding(bottom = 152.dp),'
          assert text.count(old) == 1, 'Unexpected screenshot Snackbar clearance anchor count'
          fixture.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-snackbar-clearance-fix.yml
          git add app/src/main/java/app/myfinhub/android/app/MyFinHubRoot.kt \
                  app/src/screenshotTest/kotlin/app/myfinhub/android/app/UserNoticeScreenshotTest.kt
          git commit -m "fix: keep error snackbar clear of phone FAB"
          git push origin HEAD:feature/full-app-2026-ui-redesign
