name: Temporary Full Reaudit IA Pass

on:
  push:
    branches:
      - android/full-product-reaudit-redesign
    paths:
      - .github/workflows/temporary-full-reaudit-ia.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/full-product-reaudit-redesign
          fetch-depth: 0
      - name: Apply deterministic mobile IA patch
        run: python3 scripts/temporary_reaudit_ia_patch.py
      - name: Commit production IA pass and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-full-reaudit-ia.yml
          rm scripts/temporary_reaudit_ia_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild production mobile information hierarchy"
          git push origin HEAD:android/full-product-reaudit-redesign
