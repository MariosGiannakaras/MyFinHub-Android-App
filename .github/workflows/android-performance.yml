name: Android Performance

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'app/**'
      - 'benchmark/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/install-android-sdk.sh'
      - '.github/workflows/android-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-profile:
    runs-on: macos-15-intel
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Generate Baseline Profile
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: |
            ./gradlew :app:generateBaselineProfile -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile --stacktrace
            echo '--- Generated Baseline Profile sources ---'
            find app/src -path '*/generated/baselineProfiles/*.txt' -type f -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;

      - name: Check in generated Baseline Profile once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          BASELINE='app/src/main/generated/baselineProfiles/baseline-prof.txt'
          STARTUP='app/src/main/generated/baselineProfiles/startup-prof.txt'
          if git ls-files --error-unmatch "$BASELINE" >/dev/null 2>&1 && \
             git ls-files --error-unmatch "$STARTUP" >/dev/null 2>&1; then
            echo 'Generated profiles are already tracked; no one-shot commit is needed.'
            exit 0
          fi
          test -s "$BASELINE"
          test -s "$STARTUP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$BASELINE" "$STARTUP"
          git commit -m 'perf: check in generated baseline profiles'
          git push origin "HEAD:${HEAD_REF}"

      - name: Publish Baseline Profile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-baseline-profile-${{ github.run_id }}
          path: |
            app/src/**/generated/baselineProfiles/*.txt
            benchmark/build/outputs/connected_android_test_additional_output/nonMinifiedRelease/**
            benchmark/build/reports/androidTests/connected/nonMinifiedRelease/**
          if-no-files-found: warn
          retention-days: 14

  macrobenchmarks:
    runs-on: macos-15-intel
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Run Macrobenchmarks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim
            -no-snapshot-load -no-snapshot-save
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: ./gradlew :benchmark:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark --stacktrace

      - name: Publish Macrobenchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-macrobenchmark-${{ github.run_id }}
          path: |
            benchmark/build/outputs/**/*.json
            benchmark/build/outputs/**/*.txt
            benchmark/build/reports/**
          if-no-files-found: warn
          retention-days: 14
