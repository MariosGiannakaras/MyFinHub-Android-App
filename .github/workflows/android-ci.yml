name: Android CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.project.outputs.present == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.project.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Generate wrapper for validation when not committed yet
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi

      - name: Benchmark and Baseline Profile tooling build
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :benchmark:assembleBenchmark :app:assembleNonMinifiedRelease --stacktrace

          mapfile -t manifests < <(find app/build/intermediates -type f -name AndroidManifest.xml -path '*/nonMinifiedRelease/*' -print)
          if [[ ${#manifests[@]} -eq 0 ]]; then
            echo 'No processed nonMinifiedRelease manifest found.' >&2
            exit 1
          fi

          if ! grep -R -F 'app.myfinhub.android.BenchmarkProductActivity' "${manifests[@]}"; then
            echo 'BenchmarkProductActivity is missing from the Baseline Profile target manifest.' >&2
            exit 1
          fi
          echo 'Baseline Profile target includes the deterministic profiling activity.'

      - name: Unit tests, lint and debug assembly
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: ./gradlew test lint assembleDebug --stacktrace

      - name: Optimized unsigned release assembly and R8 analysis
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: ./gradlew assembleRelease analyzeReleaseR8Config --stacktrace

      - name: Audit release manifest and unsigned APK policy
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t manifests < <(find app/build/intermediates -type f -name AndroidManifest.xml -path '*/release/*' -print)
          if [[ ${#manifests[@]} -eq 0 ]]; then
            echo 'No processed release manifest found.' >&2
            exit 1
          fi

          forbidden='BenchmarkProductActivity|ProductTestActivity|AuthTestActivity|<profileable|android:debuggable="true"|android:usesCleartextTraffic="true"'
          for manifest in "${manifests[@]}"; do
            if grep -E "$forbidden" "$manifest"; then
              echo "Forbidden release manifest content found in $manifest" >&2
              exit 1
            fi
          done

          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          if [[ -z "$apk" ]]; then
            echo 'Unsigned release APK was not produced.' >&2
            exit 1
          fi

          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$aapt" dump badging "$apk" | grep -F "package: name='app.myfinhub.android' versionCode='1'"

          if "$apksigner" verify "$apk" >/dev/null 2>&1; then
            echo 'Public CI release APK must remain unsigned.' >&2
            exit 1
          fi
          echo 'Release artifact is unsigned and free of benchmark/debug manifest leakage.'

      - name: No Android project yet
        if: steps.project.outputs.present != 'true'
        run: echo "Android source has not landed on this branch yet; workflow foundation is active."
