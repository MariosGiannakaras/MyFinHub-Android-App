name: Android CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.project.outputs.present == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.project.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Generate wrapper for validation when not committed yet
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi

      - name: Unit tests, lint and debug assembly
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: ./gradlew test lint assembleDebug --stacktrace

      - name: No Android project yet
        if: steps.project.outputs.present != 'true'
        run: echo "Android source has not landed on this branch yet; workflow foundation is active."
