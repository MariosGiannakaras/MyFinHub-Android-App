name: Android CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android API 37
        shell: bash
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Verify Gradle wrapper
        shell: bash
        run: test -f gradle/wrapper/gradle-wrapper.jar

      - name: Unit tests, lint and debug assembly
        shell: bash
        run: ./gradlew test lint assembleDebug --stacktrace
