name: S5 tracking handoff helper

on:
  push:
    branches:
      - automation/s4-tracking-close-20260913

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S5 target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s5-home-accounts
          fetch-depth: 0

      - name: Record S5 implementation handoff
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('tracking/android-project-state.json')
          state = json.loads(path.read_text(encoding='utf-8'))

          workstream = state['active_workstream']
          workstream['status'] = 'android_redesign_s5_home_accounts_implementation'
          workstream['summary'] = (
              'S1–S4 are complete and merged. S5 Home and accounts is now active on '
              'android/redesign-s5-home-accounts from develop merge fda679687865346cde9a2b6a21ac9464c74b7ba8. '
              'The coherent Android-only S5 batch owns compact Home/attention, Wallet account grouping, account detail/ledger and net-position entry. '
              'No backend or web/desktop changes are authorized.'
          )
          workstream['next'] = [
              'Implement S5.1–S5.3 as one coherent Home/accounts batch: compact Home hierarchy, actionable attention, flat Wallet account groups, account-scoped ledger and explicit net-position detail without unsupported account administration.',
              'Add focused S5 regression/navigation/accessibility and real-render light/dark/150% coverage, then run one consolidated hosted validation and personally inspect only intentional screenshot differences before completing S5.4.'
          ]

          current = state['current_redesign_pass']
          current['branch'] = 'android/redesign-s5-home-accounts'
          current['pr'] = None
          current['current_slice'] = 'S5.1 / S5.2 / S5.3 / S5.4'
          current['checkpoint'] = 's5_batch_implementation'
          current['next_action'] = (
              'Implement the coherent S5 Home/accounts batch on android/redesign-s5-home-accounts, then open one PR and run consolidated validation after focused coverage is ready.'
          )
          current['blockers'] = []

          s5 = next(task for task in state['redesign_tasks'] if task['id'] == 'S5')
          for subtask in s5['subtasks']:
              subtask['status'] = 'in_progress'
              subtask['evidence'] = []
              subtask.pop('blocker', None)

          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 scripts/render_project_tracking.py
          python3 scripts/render_project_tracking.py --check

          git add tracking/android-project-state.json STATUS.md TODO.md docs/CURRENT_HANDOFF.md
          mapfile -t changed < <(git diff --cached --name-only)
          if [[ "${#changed[@]}" -ne 4 ]]; then
            echo "Expected exactly four tracking files, found ${#changed[@]}."
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          for expected in STATUS.md TODO.md docs/CURRENT_HANDOFF.md tracking/android-project-state.json; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$expected" || {
              echo "Missing expected tracking file: $expected"
              exit 1
            }
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: start S5 Home and accounts tracking"
          git push origin HEAD:android/redesign-s5-home-accounts
