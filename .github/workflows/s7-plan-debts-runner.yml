name: S7 Plan and Debts Runner

on:
  push:
    branches:
      - automation/s2-checkpoint-sync
    paths:
      - '.github/workflows/s7-plan-debts-runner.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout S7 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s7-plan-debts
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        shell: bash
        run: bash scripts/install-android-sdk.sh

      - name: Apply checked S7 payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/s2-checkpoint-sync
          git show origin/automation/s2-checkpoint-sync:.github/workflows/s7-plan-debts-batch.yml \
            | sed -n '/^      - name: Apply coherent S7 production batch$/,/^      - name: Targeted S7 compile and tests$/p' \
            | sed '1,3d;$d;s/^          //' > /tmp/apply-s7.sh
          test -s /tmp/apply-s7.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-s7.sh')
          text = path.read_text()
          old = """if text.count(old_plan) != 1:
              raise SystemExit('MyFinHubApp: canonical Plan route block did not match exactly')
          text = text.replace(old_plan, new_plan, 1)"""
          new = """if text.count(old_plan) == 1:
              text = text.replace(old_plan, new_plan, 1)
          else:
              start_marker = '                entry<AppRoute.Plan> {'
              end_marker = '                entry<AppRoute.PlanItem> {'
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + new_plan + text[end:]"""
          if old not in text:
              raise SystemExit('route transform guard not found in extracted payload')
          path.write_text(text.replace(old, new, 1))
          PY
          bash /tmp/apply-s7.sh

      - name: Targeted S7 compile and tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug compileDebugKotlin --stacktrace
          git diff --check

      - name: Commit coherent S7 batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/src/test app/src/androidTest app/src/screenshotTest
          git commit -m 'feat(android): implement S7 plan forecast budget and debts'
          git push origin HEAD:android/redesign-s7-plan-debts
