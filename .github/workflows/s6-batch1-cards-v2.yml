name: S6 Cards Batch 1 V2

on:
  push:
    branches:
      - automation/s2-checkpoint-sync
    paths:
      - '.github/workflows/s6-batch1-cards-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout S6 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: android/redesign-s6-cards
          fetch-depth: 0

      - name: Checkout automation transforms
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/s2-checkpoint-sync
          path: _automation
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.7.0'

      - name: Provision Android SDK
        run: bash scripts/install-android-sdk.sh

      - name: Apply coherent S6 batch
        run: python3 _automation/scripts/s6_batch1_apply.py

      - name: Check diff and compile affected sources
        run: |
          git diff --check
          ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Commit coherent S6 batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/myfinhub/android/feature/money/WalletAccountsScreens.kt
          git add app/src/main/java/app/myfinhub/android/feature/money/CanonicalCardDetailScreen.kt
          git add app/src/main/java/app/myfinhub/android/app/MyFinHubApp.kt
          git add app/src/androidTest/java/app/myfinhub/android/feature/money/S6CardSurfaceTest.kt
          git diff --cached --check
          git commit -m "feat(android): start S6 stable card list and detail"
          git push origin HEAD:android/redesign-s6-cards
