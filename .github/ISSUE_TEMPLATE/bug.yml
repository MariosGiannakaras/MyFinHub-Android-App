name: Bug report
description: Report a reproducible Android defect without including private finance data.
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic/redacted values only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Android/device/build context
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include real finance data, credentials, tokens, PAN/expiry/CVV or other secrets.
          required: true
